  /* Only a real lift ends a stroke. pointerleave does not: with capture the
     finger can wander past the canvas edge mid-line and must keep drawing. */
  function up(e) {
    if (scene === 'title') { Title.pointer(e.type === 'pointercancel' ? 'cancel' : 'up', e); return; }
    if (scene === 'campaign') { Campaign.pointer(e.type === 'pointercancel' ? 'cancel' : 'up', e); return; }
    if (scene === 'daily') { Daily.pointer(e.type === 'pointercancel' ? 'cancel' : 'up', e); return; }
    if (scene === 'leaderboard') { Board.pointer(e.type === 'pointercancel' ? 'cancel' : 'up', e); return; }
    if (e.pointerId !== penId) return;
    penId = null;
    if (pendTap) {
      const what = pendTap.what; pendTap = null;
      if (what === 'back') goBack(); else Sound.toggle();
      return;
    }
    if (drawing) {
      e.preventDefault();
      if (mouseF.on && e.type === 'pointerup') extendStroke(toWorld(e.clientX, e.clientY));
      if (drawing) endStroke();
    }
  }
  cv.addEventListener('pointerup', up, { passive: false });
  cv.addEventListener('pointercancel', up, { passive: false });
  cv.addEventListener('contextmenu', function (e) { e.preventDefault(); });
  cv.addEventListener('pointerleave', function () {
    if (scene === 'title') Title.leave();
    if (scene === 'campaign') Campaign.leave();
    if (scene === 'daily') Daily.leave();
    if (scene === 'leaderboard') Board.leave();
  });

  window.addEventListener('keydown', function (e) {
    if (Daily.editing() || Board.editing()) return; // typing a name
    Sound.wake();
    if (e.key === 'm' || e.key === 'M') { Sound.toggle(); e.preventDefault(); return; }
    if (scene === 'title') { Title.key(e); return; }
    if (scene === 'campaign') { Campaign.key(e); return; }
    if (scene === 'daily') { Daily.key(e); return; }
    if (scene === 'leaderboard') { Board.key(e); return; }
    if (e.key === 'Escape') { goBack(); e.preventDefault(); return; }
    if (e.key === 'r' || e.key === 'R') { restart(); e.preventDefault(); }
    else if ((e.key === 'p' || e.key === 'P') && !LEVEL.course) { startReplay(); e.preventDefault(); }
    else if (e.key === ' ' || e.key === 'Enter') {
      if (state === 'dead' && MODE === 'zen') return;
      if (state === 'win' && winT < cardAt()) return;
      if (state === 'dead' || state === 'win' || state === 'replay') { restart(); e.preventDefault(); }
    }
  });

  /* ── rendering ──────────────────────────────────────────────────────── */
  let viewL = 0, viewR = 0;

  function worldT() {
    const k = DPR * scale;
    const sx = shake > 0 ? nn(boil * 3.1) * shake * 6 : 0;
    const sy = shake > 0 ? nn(boil * 7.7) * shake * 6 : 0;
    ctx.setTransform(k, 0, 0, k, (-camX + sx) * k, (-camY + sy) * k);
  }
  function screenT() { const k = DPR * scale; ctx.setTransform(k, 0, 0, k, 0, 0); }

  function render() {
    if (scene === 'title') { Title.render(); return; }
    if (scene === 'campaign') { Campaign.render(); return; }
    if (scene === 'daily') { Daily.render(); return; }
    if (scene === 'leaderboard') { Board.render(); return; }
    const pose = state === 'replay' ? replayPose() : null;
    if (pose) { camX = pose.cx; camY = pose.cy; }
    viewL = camX - 40; viewR = camX + VW + 40;

    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.drawImage(paper, 0, 0);

    worldT();
    drawPrinted();
    drawNotes();
    drawTitle();
    drawPlinths();
    drawHazards();
    drawDrops();
    drawFinish();
    if (LEVEL.course) drawCourseMarks();

    if (ghost.length && state === 'play') {
      for (const s of ghost) drawStroke(s, Infinity, 0.1);
    }
    const maxT = state === 'replay' ? replayT : Infinity;
    drawScratches();
    for (const s of strokes) drawStroke(s, maxT, 1);

    drawMotes();
    drawSplats();

    if (state === 'replay') drawBallAt(pose.x, pose.y, pose.a, 0, 0, false);
    else if (state !== 'dead') {
      const inside = LEVEL.house && state === 'win' ? Math.max(0, 1 - homeT / 0.45) : 1;
      if (inside > 0) { ctx.save(); ctx.globalAlpha = inside; drawBallAt(ball.x, ball.y, ball.ang, ball.vx, ball.vy, ball.grounded); ctx.restore(); }
    }

    drawHint();
    if (state === 'win' && !LEVEL.house && winT < cardAt() + 0.15) {    // HOME!, scribbled over him
      ctx.save();
      const size = Math.min(40, VW * 0.06), txt = 'HOME!';
      ctx.font = size + 'px ' + FD; ctx.fillStyle = RED;
      const tw = ctx.measureText(txt).width, k = Math.min(1, winT / 0.28);
      const hx = ball.x - tw / 2, hy = Math.min(ball.y, G) - 44;
      ctx.beginPath(); ctx.rect(hx - 4, hy - size * 1.2, (tw + 8) * k, size * 1.6); ctx.clip();
      ctx.translate(hx, hy); ctx.rotate(-0.06); ctx.fillText(txt, 0, 0);
      ctx.restore();
    }

    screenT();
    const onCard = state === 'win' && winT >= cardAt();
    if (MODE !== 'zen' && !onCard) drawInkwell();
    if (LEVEL.course) { drawRunHud(); drawRegionLabel(); } else drawHud();
    if (state === 'dead') LEVEL.course ? (MODE !== 'zen' && drawRunCard()) : drawDeadCard();
    if (onCard) { drawWinCard(); drawInkwell(wellPose); }
    if (state === 'replay') drawReplayBanner();
    drawTurn();                                // the last page being pulled away
  }

  /* strokes ------------------------------------------------------------ */
  /* The player's line, in the world's own material. Only the look changes:
     the ground is the same centre line in every world (see pushPoint), so a
     wide highlighter or a chunky crayon never adds or removes anything Inky
     can touch. Every material skips the same points when the well runs dry. */
  function segVisible(p, i, maxT) {
    const a = p[i], b = p[i + 1];
    if (b.t > maxT) return -1;
    if ((a.x < viewL && b.x < viewL) || (a.x > viewR && b.x > viewR)) return 0;
    if (b.dry === 3 && (i % 7) < 2) return 0;          // gaps are ink, not ground
    if (b.dry === 2 && (i % 13) === 0) return 0;
    return 1;
  }
  /* one path along the visible part of a stroke, offset down by dy */
  function strokePath(p, maxT, dy) {
    ctx.beginPath();
    let open = false;
    for (let i = 0; i < p.length - 1; i++) {
      const v = segVisible(p, i, maxT);
      if (v < 0) break;
      if (!v) { open = false; continue; }
      if (!open) { ctx.moveTo(p[i].x, p[i].y + dy); open = true; }
      ctx.lineTo(p[i + 1].x, p[i + 1].y + dy);
    }
  }
  const RAINBOW = [];
  for (let h = 0; h < 360; h += 6) RAINBOW.push('hsl(' + h + ',72%,' + (h > 40 && h < 80 ? 45 : 51) + '%)');
  function drawStroke(s, maxT, alpha) {
    const p = s.pts;
    if (p.length < 2) return;
    if (s.minX > viewR || s.maxX < viewL) return;
    const kind = THEME.kind;
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';

    if (kind === 'highlighter') {
      /* a chisel-tip marker: one broad translucent pass hanging just under the
         line, its top edge a little stronger — that edge is where Inky runs.
         Multiply, so where two strokes cross the colour deepens. */
      ctx.save();
      ctx.globalCompositeOperation = 'multiply';
      ctx.globalAlpha = alpha;
      ctx.lineCap = 'butt';
      ctx.strokeStyle = 'rgba(255,226,0,0.62)'; ctx.lineWidth = 13;
      strokePath(p, maxT, 5.2); ctx.stroke();
      ctx.strokeStyle = 'rgba(255,196,0,0.5)'; ctx.lineWidth = 2.2;       // a ragged lower edge
      strokePath(p, maxT, 11.2); ctx.stroke();
      ctx.restore();
      ctx.globalAlpha = alpha * 0.95;
      ctx.strokeStyle = '#D9A400'; ctx.lineWidth = 1.7;                   // the edge Inky runs on
      strokePath(p, maxT, -0.6); ctx.stroke();
      ctx.globalAlpha = 1;
      return;
    }

    if (kind === 'crayon') {
      /* a rainbow crayon: the colour turns with distance along the stroke,
         never with time. Drawn in short runs of one colour, then a pass of
         paper-coloured grain where the wax skips over the tooth. */
      ctx.globalAlpha = alpha;
      ctx.lineCap = 'round';
      let i = 0;
      while (i < p.length - 1) {
        const v = segVisible(p, i, maxT);
        if (v < 0) break;
        if (!v) { i++; continue; }
        const L = p[i].L || 0, col = RAINBOW[Math.floor(((L * 0.42) % 360) / 6)];
        const i0 = i, wd = 6.8 + (p[i + 1].w - 4) * 0.5;
        ctx.beginPath(); ctx.moveTo(p[i].x, p[i].y);
        let k = 0;
        while (i < p.length - 1 && k < 6 && segVisible(p, i, maxT) === 1) { ctx.lineTo(p[i + 1].x, p[i + 1].y); i++; k++; }
        ctx.strokeStyle = col;
        ctx.globalAlpha = alpha * 0.92; ctx.lineWidth = wd; ctx.stroke();
        if (i === i0) i++;
      }
      ctx.globalAlpha = alpha * 0.55;                    // wax skipping over the tooth, and a rough edge
      ctx.strokeStyle = PAPER; ctx.lineWidth = 1.3; ctx.lineCap = 'butt';
      ctx.setLineDash([2, 5, 1, 7]);
      ctx.lineDashOffset = s.seed;
      strokePath(p, maxT, 1.6); ctx.stroke();
      ctx.lineDashOffset = s.seed * 1.7;
      strokePath(p, maxT, -1.8); ctx.stroke();
      ctx.lineWidth = 1.1; ctx.setLineDash([1, 3, 2, 4]); ctx.lineDashOffset = s.seed * 0.7;
      strokePath(p, maxT, 3.6); ctx.stroke();
      ctx.setLineDash([]); ctx.lineDashOffset = 0;
      ctx.globalAlpha = 1;
      return;
    }

    /* pen (Notebook, and the procedural modes) and white drafting pencil
       (Blueprint): the nib varies, a pencil is lighter and has grain */
    const pencil = kind === 'blueprint';
    ctx.strokeStyle = INK;
    for (let i = 0; i < p.length - 1; i++) {
      const v = segVisible(p, i, maxT);
      if (v < 0) break;
      if (!v) continue;
      const a = p[i], b = p[i + 1];
      ctx.globalAlpha = alpha * (b.dry ? 1 - b.dry * 0.12 : 1) * (pencil ? 0.9 : 1);
      ctx.lineWidth = pencil ? 1.2 + b.w * 0.55 : b.w;
      ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
    }
    if (pencil) {                                       // graphite grain along the edge
      ctx.globalAlpha = alpha * 0.45; ctx.strokeStyle = THEME.soft; ctx.lineWidth = 0.9; ctx.lineCap = 'butt';
      ctx.setLineDash([3, 4, 1, 5]); ctx.lineDashOffset = s.seed;
      strokePath(p, maxT, 1.9); ctx.stroke();
      ctx.setLineDash([]); ctx.lineDashOffset = 0;
    }
    ctx.globalAlpha = 1;
    if (pencil) return;                                 // a pencil does not blot
    ctx.fillStyle = INK;
    for (const bl of s.blots) {
      if (bl.x < viewL || bl.x > viewR) continue;
      ctx.beginPath(); ctx.arc(bl.x, bl.y, bl.r, 0, 6.2832); ctx.fill();
    }
  }

  /* the dry nib: marks with no ground under them ------------------------ */
  function drawScratches() {
    if (!scratches.length) return;
    ctx.strokeStyle = INK; ctx.lineCap = 'butt'; ctx.lineWidth = 0.9;
    for (const sc of scratches) {
      if (sc.x < viewL || sc.x > viewR) continue;
      ctx.globalAlpha = 0.13 + n1(sc.seed) * 0.12;
      const c = Math.cos(sc.a), sn = Math.sin(sc.a);
      for (let k = -1; k <= 1; k++) {
        const o = k * 1.6, len = 2.5 + n1(sc.seed + k * 3) * 5;
        ctx.beginPath();
        ctx.moveTo(sc.x - c * len - sn * o, sc.y - sn * len + c * o);
        ctx.lineTo(sc.x + c * len - sn * o, sc.y + sn * len + c * o);
        ctx.stroke();
      }
    }
    ctx.globalAlpha = 1;
  }

  /* the mediums' own marks, always under the ink ------------------------ */
  /* a highlighter swipe hanging under a printed line: one flat chisel pass,
     its ends a little ragged, overlapping marks darken where they cross */
  function hlBand(pts, col, depth) {
    ctx.save();
    ctx.globalCompositeOperation = 'multiply';
    ctx.strokeStyle = col; ctx.lineWidth = depth; ctx.lineCap = 'butt'; ctx.lineJoin = 'round';
    ctx.beginPath();
    for (let i = 0; i < pts.length; i++) {
      const q = pts[i], y = q.y + depth * 0.5 - 1 + nn(q.x * 0.05 + 3) * 0.8;
      i ? ctx.lineTo(q.x, y) : ctx.moveTo(q.x - 4 + nn(q.x) * 2, y);
    }
    ctx.stroke();
    ctx.restore();
  }
  /* wax: a few rough passes of one colour along a path */
  function waxPath(pts, col, width, alpha, seed) {
    ctx.save();
    ctx.strokeStyle = col; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    for (let k = 0; k < 3; k++) {
      ctx.globalAlpha = alpha * (0.5 + 0.25 * k);
      ctx.lineWidth = width * (1.15 - k * 0.22);
      ctx.beginPath();
      for (let i = 0; i < pts.length; i++) {
        const q = pts[i], j = nn(q.x * 0.37 + k * 13 + seed) * width * 0.22;
        i ? ctx.lineTo(q.x, q.y + j) : ctx.moveTo(q.x, q.y + j);
      }
      ctx.stroke();
    }
    ctx.restore();
  }
  /* wax scribbled back and forth to fill a box */
  function waxFill(x0, y0, x1, y1, col, alpha, seed) {
    ctx.save();
    ctx.beginPath(); ctx.rect(x0, y0, x1 - x0, y1 - y0); ctx.clip();
    ctx.strokeStyle = col; ctx.globalAlpha = alpha; ctx.lineWidth = 5; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    ctx.beginPath();
    const step = 7, span = (y1 - y0);
    let up = true;
    for (let x = x0 - span; x < x1 + 8; x += step) {
      const a = [x + nn(x + seed) * 2, up ? y1 + 4 : y0 - 4], b = [x + span + nn(x * 1.7 + seed) * 2, up ? y0 - 4 : y1 + 4];
      if (x === x0 - span) ctx.moveTo(a[0], a[1]);
      ctx.lineTo(a[0], a[1]); ctx.lineTo(b[0], b[1]);
      up = !up;
    }
    ctx.stroke();
    ctx.restore();
  }

  /* printed floors ----------------------------------------------------- */
  function drawPrinted() {
    const kind = THEME.kind;
    if (kind === 'highlighter' || kind === 'crayon') {
      for (const pts of printedPolys) {
        if (pts[pts.length - 1].x < viewL || pts[0].x > viewR) continue;
        if (kind === 'highlighter') hlBand(pts, THEME.hl[pts.hl || (LEVEL.course ? 'ygbo'[Math.floor(n1(pts[0].x * 0.013) * 4)] : 'y')], 15);
        else if (pts.wax === 'roof') waxPath(pts, THEME.wax.earth, 7, 0.7, pts[0].x);
        else {
          const below = pts.map(function (q) { return { x: q.x, y: q.y + 7 }; });
          waxPath(below, THEME.wax[pts.wax || 'earth'], 11, 0.32, pts[0].x);
          waxPath(pts, THEME.wax.grass, 5, 0.75, pts[0].x + 7);
        }
      }
    }
    ctx.strokeStyle = SOFT; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    for (const pts of printedPolys) {
      if (pts[pts.length - 1].x < viewL || pts[0].x > viewR) continue;
      ctx.lineWidth = 2.6;
      ctx.beginPath();
      for (let i = 0; i < pts.length; i++) i ? ctx.lineTo(pts[i].x, pts[i].y) : ctx.moveTo(pts[i].x, pts[i].y);
      ctx.stroke();
      // a lighter second pass for a printed, slightly doubled look
      ctx.globalAlpha = 0.26; ctx.lineWidth = 1.1;
      ctx.beginPath();
      for (let i = 0; i < pts.length; i++) {
        const y = pts[i].y + 1.9 + nn(pts[i].x * 0.5) * 0.6;
        i ? ctx.lineTo(pts[i].x, y) : ctx.moveTo(pts[i].x, y);
      }
      ctx.stroke(); ctx.globalAlpha = 1;
    }
  }

  /* annotations: the drawing's own notes, never solid ------------------ */
  function drawNotes() {
    if (LEVEL.course && THEME.kind !== 'blueprint') return;     // the generator's notes are blueprint annotations
    const notes = LEVEL.course ? notesLive : LEVEL.notes;
    if (!notes || !notes.length) return;
    ctx.save();
    ctx.strokeStyle = THEME.note; ctx.fillStyle = THEME.note;
    ctx.lineWidth = 1.25; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    ctx.textBaseline = 'alphabetic';
    const slash = function (x, y) { ctx.beginPath(); ctx.moveTo(x - 4, y + 4); ctx.lineTo(x + 4, y - 4); ctx.stroke(); };
    const head = function (x, y, dir) {
      ctx.beginPath(); ctx.moveTo(x - dir * 9, y - 4.5); ctx.lineTo(x, y); ctx.lineTo(x - dir * 9, y + 4.5); ctx.stroke();
    };
    for (const n of notes) {
      const xa = n.x0 !== undefined ? n.x0 : n.x, xb = n.x1 !== undefined ? n.x1 : n.x + (n.dx || 0);
      if (Math.max(xa, xb) + 120 < viewL || Math.min(xa, xb) - 120 > viewR) continue;
      ctx.globalAlpha = n.t === 'cl' ? 0.22 : 0.55;
      ctx.font = '600 15px ' + FH;
      if (n.t === 'dim') {                         // a dimension: the span, measured
        const y = G - n.h;
        ctx.beginPath(); ctx.moveTo(n.x0, y); ctx.lineTo(n.x1, y); ctx.stroke();
        for (const x of [n.x0, n.x1]) {
          slash(x, y);
          ctx.beginPath(); ctx.moveTo(x, y - 7); ctx.lineTo(x, y + 26); ctx.stroke();
        }
        ctx.textAlign = 'center'; ctx.fillText(n.label, (n.x0 + n.x1) / 2, y - 6); ctx.textAlign = 'left';
      } else if (n.t === 'vdim') {                 // a clearance, measured
        const y0 = G - n.h0, y1 = G - n.h1;
        ctx.beginPath(); ctx.moveTo(n.x, y0); ctx.lineTo(n.x, y1); ctx.stroke();
        slash(n.x, y0); slash(n.x, y1);
        ctx.save(); ctx.translate(n.x - 7, (y0 + y1) / 2); ctx.rotate(-Math.PI / 2);
        ctx.textAlign = 'center'; ctx.font = '600 13px ' + FH; ctx.fillText(n.label, 0, 0); ctx.restore();
      } else if (n.t === 'arc') {                  // a sketched trajectory, computed honestly
        ctx.setLineDash([7, 7]);
        ctx.beginPath();
        let last = null;
        for (let tt = 0; tt < 3; tt += 0.02) {
          const x = n.x0 + n.vx * tt, y = G - (n.h0 + n.vy * tt - 0.5 * GRAV * tt * tt);
          if (x > n.x1) break;
          last = [x, y, n.vx, -(n.vy - GRAV * tt)];
          tt ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
        }
        ctx.stroke(); ctx.setLineDash([]);
        if (last) {
          const a = Math.atan2(-last[3], last[2]);
          ctx.save(); ctx.translate(last[0], last[1]); ctx.rotate(a); head(0, 0, 1); ctx.restore();
        }
      } else if (n.t === 'arrow') {                // stair notation: UP / DN
        const y = G - n.h, dir = n.dx > 0 ? 1 : -1;
        ctx.beginPath(); ctx.moveTo(n.x, y); ctx.lineTo(n.x + n.dx, y); ctx.stroke();
        head(n.x + n.dx, y, dir);
        ctx.beginPath(); ctx.arc(n.x, y, 3, 0, 6.2832); ctx.stroke();
        ctx.fillText(n.label, n.x + 8, y - 7);
      } else if (n.t === 'text') {
        if (THEME.kind === 'highlighter') {                 // a margin note, marked
          ctx.save(); ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'multiply';
          ctx.fillStyle = THEME.hl[n.hl || 'y']; ctx.font = '600 19px ' + FH;
          const tw = ctx.measureText(n.text).width;
          ctx.translate(n.x - 4, G - n.h - 14); ctx.rotate(-0.03); ctx.fillRect(0, 0, tw + 10, 19);
          ctx.restore();
          ctx.font = '600 19px ' + FH; ctx.globalAlpha = 0.8;
        }
        ctx.fillText(n.text, n.x, G - n.h);
      } else if (n.t === 'box') {                  // the title block every sheet carries
        const y0 = G - n.h0, y1 = G - n.h1, rowH = (y1 - y0) / n.lines.length;
        ctx.strokeRect(n.x0, y0, n.x1 - n.x0, y1 - y0);
        ctx.strokeRect(n.x0 + 3, y0 + 3, n.x1 - n.x0 - 6, y1 - y0 - 6);
        n.lines.forEach(function (ln, i) {
          if (i) { ctx.beginPath(); ctx.moveTo(n.x0 + 3, y0 + rowH * i); ctx.lineTo(n.x1 - 3, y0 + rowH * i); ctx.stroke(); }
          ctx.font = (i ? '600 13px ' : '700 16px ') + FH;
          ctx.fillText(ln, n.x0 + 12, y0 + rowH * i + rowH * 0.68);
        });
      } else if (n.t === 'cl') {                   // a construction line, long dash-dot
        const y = G - n.h;
        ctx.setLineDash([22, 6, 3, 6]);
        ctx.beginPath(); ctx.moveTo(n.x0, y); ctx.lineTo(n.x1, y); ctx.stroke();
        ctx.setLineDash([]);
      }
    }
    ctx.restore();
    ctx.globalAlpha = 1;
  }

  /* title -------------------------------------------------------------- */
  /* A campaign page is labelled as you arrive: its name written onto the
     paper left to right in about two thirds of a second, with a quick
     underline. Nothing waits for it — Inky is already moving. */
  let labelAt = 0;
  function drawTitle() {
    if (camX > 900) return;
    const fade = attempt > 1 ? 0.42 : 1;
    ctx.globalAlpha = fade * Math.max(0, Math.min(1, (900 - camX) / 220));
    ctx.fillStyle = INK;
    ctx.textBaseline = 'alphabetic';
    const size = Math.min(54, VW * 0.082);
    ctx.font = size + 'px ' + FD;
    const name = LEVEL.course ? LEVEL.name : LEVEL.name.toUpperCase();
    const wk = LEVEL.course || REDUCED ? 1 : Math.max(0, Math.min(1, (performance.now() - labelAt) / 650));
    if (wk < 1) {
      const tw = ctx.measureText(name).width;
      ctx.save(); ctx.beginPath(); ctx.rect(56, G - 74 - size * 1.3, tw * wk + 6, size * 1.6); ctx.clip();
      ctx.fillText(name, 62, G - 74); ctx.restore();
      const px = 62 + tw * wk, py = G - 74 - size * 0.3 + Math.sin(wk * 40) * size * 0.25;   // the nib, writing
      ctx.save(); ctx.globalAlpha *= 0.6; ctx.beginPath(); ctx.arc(px, py, 2.4, 0, 6.2832); ctx.fill(); ctx.restore();
    } else ctx.fillText(name, 62, G - 74);
    const uk = LEVEL.course ? 0 : Math.max(0, Math.min(1, (performance.now() - labelAt - 550) / 250));
    if (uk > 0 && !REDUCED) {
      const tw = ctx.measureText(name).width;
      ctx.save(); ctx.strokeStyle = RED; ctx.lineWidth = 2.4; ctx.lineCap = 'round'; ctx.globalAlpha *= 0.8;
      ctx.beginPath();
      for (let q = 0; q <= tw * uk; q += 9) ctx.lineTo(60 + q, G - 64 + nn(q * 0.3 + 5) * 1.3 + q * 0.012);
      ctx.stroke(); ctx.restore();
    }
    ctx.fillStyle = RED;
    ctx.font = Math.round(size * 0.52) + 'px ' + FH;
    ctx.fillText(LEVEL.course ? courseLine() : levelLine(), 66, G - 36);
    ctx.globalAlpha = 1;
  }


  /* plinths ------------------------------------------------------------ */
  function drawPlinths() {
    for (const p of plinthShapes) {
      if (p.x1 < viewL || p.x0 > viewR) continue;
      if (THEME.kind === 'highlighter') {
        ctx.save(); ctx.globalCompositeOperation = 'multiply'; ctx.fillStyle = THEME.hl.b;
        ctx.fillRect(p.x0 + 2, p.y + 2, p.x1 - p.x0 - 4, G + 6 - p.y); ctx.restore();
      } else if (THEME.kind === 'crayon') {
        waxFill(p.x0 + 3, p.y + 3, p.x1 - 3, G + 6, p.wax ? THEME.wax[p.wax] : (p.x0 / 10 | 0) % 2 ? THEME.wax.rose : THEME.wax.sea, 0.3, p.x0);
        if (p.wax !== 'grass' && p.x1 - p.x0 < 300) {             // a building: its windows
          ctx.save(); ctx.strokeStyle = INK; ctx.globalAlpha = 0.5; ctx.lineWidth = 1.8;
          for (let wy = p.y + 18; wy < G - 22; wy += 34)
            for (let wx = p.x0 + 20; wx < p.x1 - 34; wx += 42) {
              ctx.beginPath(); ctx.rect(wx + nn(wx + wy) * 1.5, wy, 20, 16); ctx.stroke();
              ctx.beginPath(); ctx.moveTo(wx + 10, wy); ctx.lineTo(wx + 10, wy + 16); ctx.stroke();
            }
          ctx.restore();
        }
      }
      ctx.save();
      ctx.beginPath();
      ctx.moveTo(p.top[0].x, G + 6);
      for (const q of p.top) ctx.lineTo(q.x, q.y);
      ctx.lineTo(p.x1 + nn(boil) * 0.8, G + 6);
      ctx.closePath();
      ctx.clip();
      ctx.strokeStyle = SOFT; ctx.lineWidth = 1.5; ctx.globalAlpha = 0.5;
      for (let x = p.x0 - 160; x < p.x1 + 20; x += 11) {
        ctx.beginPath(); ctx.moveTo(x, G + 10); ctx.lineTo(x + 170, p.y - 12); ctx.stroke();
      }
      ctx.restore();
      ctx.globalAlpha = 1;
      ctx.strokeStyle = INK; ctx.lineWidth = 3.1; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
      ctx.beginPath();
      ctx.moveTo(p.x0 + nn(boil * 1.3) * 1.2, G + 6);
      for (const q of p.top) ctx.lineTo(q.x, q.y + nn(q.x + boil) * 0.6);
      ctx.lineTo(p.x1 + nn(boil * 2.1) * 1.2, G + 6);
      ctx.stroke();
    }
  }

  /* hazards ------------------------------------------------------------ */
  function hatch(x0, y0, x1, y1, gap, slantDown) {
    ctx.save();
    ctx.beginPath(); ctx.rect(x0, y0, x1 - x0, y1 - y0); ctx.clip();
    ctx.strokeStyle = INK; ctx.lineWidth = 1.5; ctx.globalAlpha = 0.72;
    const span = (y1 - y0) + (x1 - x0);
    for (let i = -span; i < span; i += gap) {
      ctx.beginPath();
      if (slantDown) { ctx.moveTo(x0 + i, y0 - 4); ctx.lineTo(x0 + i + (y1 - y0) + 8, y1 + 4); }
      else { ctx.moveTo(x0 + i, y1 + 4); ctx.lineTo(x0 + i + (y1 - y0) + 8, y0 - 4); }
      ctx.stroke();
    }
    ctx.restore(); ctx.globalAlpha = 1;
  }

  function inkEdge(pts, w) {
    ctx.strokeStyle = INK; ctx.lineWidth = w; ctx.lineJoin = 'round'; ctx.lineCap = 'round';
    ctx.beginPath();
    for (let i = 0; i < pts.length; i++) i ? ctx.lineTo(pts[i].x, pts[i].y) : ctx.moveTo(pts[i].x, pts[i].y);
    ctx.stroke();
  }

  function drawHazards() {
    for (const h of hazards) {
      if (h.x1 < viewL || h.x0 > viewR) continue;
      const hy0 = h.kind === 'ceil' ? camY - 120 : h.y0;
      if (THEME.kind === 'highlighter') {                    // danger is marked pink
        ctx.save(); ctx.globalCompositeOperation = 'multiply'; ctx.fillStyle = THEME.hl.p;
        ctx.beginPath();
        ctx.moveTo(h.x0 - 5, hy0); ctx.lineTo(h.x1 + 5, hy0);
        ctx.lineTo(h.x1 + 4 + nn(h.seed) * 2, h.y1 + 5); ctx.lineTo(h.x0 - 4 + nn(h.seed + 1) * 2, h.y1 + 6);
        ctx.closePath(); ctx.fill(); ctx.restore();
      } else if (THEME.kind === 'crayon') {                   // storm cloud, or something hot
        waxFill(h.x0 - 2, hy0, h.x1 + 2, h.y1 + 2, h.kind === 'ceil' ? THEME.wax.plum : THEME.wax.rose, 0.42, h.seed);
        if (h.kind === 'ceil') {                             // a bumpy underside and a bolt
          const pts = [];
          for (let x = h.x0 - 6; x <= h.x1 + 6; x += 6) pts.push({ x: x, y: h.y1 + 3 - Math.abs(Math.sin((x - h.x0) * 0.09)) * 7 });
          waxPath(pts, THEME.wax.plum, 7, 0.55, h.seed);
          const bx = (h.x0 + h.x1) / 2, by = h.y1 - 34;          // the bolt stays inside the cloud: only what kills looks like it
          waxPath([{ x: bx, y: by }, { x: bx - 7, y: by + 12 }, { x: bx + 3, y: by + 12 }, { x: bx - 5, y: by + 26 }], THEME.red, 3, 0.8, h.seed + 2);
        }
      }
      if (h.kind === 'ceil') {
        const top = camY - 120;
        hatch(h.x0, top, h.x1, h.y1, 13, true);
        const pts = [];
        for (let x = h.x0; x <= h.x1; x += 12)
          pts.push({ x: x, y: h.y1 + nn(x * 0.4 + h.seed + boil * 0.2) * 1.6 });
        inkEdge(pts, 3.4);
        ctx.strokeStyle = INK; ctx.lineWidth = 1.8;
        for (let x = h.x0 + 10; x < h.x1; x += 26) {
          const d = 5 + n1(x + boil) * 7;
          ctx.beginPath(); ctx.moveTo(x, h.y1); ctx.lineTo(x + nn(x) * 2, h.y1 + d); ctx.stroke();
        }
        ctx.strokeStyle = INK; ctx.lineWidth = 3.2;
        ctx.beginPath(); ctx.moveTo(h.x0, top); ctx.lineTo(h.x0, h.y1); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(h.x1, top); ctx.lineTo(h.x1, h.y1); ctx.stroke();
      } else if (h.kind === 'block') {
        const pts = [];
        for (let x = h.x0; x <= h.x1; x += 11) pts.push({ x: x, y: h.y0 + nn(x * 0.43 + boil) * 2 });
        hatch(h.x0, h.y0, h.x1, h.y1, 12, false);
        hatch(h.x0, h.y0, h.x1, h.y1, 20, true);
        inkEdge(pts, 3.6);
        ctx.beginPath();
        ctx.moveTo(h.x0 + nn(boil) * 1.4, h.y0); ctx.lineTo(h.x0 + nn(boil + 5) * 1.4, h.y1); ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(h.x1 + nn(boil + 2) * 1.4, h.y0); ctx.lineTo(h.x1 + nn(boil + 9) * 1.4, h.y1); ctx.stroke();
        ctx.fillStyle = RED; ctx.globalAlpha = 0.85;
        ctx.font = '16px ' + FH;
        ctx.fillText('!', h.x0 + (h.x1 - h.x0) / 2 - 3, h.y0 - 12);
        ctx.globalAlpha = 1;
      } else { // rock / spike
        const cx = (h.x0 + h.x1) / 2;
        const pts = [
          { x: h.x0 - 2, y: h.y1 }, { x: h.x0 + 1, y: h.y0 + (h.y1 - h.y0) * 0.35 },
          { x: cx + nn(boil) * 1.5, y: h.y0 }, { x: h.x1 - 1, y: h.y0 + (h.y1 - h.y0) * 0.3 },
          { x: h.x1 + 2, y: h.y1 },
        ];
        ctx.save();
        ctx.beginPath();
        for (let i = 0; i < pts.length; i++) i ? ctx.lineTo(pts[i].x, pts[i].y) : ctx.moveTo(pts[i].x, pts[i].y);
        ctx.closePath(); ctx.clip();
        hatch(h.x0 - 4, h.y0 - 4, h.x1 + 4, h.y1 + 4, 8, false);
        ctx.restore();
        inkEdge(pts, 3.2);
      }
    }
  }

  /* ink blots in the world --------------------------------------------- */
  function drawDrops() {
    const now = performance.now() * 0.002;
    for (const d of drops) {
      if (d.taken || d.x < viewL - 40 || d.x > viewR + 40) continue;
      const y = d.y + Math.sin(now + d.bob) * 3.2;
      ctx.save(); ctx.translate(d.x, y);
      ctx.strokeStyle = RED; ctx.globalAlpha = 0.42; ctx.lineWidth = 1.6;
      for (let i = 0; i < 6; i++) {
        const a = i / 6 * Math.PI * 2 + now * 0.3;
        ctx.beginPath();
        ctx.moveTo(Math.cos(a) * 19, Math.sin(a) * 19);
        ctx.lineTo(Math.cos(a) * 25, Math.sin(a) * 25);
        ctx.stroke();
      }
      ctx.globalAlpha = 1;
      ctx.fillStyle = INK;
      ctx.beginPath();
      ctx.moveTo(0, -15);
      ctx.bezierCurveTo(7, -5, 12, 1, 12, 5);
      ctx.bezierCurveTo(12, 12, 6, 15, 0, 15);
      ctx.bezierCurveTo(-6, 15, -12, 12, -12, 5);
      ctx.bezierCurveTo(-12, 1, -7, -5, 0, -15);
      ctx.fill();
      ctx.fillStyle = PAPER; ctx.globalAlpha = 0.75;
      ctx.beginPath(); ctx.ellipse(-4, 3, 2.1, 3.2, -0.5, 0, 6.2832); ctx.fill();
      ctx.globalAlpha = 1;
      ctx.restore();
    }
  }

  /* finish ------------------------------------------------------------- */
  /* The end of the last page: Inky's house, in crayon, on top of the hill.
     He goes in; the window comes on; a curl of smoke; one word. */
  function drawHouse(H) {
    const dx = H.x, base = G - H.h, wax = THEMES.crayon.wax;
    if (dx - 120 > viewR || dx + 120 < viewL) return;
    const x0 = dx - 58, x1 = dx + 62, top = base - 86, apex = base - 142;
    waxFill(x0, top, x1, base, wax.rose, 0.34, 7);
    ctx.save();                                        // the roof
    ctx.beginPath(); ctx.moveTo(x0 - 14, top + 2); ctx.lineTo(dx + 2, apex); ctx.lineTo(x1 + 14, top + 2); ctx.closePath(); ctx.clip();
    waxFill(x0 - 16, apex, x1 + 16, top + 3, wax.earth, 0.45, 11);
    ctx.restore();
    const edge = function (pts, w) { waxPath(pts.map(function (q) { return { x: q[0], y: q[1] }; }), INK, w, 0.85, pts[0][0]); };
    edge([[x0, base], [x0, top], [x1, top], [x1, base]], 3);
    edge([[x0 - 14, top + 2], [dx + 2, apex], [x1 + 14, top + 2]], 3.2);
    edge([[dx + 32, apex + 28], [dx + 32, apex + 6], [dx + 46, apex + 6], [dx + 46, apex + 42]], 2.6);   // chimney
    edge([[dx - 11, base], [dx - 11, base - 36], [dx + 11, base - 36], [dx + 11, base]], 2.6);            // the door
    const lit = Math.max(0, Math.min(1, (homeT - 0.55) / 0.35));
    if (lit > 0) { ctx.save(); ctx.globalAlpha = lit * 0.85; ctx.fillStyle = wax.sun; ctx.fillRect(dx + 22, base - 64, 24, 20); ctx.restore(); }
    edge([[dx + 22, base - 64], [dx + 46, base - 64], [dx + 46, base - 44], [dx + 22, base - 44], [dx + 22, base - 64]], 2.2);
    edge([[dx + 34, base - 64], [dx + 34, base - 44]], 1.6);
    if (lit > 0) {                                     // smoke
      const pts = [];
      for (let k = 0; k <= 14; k++) { const q = k / 14; pts.push({ x: dx + 39 + Math.sin(q * 9 + homeT * 2) * 7 * q + q * 16, y: apex + 2 - q * 60 * Math.min(1, lit + 0.2) }); }
      waxPath(pts, SOFT, 3, 0.45 * lit, 3);
    }
    const word = Math.max(0, Math.min(1, (homeT - 1.0) / 0.5));
    if (word > 0 && runNote && runNote.firstHome) {
      ctx.save(); ctx.globalAlpha = word; ctx.fillStyle = RED; ctx.font = '34px ' + FH; ctx.textAlign = 'center';
      ctx.fillText('home.', dx - 4, apex - 22); ctx.restore();
    }
  }

  function drawFinish() {
    const x = LEVEL.finish;
    if (LEVEL.house) { drawHouse(LEVEL.house); return; }
    if (x < viewL - 60 || x > viewR + 200) return;
    ctx.strokeStyle = INK; ctx.lineWidth = 2.4; ctx.lineCap = 'round';
    ctx.beginPath();
    let y = camY - 40;
    ctx.moveTo(x, y);
    while (y < G + 40) { y += 16; ctx.lineTo(x + nn(y * 0.7 + boil) * 7, y); }
    ctx.stroke();
    ctx.fillStyle = RED;
    ctx.font = Math.round(Math.min(46, VW * 0.062)) + 'px ' + FD;
    ctx.fillText('FIN', x + 26, G - 34);
    ctx.lineWidth = 3; ctx.strokeStyle = RED;
    ctx.beginPath();
    ctx.moveTo(x + 22, G - 18);
    ctx.bezierCurveTo(x + 60, G - 8, x + 92, G - 26, x + 128, G - 14);
    ctx.stroke();
  }

  /* splats + motes ------------------------------------------------------ */
  function blob(x, y, r, seed) {
    ctx.beginPath();
    const N = 11;
    for (let i = 0; i <= N; i++) {
      const a = i / N * Math.PI * 2;
      const rr = r * (0.76 + 0.44 * n1(i * 2.7 + seed));
      const px = x + Math.cos(a) * rr, py = y + Math.sin(a) * rr;
      i ? ctx.lineTo(px, py) : ctx.moveTo(px, py);
    }
    ctx.closePath(); ctx.fill();
  }
  function drawMotes() {
    ctx.fillStyle = INK;
    for (const m of motes) { if (m.x < viewL || m.x > viewR) continue; blob(m.x, m.y, m.r, m.seed); }
  }
  function drawSplats() {
    ctx.fillStyle = INK;
    for (const s of splats) {
      const k = Math.min(1, s.t / 0.16);
      // squashed flat against what he hit, then spreading back round
      const q = s.hard != null && !REDUCED ? Math.max(0, 1 - s.t / 0.14) * (0.25 + 0.3 * s.hard) : 0;
      ctx.save(); ctx.translate(s.x, s.y); ctx.rotate(s.ang || 0); ctx.scale(1 - q, 1 + q * 1.2);
      blob(0, 0, s.r * (0.55 + 0.45 * k), s.seed);
      ctx.restore();
      ctx.save(); ctx.globalAlpha = 0.9;
      for (let i = 0; i < 7; i++) {
        const a = i * 1.4 + s.seed;
        const d = s.r * (1.1 + n1(i + s.seed) * 1.6) * k;
        blob(s.x + Math.cos(a) * d, s.y + Math.sin(a) * d * 0.7, 1.6 + n1(i * 3 + s.seed) * 3.4, s.seed + i);
      }
      ctx.restore();
    }
  }

  /* the runner ---------------------------------------------------------- */
  function drawBallAt(x, y, ang, vx, vy, grounded) {
    const sp = Math.hypot(vx, vy);
    const st = Math.min(0.26, sp / 3400);
    ctx.save();
    ctx.translate(x, y);
    ctx.save();
    ctx.rotate(ang);
    ctx.fillStyle = INK;
    ctx.beginPath();
    const N = 15;
    for (let i = 0; i <= N; i++) {
      const a = i / N * Math.PI * 2;
      const rr = BALL_R * (1 + 0.06 * Math.sin(a * 3 + ball.seed) + 0.05 * nn(i + boil));
      const px = Math.cos(a) * rr * (1 + st), py = Math.sin(a) * rr * (1 - st * 0.6);
      i ? ctx.lineTo(px, py) : ctx.moveTo(px, py);
    }
    ctx.closePath(); ctx.fill();
    ctx.restore();

    // legs
    if (grounded) {
      ctx.strokeStyle = INK; ctx.lineWidth = 2.1; ctx.lineCap = 'round';
      for (let i = 0; i < 2; i++) {
        const ph = ball.step + i * Math.PI;
        const lx = Math.cos(ph) * 5, ly = 8 + Math.abs(Math.sin(ph)) * 3;
        ctx.beginPath(); ctx.moveTo(i ? 3 : -3, 6); ctx.lineTo(lx, ly + 4); ctx.stroke();
      }
    } else {
      ctx.strokeStyle = INK; ctx.lineWidth = 2.1; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(-3, 7); ctx.lineTo(-7, 12); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(3, 7); ctx.lineTo(8, 11); ctx.stroke();
    }
    // face stays upright
    ctx.fillStyle = PAPER;
    const d = vx >= 0 ? 1 : -1;
    const blink = n1(Math.floor(performance.now() * 0.0012)) > 0.93 ? 0.35 : 1;
    ctx.beginPath(); ctx.ellipse(1.6 * d, -3, 1.8, 1.9 * blink, 0, 0, 6.2832); ctx.fill();
    ctx.beginPath(); ctx.ellipse(5.4 * d, -2.4, 1.8, 1.9 * blink, 0, 0, 6.2832); ctx.fill();
    ctx.restore();
  }

  /* hint --------------------------------------------------------------- */
  function drawHint() {
    if (state !== 'play' || hasDrawn || everDrawn) return;
    if (ball.x < 300) return;
    const pulse = 0.6 + 0.4 * Math.sin(performance.now() * 0.005);
    ctx.globalAlpha = Math.min(1, (ball.x - 300) / 140) * pulse;
    ctx.strokeStyle = RED; ctx.lineWidth = 2.8; ctx.lineCap = 'round';
    ctx.setLineDash([9, 11]);
    ctx.beginPath();
    const hx = (LEVEL.hintX || LEVEL.printed[0].x1) + 14;
    for (let x = hx; x <= hx + 156; x += 10) ctx.lineTo(x, G + nn(x * 0.3) * 1.2);
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.beginPath();
    ctx.moveTo(hx + 156, G); ctx.lineTo(hx + 143, G - 8);
    ctx.moveTo(hx + 156, G); ctx.lineTo(hx + 143, G + 8);
    ctx.stroke();
    ctx.fillStyle = RED; ctx.font = '27px ' + FH;
    ctx.fillText('keep the line going', hx - 4, G - 22);
    ctx.globalAlpha = 1;
  }

  /* inkwell ------------------------------------------------------------ */
  function drawInkwell(pose) {
    const ratio = Math.max(0, Math.min(1, ink / INK_MAX));
    const bw = 76, bh = 84;
    const bx = pose ? 0 : 22, by = pose ? 0 : VH - 26 - bh;
    if (pose) { ctx.save(); ctx.translate(pose.x, pose.y); ctx.scale(pose.s, pose.s); }
    const low = ratio < DRY_THIN;
    const jit = low && !REDUCED ? nn(boil * 5.3) * 1.1 : 0;
    const lvl = Math.max(0, Math.min(1, well.shown));

    // the page shows through behind the well, so the level reads over any terrain
    ctx.save();
    if (pose) ctx.globalAlpha = 0;
    if (!pose) { ctx.globalAlpha = 0.82; } ctx.fillStyle = PAPER;
    ctx.beginPath();
    ctx.ellipse(bx + bw * 0.52, by + bh * 0.58, bw * 1.02, bh * 0.86, 0, 0, 6.2832);
    ctx.fill();
    ctx.restore();

    ctx.save();
    ctx.translate(bx + jit, by + well.bob * 0.4);

    // glass body
    const body = new Path2D();
    body.moveTo(10, 16);
    body.bezierCurveTo(2, 34, 0, 56, 3, bh - 6);
    body.bezierCurveTo(4, bh, 10, bh + 2, bw / 2, bh + 2);
    body.bezierCurveTo(bw - 10, bh + 2, bw - 4, bh, bw - 3, bh - 6);
    body.bezierCurveTo(bw, 56, bw - 2, 34, bw - 10, 16);
    body.closePath();

    ctx.globalAlpha = THEME.glassA; ctx.fillStyle = THEME.glass; ctx.fill(body); ctx.globalAlpha = 1;

    // — the ink itself: a body of liquid that leans, swells and settles —
    ctx.save();
    ctx.clip(body);
    const surf = bh + 2 - (bh - 12) * lvl + well.bob;
    const cxw = bw / 2;
    const t = performance.now() * 0.0022;
    const amp = (low ? 2.4 : 1.3) + Math.abs(well.tilt) * 5 + well.ripple * 2.6;
    ctx.fillStyle = INK;
    ctx.beginPath();
    ctx.moveTo(-6, bh + 8);
    ctx.lineTo(-6, surf);
    for (let x = -6; x <= bw + 6; x += 5) {
      const lean = (x - cxw) * well.tilt;          // the surface tips as one plane
      const wave = Math.sin(x * 0.13 + t * 2.6) * amp * 0.6
                 + Math.sin(x * 0.055 - t * 1.7) * amp * 0.5;
      ctx.lineTo(x, surf + lean + wave);
    }
    ctx.lineTo(bw + 6, bh + 8);
    ctx.closePath(); ctx.fill();

    // meniscus: the ink climbs the glass a little at each wall
    ctx.strokeStyle = INK; ctx.globalAlpha = 0.5; ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(2, surf - cxw * well.tilt - 3);
    ctx.lineTo(6, surf - (cxw - 6) * well.tilt + 0.5);
    ctx.moveTo(bw - 2, surf + cxw * well.tilt - 3);
    ctx.lineTo(bw - 6, surf + (cxw - 6) * well.tilt + 0.5);
    ctx.stroke();
    ctx.globalAlpha = 1;

    if (low) {                                   // dregs left drying on the glass
      ctx.globalAlpha = 0.5;
      for (let i = 0; i < 7; i++) blob(6 + i * 10, surf - 3 - n1(i) * 9, 1.4 + n1(i * 5) * 2.2, i);
      ctx.globalAlpha = 1;
    }
    ctx.restore();

    // etched fill marks on the side of the glass
    ctx.strokeStyle = INK; ctx.globalAlpha = 0.3; ctx.lineWidth = 1.3;
    for (let i = 1; i <= 3; i++) {
      const y = bh + 2 - (bh - 12) * (i / 4);
      ctx.beginPath();
      ctx.moveTo(bw - 16, y + nn(i * 9) * 0.5);
      ctx.lineTo(bw - 7 - (i === 2 ? 3 : 0), y + nn(i * 4) * 0.5);
      ctx.stroke();
    }
    ctx.globalAlpha = 1;

    // glass outline, neck and stopper ring
    ctx.strokeStyle = INK; ctx.globalAlpha = 0.72; ctx.lineWidth = 2.6;
    ctx.stroke(body);
    ctx.globalAlpha = 0.9; ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(10 + nn(boil) * 0.8, 16); ctx.lineTo(16, 5); ctx.lineTo(bw - 16, 5);
    ctx.lineTo(bw - 10 + nn(boil + 3) * 0.8, 16);
    ctx.stroke();
    ctx.lineWidth = 2.2; ctx.globalAlpha = 0.6;
    ctx.beginPath(); ctx.moveTo(14, 10); ctx.lineTo(bw - 14, 10); ctx.stroke();
    ctx.globalAlpha = THEME.hiA; ctx.strokeStyle = THEME.hi; ctx.lineWidth = 3.4;
    ctx.beginPath(); ctx.moveTo(13, 30); ctx.bezierCurveTo(9, 44, 9, 56, 12, 68); ctx.stroke();
    ctx.globalAlpha = 1;
    ctx.restore();

    // a collected blot falling back into the well
    for (const q of well.pours) {
      const e = q.t * q.t * (3 - 2 * q.t);
      const px = q.sx + (bx + bw / 2 - q.sx) * e;
      const py = q.sy + (by - 6 - q.sy) * e - Math.sin(q.t * Math.PI) * 46;
      ctx.fillStyle = INK;
      blob(px, py, 5.5 + Math.sin(q.t * Math.PI) * 2.5, q.seed);
      ctx.globalAlpha = 0.5;
      blob(px - 5, py - 8, 1.6, q.seed + 3);
      ctx.globalAlpha = 1;
    }

    if (pose) { ctx.restore(); return; }           // on the card, the card does the talking
    // handwritten label
    ctx.fillStyle = low ? RED : INK;
    ctx.font = '22px ' + FH;
    ctx.fillText(low ? (ink <= 0 ? 'dry!' : 'low ink') : 'ink', bx + bw + 10, by + 34);
    ctx.font = '19px ' + FH;
    ctx.globalAlpha = 0.72;
    ctx.fillText(Math.round(ratio * 100) + '%', bx + bw + 10, by + 56);
    ctx.globalAlpha = 1;
  }

  /* hud ---------------------------------------------------------------- */
  /* While Inky is running the page is the thing to look at: progress and
     the inkwell stay put, the rest of the corner writing steps back, and it
     all comes forward again the moment he stops, dies or gets home. */
  let hudCalm = 0;
  function updateHudCalm(dt) {
    const running = scene === 'play' && state === 'play' && hasDrawn && Math.hypot(ball.vx, ball.vy) > 60;
    hudCalm += ((running ? 1 : 0) - hudCalm) * Math.min(1, dt * (running ? 1.4 : 5));
  }
  function drawHud() {
    const shown = (state === 'play' ? runT : endT);
    const quiet = 1 - 0.62 * hudCalm;

    // scribbled in the corner of the page, like a tally kept by hand
    ctx.save();
    ctx.translate(20, 32); ctx.rotate(-0.025);
    ctx.fillStyle = INK; ctx.globalAlpha = 0.42 * quiet;
    ctx.font = '21px ' + FH;
    ctx.fillText('attempt ' + attempt, 0, 0);
    ctx.strokeStyle = INK; ctx.lineWidth = 1.4; ctx.globalAlpha = 0.22 * quiet;
    ctx.beginPath();
    for (let i = 0; i <= 74; i += 8) ctx.lineTo(i, 5 + nn(i * 0.7) * 1.1);
    ctx.stroke();
    ctx.restore();
    ctx.globalAlpha = 0.38 * quiet; ctx.fillStyle = INK; ctx.font = '19px ' + FH;
    ctx.fillText('\u2039 pages', 20, 60);
    backBtn.x = 6; backBtn.y = 40; backBtn.w = 84; backBtn.h = 32;
    ctx.globalAlpha = 1;

    ctx.fillStyle = INK; ctx.globalAlpha = 0.42 * quiet;           // time: kept, but quiet
    ctx.font = '19px ' + FH;
    ctx.textAlign = 'right';
    ctx.fillText(shown.toFixed(1) + 's', VW - 18, 76);
    ctx.fillStyle = RED;

    // how far down the page you have got, as a ruled margin mark
    const prog = state === 'play' ? Math.min(1, ball.x / LEVEL.finish)
               : state === 'replay' ? Math.min(1, camX / LEVEL.finish) : lastProg;
    const w = Math.min(190, VW * 0.3);
    const x0 = VW - 18 - w, y0 = 36;
    ctx.globalAlpha = 0.92; ctx.font = '26px ' + FH;                   // progress: the number that matters
    ctx.fillText((prog >= 1 ? 100 : Mastery.pct(prog)) + '%', x0 - 12, y0 + 8);
    ctx.strokeStyle = RED; ctx.lineWidth = 1.6; ctx.globalAlpha = 0.32;
    ctx.beginPath();
    for (let i = 0; i <= w; i += 8) ctx.lineTo(x0 + i, y0 + nn(i * 0.5) * 0.9);
    ctx.stroke();
    ctx.globalAlpha = 0.9; ctx.lineWidth = 3.4;
    ctx.beginPath();
    for (let i = 0; i <= w * prog; i += 6) ctx.lineTo(x0 + i, y0 + nn(i * 0.5) * 1.1);
    ctx.stroke();
    if (bestProg > 0.02 && bestProg < 0.999) {          // furthest yet, nicked on the rule
      ctx.globalAlpha = 0.5; ctx.lineWidth = 1.8;
      ctx.beginPath();
      ctx.moveTo(x0 + w * bestProg, y0 - 6); ctx.lineTo(x0 + w * bestProg, y0 + 6);
      ctx.stroke();
    }
    drawSoundToggle(state === 'play', quiet);
  }

  // sound, written in the corner like everything else
  function drawSoundToggle(live, quiet) {
    ctx.font = '20px ' + FH;
    const label = 'sound';
    const lw = ctx.measureText(label).width;
    soundBtn.w = lw + 26; soundBtn.h = 30;
    soundBtn.x = VW - soundBtn.w - 10; soundBtn.y = VH - soundBtn.h - 8;
    ctx.fillStyle = INK; ctx.globalAlpha = (live ? 0.34 : 0.15) * (quiet == null ? 1 : quiet);
    ctx.textAlign = 'right';
    ctx.fillText(label, VW - 18, VH - 16);
    if (!Sound.on) {
      ctx.strokeStyle = INK; ctx.lineWidth = 1.8;
      ctx.beginPath();
      for (let i = 0; i <= lw + 8; i += 6)
        ctx.lineTo(VW - 22 - lw + i, VH - 22 + nn(i * 0.8) * 1.2);
      ctx.stroke();
    }
    ctx.globalAlpha = 1; ctx.textAlign = 'left';
  }

  /* cards -------------------------------------------------------------- */
  function cardFrame(x, y, w, h) {
    ctx.save();
    ctx.globalAlpha = 0.93; ctx.fillStyle = PAPER;
    ctx.beginPath(); ctx.rect(x, y, w, h); ctx.fill();
    ctx.globalAlpha = 1;
    ctx.strokeStyle = RED; ctx.lineWidth = 2.6; ctx.lineJoin = 'round';
    for (let pass = 0; pass < 2; pass++) {
      ctx.globalAlpha = pass ? 0.45 : 0.95;
      ctx.beginPath();
      const corners = [[x, y], [x + w, y], [x + w, y + h], [x, y + h], [x, y]];
      for (let c = 0; c < corners.length - 1; c++) {
        const a = corners[c], b = corners[c + 1];
        const steps = 10;
        for (let i = 0; i <= steps; i++) {
          const k = i / steps;
          const px = a[0] + (b[0] - a[0]) * k + nn(c * 7 + i + pass * 31) * 1.9;
          const py = a[1] + (b[1] - a[1]) * k + nn(c * 11 + i + pass * 17) * 1.9;
          (c === 0 && i === 0) ? ctx.moveTo(px, py) : ctx.lineTo(px, py);
        }
      }
      ctx.stroke();
    }
    ctx.globalAlpha = 1;
    ctx.restore();
  }

  const DEAD_MSG = {
    crash: 'you hit the ink',
    fell:  'off the page',
    dry:   'the well ran dry',
    behind:'the page left without you',
  };

  /* A failed run: how far you got is the whole story. */
  function drawDeadCard() {
    const n = runNote || {};
    const opened = n.opened && n.opened.length ? n.opened[0] : null;
    const w = Math.min(opened ? 360 : 320, VW * 0.84), h = opened ? 206 : 170;
    const x = (VW - w) / 2, y = VH * 0.25, cx = VW / 2;
    cardFrame(x, y, w, h);
    ctx.textAlign = 'center';
    ctx.fillStyle = RED; ctx.globalAlpha = 0.9;
    ctx.font = Math.round(Math.min(24, w * 0.08)) + 'px ' + FD;
    ctx.fillText('SPLAT!', cx, y + 34);
    ctx.globalAlpha = 1; ctx.fillStyle = INK;
    ctx.font = Math.round(Math.min(50, w * 0.17)) + 'px ' + FD;
    ctx.fillText(Mastery.pct(progShown) + '%', cx, y + 92);
    const isNew = n.score != null && n.was != null && n.score > n.was && n.was > 0;
    ctx.font = '22px ' + FH;
    if (isNew) { ctx.fillStyle = RED; ctx.fillText('NEW BEST!', cx, y + 122); }
    else if (n.best != null) { ctx.globalAlpha = 0.7; ctx.fillText('BEST: ' + n.best + '%', cx, y + 122); }
    ctx.globalAlpha = 0.48; ctx.fillStyle = INK; ctx.font = '17px ' + FH;
    ctx.fillText((DEAD_MSG[deadReason] || '') + '   ·   ' + Math.round(ink / INK_MAX * 100) + '% ink left', cx, y + 146);
    ctx.globalAlpha = 0.36;
    ctx.fillText('tap anywhere', cx, y + 164);
    ctx.globalAlpha = 1;
    if (opened) {                                   // reaching further can open a world too
      ctx.fillStyle = RED; ctx.font = '700 21px ' + FH;
      const txt = opened.name + ' IS OPEN', tw = ctx.measureText(txt).width;
      ctx.fillText(txt, cx + 12, y + 194);
      openLock(cx - tw / 2 - 12, y + 184, RED, (performance.now() - deadAt) / 700 - 0.4);
    }
    ctx.textAlign = 'left';
  }

  function lastLevelId() { const w = WORLDS[WORLDS.length - 1]; return w.levels[w.levels.length - 1]; }
  /* the card waits for the tick, or — at the very end — for Inky to get in */
  function cardAt() {
    if (!LEVEL.house) return 0.7;                  // HOME! first, then the card
    return runNote && runNote.firstHome ? 2.7 : 1.1;
  }

  /* A world's mastery as a pencil bar: the outline, the part earned hatched
     in, and a notch at 220 while there is a next world to open. */
  function masteryBar(x, y, w, score, col, hasNext, seed) {
    const h = 9, k = Math.max(0, Math.min(1, score / 300));
    ctx.save();
    ctx.strokeStyle = col; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    ctx.lineWidth = 1.4; ctx.globalAlpha = 0.7;
    ctx.beginPath();
    for (let i = 0; i <= 12; i++) { const px = x + w * i / 12; i ? ctx.lineTo(px, y + nn(i + seed) * 0.8) : ctx.moveTo(px, y); }
    for (let i = 12; i >= 0; i--) ctx.lineTo(x + w * i / 12, y + h + nn(i * 3 + seed) * 0.8);
    ctx.closePath(); ctx.stroke();
    if (k > 0) {
      ctx.save(); ctx.beginPath(); ctx.rect(x + 1, y + 1, (w - 2) * k, h - 2); ctx.clip();
      ctx.lineWidth = 1.6; ctx.globalAlpha = 0.85;
      for (let q = x - h; q < x + w; q += 4) { ctx.beginPath(); ctx.moveTo(q, y + h); ctx.lineTo(q + h, y); ctx.stroke(); }
      ctx.restore();
    }
    if (hasNext) {
      const nx = x + w * UNLOCK / 300;
      ctx.globalAlpha = 0.9; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(nx, y - 5); ctx.lineTo(nx, y + h + 5); ctx.stroke();
    }
    ctx.restore();
  }
  /* an open padlock, drawn as the shackle swings off */
  function openLock(x, y, col, k) {
    ctx.save(); ctx.strokeStyle = col; ctx.lineWidth = 2; ctx.lineJoin = 'round'; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.rect(x - 8, y - 3, 16, 12); ctx.stroke();
    ctx.translate(x + 5, y - 3); ctx.rotate(-0.9 * Math.max(0, Math.min(1, k)));
    ctx.beginPath(); ctx.arc(-5, 0, 5.2, Math.PI, 0); ctx.stroke();
    ctx.restore();
  }
  function nextWorld(w) { return WORLDS[WORLDS.indexOf(w) + 1] || null; }
  function worldTitle(w) { return w.name.charAt(0) + w.name.slice(1).toLowerCase(); }
  function worldSub(n) {
    if (!n || !n.world) return '';
    const nw = nextWorld(n.world);
    if (n.opened && n.opened.length) return n.opened[0].name + ' IS OPEN';
    if (n.firstHome) return 'Inky is home   ·   campaign ' + Mastery.total() + ' / ' + Mastery.max() + '%';
    if (nw && !worldOpen(nw)) return worldTitle(n.world) + ' ' + n.after + ' / 300   ·   ' + UNLOCK + ' opens ' + worldTitle(nw);
    return '';
  }
  /* The finish. Two measures, nothing else to add up: how far (home is
     100%) and how much ink got home with him. The inkwell itself comes up
     off the page and settles on the card, so "ink left" is something you
     can see. It is not banked or spent anywhere — it is how tidily you did. */
  let winBtns = null, wellPose = null, wellLanded = false;
  function winCardGeom() {
    const w = Math.min(420, VW * 0.92), h = 318;
    return { w: w, h: h, x: (VW - w) / 2, y: Math.max(12, VH * 0.16) };
  }
  function drawWinCard() {
    const n = runNote || {}, g = winCardGeom(), w = g.w, h = g.h, x = g.x, y = g.y, cx = VW / 2;
    const k = winT - cardAt();
    cardFrame(x, y, w, h);
    ctx.textAlign = 'center';
    ctx.fillStyle = INK; ctx.globalAlpha = 0.55; ctx.font = '19px ' + FH;
    ctx.fillText(LEVEL.name, cx, y + 30);
    ctx.globalAlpha = 1;
    ctx.fillStyle = RED;
    ctx.font = Math.round(Math.min(34, w * 0.09)) + 'px ' + FD;
    ctx.fillText(LEVEL.house && n.firstHome ? 'HOME.' : 'HOME!', cx, y + 72);
    // a red tick, written in as the card lands
    const tk = Math.max(0, Math.min(1, (k - 0.1) / 0.28));
    if (tk > 0) {
      const tx = x + w - 46, ty = y + 36;
      const P = [[tx - 11, ty - 1], [tx - 3, ty + 9], [tx + 16, ty - 18]];
      const L1 = Math.hypot(8, 10), L2 = Math.hypot(19, 27), at = tk * (L1 + L2);
      ctx.strokeStyle = RED; ctx.lineWidth = 3.6; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
      ctx.beginPath(); ctx.moveTo(P[0][0], P[0][1]);
      if (at <= L1) ctx.lineTo(P[0][0] + 8 * at / L1, P[0][1] + 10 * at / L1);
      else { ctx.lineTo(P[1][0], P[1][1]); const k2 = (at - L1) / L2; ctx.lineTo(P[1][0] + 19 * k2, P[1][1] - 27 * k2); }
      ctx.stroke();
    }
    // the two measures
    const colL = cx - w * 0.24, colR = cx + w * 0.2, top = y + 110;
    ctx.fillStyle = INK; ctx.globalAlpha = 0.6; ctx.font = '700 17px ' + FH;
    ctx.fillText('PROGRESS', colL, top);
    ctx.fillText('INK LEFT', colR + 30, top);
    ctx.globalAlpha = 1; ctx.font = Math.round(Math.min(40, w * 0.1)) + 'px ' + FD;
    ctx.fillText('100%', colL, top + 50);
    const left = n.left != null ? n.left : ink / INK_MAX;
    ctx.textAlign = 'left'; ctx.fillText(Math.round(left * 100) + '%', colR + 20, top + 50); ctx.textAlign = 'center';
    // the inkwell, brought up from the corner: it flies in, lands, sloshes, settles
    const e = Math.max(0, Math.min(1, k / 0.32)), ee = e * e * (3 - 2 * e);
    const hx = 22, hy = VH - 26 - 84, tx = colR - 44, ty = top + 10;
    wellPose = { x: hx + (tx - hx) * ee, y: hy + (ty - hy) * ee - Math.sin(e * Math.PI) * 40, s: 1 - 0.28 * ee };
    if (e >= 1 && !wellLanded) { wellLanded = true; well.tiltV += 2.6; well.bobV -= 34; well.ripple = 1; Sound.ripple(); }
    // best, or a new best
    ctx.font = '21px ' + FH;
    let line = '', red = false;
    if (n.firstWin) { line = 'first time home'; red = true; }
    else if (n.prevInk != null && left > n.prevInk + 0.004) { line = 'NEW BEST!'; red = true; }
    else if (n.prevInk != null) line = 'best ink: ' + Math.round(Math.max(n.prevInk, left) * 100) + '%';
    ctx.fillStyle = red ? RED : INK; ctx.globalAlpha = red ? 0.95 : 0.6;
    ctx.fillText(line, cx, top + 88);
    ctx.globalAlpha = 1;
    // only what matters next: a world that just opened, or the end
    const sub = worldSub(n);
    if (sub) {
      const opened = n.opened && n.opened.length;
      ctx.fillStyle = opened || n.firstHome ? RED : INK; ctx.globalAlpha = opened || n.firstHome ? 0.95 : 0.5;
      ctx.font = (opened ? '700 21px ' : '18px ') + FH;
      ctx.fillText(sub, cx + (opened ? 12 : 0), top + 116);
      if (opened) openLock(cx - ctx.measureText(sub).width / 2 - 2, top + 106, RED, (k - 0.5) / 0.4);
      ctx.globalAlpha = 1;
    }
    // everyone else, quietly
    const global = Global.get(LEVEL.id), result = Global.result(LEVEL.id);
    ctx.font = '17px ' + FH; ctx.globalAlpha = 0.5; ctx.fillStyle = INK;
    let gl = 'leaderboard  ›';
    if (result && result.rank) { gl = '#' + result.rank + ' on the leaderboard' + (result.improved ? '  ·  new best' : '') + '  ›'; ctx.fillStyle = RED; ctx.globalAlpha = 0.8; }
    else if (global) gl = global.completions + ' have made it home   ·   leaderboard  ›';
    ctx.fillText(gl, cx, y + h - 70);
    ctx.globalAlpha = 1;

    const nx = nextLevel(LEVEL.id);
    const labels = [['again', 'again'], ['replay', 'replay'], nx ? ['next', 'next ›'] : ['pages', 'pages']];
    const bw = (w - 60) / 3, bh = 40;
    winBtns = { board: { x: x + 40, y: y + h - 90, w: w - 80, h: 28 } };
    labels.forEach(function (l, i) {
      const b = { x: x + 18 + i * (bw + 12), y: y + h - 52, w: bw, h: bh };
      winBtns[l[0]] = b;
      const primary = i === 2;
      ctx.strokeStyle = primary ? INK : RED; ctx.globalAlpha = primary ? 0.9 : 0.75; ctx.lineWidth = primary ? 3 : 2.2;
      ctx.beginPath();
      for (let q = 0; q <= b.w; q += 7) ctx.lineTo(b.x + q, b.y + b.h - 4 + nn(q * 0.6 + b.x) * 1.2);
      ctx.stroke();
      ctx.globalAlpha = 1; ctx.fillStyle = INK;
      ctx.font = (primary ? '700 25px ' : '23px ') + FH;
      ctx.fillText(l[1], b.x + b.w / 2, b.y + b.h - 12);
    });
    ctx.textAlign = 'left';
  }

  function winHit(clientX, clientY) {
    if (!winBtns) return 'again';
    const r = cv.getBoundingClientRect();
    const x = (clientX - r.left) / scale, y = (clientY - r.top) / scale;
    for (const k in winBtns) {
      const b = winBtns[k];
      if (x >= b.x - 4 && x <= b.x + b.w + 4 && y >= b.y - 10 && y <= b.y + b.h + 8) return k;
    }
    return 'again';                              // anywhere else: straight back in
  }

  function drawReplayBanner() {
    ctx.textAlign = 'center';
    ctx.fillStyle = RED; ctx.globalAlpha = 0.9;
    ctx.font = '26px ' + FH;
    ctx.fillText('your line  ·  replay', VW / 2, 36);
    ctx.globalAlpha = 0.6; ctx.font = '19px ' + FH;
    ctx.fillText('tap for another go', VW / 2, 60);
    ctx.globalAlpha = 1; ctx.textAlign = 'left';
  }

  /* ── a procedural run: marks, HUD and the result ───────────────────────── */
  function currentPb() {
    if (MODE === 'daily') { const r = Records.daily(COURSE.day); return r.best ? r.best.dist : 0; }
    if (MODE === 'endless') return Records.endless().pbDist;
    return 0;
  }
  function courseLine() {
    if (MODE === 'zen') return 'no hurry. the well never empties.';
    if (MODE === 'daily') {
      const r = Records.daily(COURSE.day);
      return r.best ? 'today’s best ' + Math.floor(r.best.dist) + ' m' : 'the same page for everyone today';
    }
    const r = Records.endless();
    return r.pbDist >= 1 ? 'best ' + Math.floor(r.pbDist) + ' m' : 'as far as the ink goes';
  }

  // pencilled on the page: every hundred metres, and where your best ended
  function drawCourseMarks() {
    const top = camY + 96;
    ctx.textBaseline = 'alphabetic'; ctx.textAlign = 'center';
    const m0 = Math.max(100, Math.ceil(Gen.metres(viewL) / 100) * 100);
    for (let m = m0; Gen.units(m) < viewR; m += 100) {
      const x = Gen.units(m);
      ctx.strokeStyle = SOFT; ctx.globalAlpha = 0.5; ctx.lineWidth = 1.4;
      ctx.beginPath(); ctx.moveTo(x, top - 4); ctx.lineTo(x + 1, top + 16); ctx.stroke();
      ctx.fillStyle = SOFT; ctx.font = '18px ' + FH;
      ctx.fillText(m + ' m', x, top - 10);
    }
    const pb = currentPb();
    if (pb >= 5) {
      const x = Gen.units(pb);
      if (x > viewL && x < viewR) {
        ctx.strokeStyle = RED; ctx.globalAlpha = 0.42; ctx.lineWidth = 2;
        ctx.setLineDash([8, 9]);
        ctx.beginPath();
        for (let y = top + 22; y < camY + VH - 30; y += 14) ctx.lineTo(x + nn(y * 0.2) * 1.4, y);
        ctx.stroke(); ctx.setLineDash([]);
        ctx.globalAlpha = 0.8; ctx.fillStyle = RED; ctx.font = '21px ' + FH;
        ctx.fillText(MODE === 'daily' ? 'today’s best' : 'your best', x, top + 40);
      }
    }
    ctx.globalAlpha = 1; ctx.textAlign = 'left';
  }

  function drawRunHud() {
    const live = state === 'play';
    const dist = Gen.metres(live ? Math.max(runMaxX, ball.x) : runMaxX);
    ctx.save();
    ctx.translate(20, 42); ctx.rotate(-0.02);
    ctx.fillStyle = INK; ctx.globalAlpha = MODE === 'zen' ? 0.45 : 0.85;
    ctx.font = '700 33px ' + FH;
    ctx.fillText(Math.floor(dist) + ' m', 0, 0);
    ctx.restore();
    const pb = currentPb();
    ctx.fillStyle = pbFlash > 0 ? RED : INK; ctx.globalAlpha = pbFlash > 0 ? 0.5 + 0.5 * pbFlash : 0.45; ctx.font = '19px ' + FH;
    const sub = pbFlash > 0 ? 'past your best!' : MODE === 'zen' ? 'zen' : MODE === 'daily'
      ? 'daily' + (pb ? '  ·  best ' + Math.floor(pb) + ' m' : '')
      : (pb ? 'best ' + Math.floor(pb) + ' m' : 'endless');
    const quiet = 1 - 0.62 * hudCalm;                        // distance stays; the rest steps back while he runs
    if (pbFlash <= 0) ctx.globalAlpha *= quiet;
    ctx.fillText(sub, 21, 66);
    ctx.globalAlpha = 0.38 * quiet;
    ctx.fillText(MODE === 'daily' ? '‹ board' : '‹ home', 20, 94);
    backBtn.x = 6; backBtn.y = 74; backBtn.w = 90; backBtn.h = 32;
    if (MODE !== 'zen') {
      ctx.fillStyle = INK; ctx.globalAlpha = 0.5 * quiet;
      ctx.font = '21px ' + FH; ctx.textAlign = 'right';
      ctx.fillText((live ? runT : endT).toFixed(1) + 's', VW - 18, 34);
      ctx.textAlign = 'left';
    }
    ctx.globalAlpha = 1;
    drawSoundToggle(live, quiet);
  }

  let runBtns = null;
  function linkText(label, cx, base, key) {
    ctx.font = '21px ' + FH;
    const w = ctx.measureText(label).width;
    ctx.fillText(label, cx, base);
    runBtns[key] = { x: cx - w / 2 - 12, y: base - 22, w: w + 24, h: 32 };
  }
  function drawRunCard() {
    const r = runRes;
    if (!r) return;
    const daily = MODE === 'daily';
    const w = Math.min(360, VW * 0.86), h = daily ? 236 : 210;
    const x = (VW - w) / 2, y = Math.max(96, VH * 0.24);
    const k = Math.min(1, (performance.now() - deadAt) / 140);      // it lands, it does not fade in
    ctx.save();
    ctx.translate(VW / 2, y + h / 2); ctx.scale(0.96 + 0.04 * k, 0.96 + 0.04 * k); ctx.translate(-VW / 2, -(y + h / 2));
    cardFrame(x, y, w, h);
    runBtns = {};
    ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
    ctx.fillStyle = RED;
    ctx.font = Math.round(Math.min(42, w * 0.13)) + 'px ' + FD;
    ctx.fillText(Math.floor(r.dist) + ' m', VW / 2, y + 58);
    ctx.font = '23px ' + FH;
    ctx.fillStyle = INK; ctx.globalAlpha = 0.8;
    const tail = r.newPb ? (daily ? 'best today!' : 'new best!') : 'best ' + Math.floor(r.pb) + ' m';
    const head = r.time.toFixed(1) + ' s   ·   ';
    const hw = ctx.measureText(head).width, tw = ctx.measureText(tail).width;
    ctx.textAlign = 'left';
    ctx.fillText(head, VW / 2 - (hw + tw) / 2, y + 92);
    ctx.fillStyle = r.newPb ? RED : INK;
    ctx.fillText(tail, VW / 2 - (hw + tw) / 2 + hw, y + 92);
    ctx.textAlign = 'center';
    if (daily) {
      ctx.fillStyle = INK; ctx.globalAlpha = 0.62; ctx.font = '20px ' + FH;
      const line = r.net === 'sending' ? 'sending to today’s board…'
        : r.net === 'offline' ? 'board offline · kept on this device'
        : r.net === 'rejected' ? 'this run could not be counted'
        : r.rank ? 'you are #' + r.rank + ' of ' + r.players + ' today'
        : 'counted';
      ctx.fillText(line, VW / 2, y + 120);
    }
    // RETRY: the obvious thing to do
    const by = y + h - 70;
    ctx.globalAlpha = 1; ctx.fillStyle = INK; ctx.font = '700 31px ' + FH;
    const rw = ctx.measureText('RETRY').width;
    ctx.fillText('RETRY', VW / 2, by + 20);
    ctx.strokeStyle = INK; ctx.lineWidth = 3; ctx.lineCap = 'round';
    ctx.beginPath();
    for (let i = 0; i <= rw + 16; i += 7) ctx.lineTo(VW / 2 - rw / 2 - 8 + i, by + 30 + nn(i * 0.6) * 1.2 + i * 0.01);
    ctx.stroke();
    ctx.globalAlpha = 0.5; ctx.fillStyle = INK;
    if (daily) { linkText('board', VW / 2 - 60, y + h - 12, 'board'); linkText('home', VW / 2 + 60, y + h - 12, 'home'); }
    else { linkText('home', VW / 2 - 60, y + h - 12, 'home'); linkText('zen', VW / 2 + 60, y + h - 12, 'zen'); }
    ctx.globalAlpha = 0.28; ctx.font = '15px ' + FH;
    ctx.fillText('·', VW / 2, y + h - 12);
    ctx.restore();
    ctx.globalAlpha = 1; ctx.textAlign = 'left';
  }

  /* ── the run record ─────────────────────────────────────────────────────
     Every attempt is captured as plain, portable data: the course it was
     played on, what the runner did, and every mark the player made, with
     timings. It drives the replay today. It is also, unchanged, what a daily
     challenge would verify, what a ghost line would be drawn from, and what a
     shared replay would carry — so nothing here depends on this session, this
     device, or this build. */
  const REC_V = 1;

  function runRecord() {
    if (!rec) return null;
    const r2 = function (n) { return Math.round(n * 10) / 10; };
    /* Times keep millisecond precision: the replay interpolates on them, so
       rounding here would make a round-tripped run play back in steps. */
    const r3 = function (n) { return Math.round(n * 1000) / 1000; };
    return {
      v: REC_V,
      level: LEVEL.id,
      outcome: state === 'win' ? 'win' : state === 'dead' ? 'dead' : 'partial',
      reason: deadReason || null,
      time: r3(rec.dur || runT),
      attempt: runAttempt,
      ground: r2(G),                       // the run's ground line, for replay on any screen
      finish: LEVEL.finish,
      progress: r2(Math.min(1, ball.x / LEVEL.finish) * 100),
      ink: { max: INK_MAX, spent: Math.round(inkSpent), left: Math.round(ink) },
      strokes: strokes.map(function (st) {
        const p = [];
        for (const q of st.pts) p.push(r2(q.x), r2(q.y), r3(q.t), r2(q.w), q.dry | 0);
        return { seed: r2(st.seed), p: p };          // x,y,t,w,dry per point
      }),
      path: rec.path.map(function (q) {
        return [r3(q.t), r2(q.x), r2(q.y), r3(q.a), r2(q.cx), r2(q.cy), q.g ? 1 : 0];
      }),
    };
  }

  function serializeRun() { return runRecord(); }

  function keepWinningRun() {
    try {
      const j = JSON.stringify(runRecord());
      if (j.length < 900000) localStorage.setItem('inkline.lastwin', j);
    } catch (e) {}
  }

  /* ── turning the page ─────────────────────────────────────────────────
     Every move between pages freezes the page as it looked and pulls it away
     to the left over whatever comes next. */
  const turn = { t0: -1, snap: null };
  function turnPage() {
    try {
      if (!turn.snap || turn.snap.width !== cv.width || turn.snap.height !== cv.height) {
        turn.snap = document.createElement('canvas');
        turn.snap.width = cv.width; turn.snap.height = cv.height;
      }
      turn.snap.getContext('2d').drawImage(cv, 0, 0);
      turn.t0 = performance.now();
    } catch (e) { turn.t0 = -1; }
    Sound.page();
  }
  function drawTurn() {
    if (turn.t0 < 0 || !turn.snap) return;
    const k = (performance.now() - turn.t0) / 420;
    if (k >= 1) { turn.t0 = -1; return; }
    const W = cv.width, H = cv.height, e = k * k;
    const edge = W * (1 - e);
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.save();
    ctx.beginPath(); ctx.rect(0, 0, edge, H); ctx.clip();
    ctx.drawImage(turn.snap, -(W - edge) * 0.35, 0);
    ctx.restore();
    ctx.strokeStyle = '#15161B'; ctx.globalAlpha = 0.28; ctx.lineWidth = 1.6 * DPR;
    ctx.beginPath();
    for (let y = 0; y <= H; y += 24 * DPR) ctx.lineTo(edge + nn(y * 0.01 + boil) * 1.2 * DPR, y);
    ctx.stroke();
    ctx.globalAlpha = 1;
  }

  /* ── progress: what this player has done, per level ─────────────────────
     Kept on the device. It is also exactly what a 1–3 ink-drop rating would
     be computed from later (best ink left, first-win attempt, best time), so
     that can be added without touching how it is stored. */
  const Progress = (function () {
    const KEY = 'inkline.campaign.v1';
    let d = {};
    try { d = JSON.parse(localStorage.getItem(KEY) || '{}') || {}; } catch (e) { d = {}; }
    const rec = function (id) {
      return d[id] || (d[id] = { attempts: 0, wins: 0, bestInk: null, bestProg: 0, bestTime: null, firstWin: null });
    };
    const save = function () { try { localStorage.setItem(KEY, JSON.stringify(d)); } catch (e) {} };
    return {
      get: rec,
      done: function (id) { return rec(id).wins > 0; },
      attempt: function (id) { rec(id).attempts++; save(); },
      death: function (id, prog) { const r = rec(id); if (prog > r.bestProg) { r.bestProg = prog; save(); } },
      win: function (id, inkLeft, time) {
        const r = rec(id);
        r.wins++; r.bestProg = 1;
        if (r.firstWin == null) r.firstWin = r.attempts;
        if (r.bestInk == null || inkLeft > r.bestInk) r.bestInk = inkLeft;
        if (r.bestTime == null || time < r.bestTime) r.bestTime = time;
        save();
      },
      clear: function () { d = {}; save(); },
    };
  })();

     Endless: best distance, longest survival, attempts. Daily: today's best
     and attempts (a new day starts clean), the days played, and the name

  const Records = (function () {
    const KEY = 'inkline.modes.v1';
    let d = {};
    try { d = JSON.parse(localStorage.getItem(KEY) || '{}') || {}; } catch (e) { d = {}; }
    const save = function () { try { localStorage.setItem(KEY, JSON.stringify(d)); } catch (e) {} };
    function endless() { return d.endless || (d.endless = { pbDist: 0, pbTime: 0, attempts: 0 }); }
    function daily(day) {
      const r = d.daily || (d.daily = { day: null, best: null, attempts: 0, rank: null, days: [] });
      if (day && r.day !== day) {
        r.day = day; r.best = null; r.attempts = 0; r.rank = null; r.players = null;
      }
      return r;
    }
    return {
      endless: endless,
      daily: daily,
      attempt: function (mode, day) {
        if (mode === 'endless') { const r = endless(); r.attempts++; save(); return r.attempts; }

          save(); return out;

        const r = daily(day);
        const sc = Gen.score(dist, time);
        const out = { pb: r.best ? r.best.dist : dist, newPb: !r.best || sc > r.best.score };
        if (out.newPb) { r.best = { dist: dist, time: time, score: sc }; out.pb = dist; }
        save(); return out;

      setRank: function (day, rank, players) { const r = daily(day); r.rank = rank; r.players = players; save(); },

  /* A printed line through control points [x, h]. Monotone cubic in x: it
     never overshoots a control point, peaks and valleys are flat at their
     points, and bends stay gentle enough for Inky to ride rather than bounce. */
  function path(ctrl) {
    const n = ctrl.length, xs = ctrl.map(function (q) { return q[0]; }), ys = ctrl.map(function (q) { return q[1]; });
    const d = [], m = new Array(n);
    for (let i = 0; i < n - 1; i++) d.push((ys[i + 1] - ys[i]) / (xs[i + 1] - xs[i]));
    m[0] = d[0]; m[n - 1] = d[n - 2];
    for (let i = 1; i < n - 1; i++) m[i] = d[i - 1] * d[i] <= 0 ? 0 : (d[i - 1] + d[i]) / 2;
    for (let i = 0; i < n - 1; i++) {
      if (d[i] === 0) { m[i] = 0; m[i + 1] = 0; continue; }
      const a = m[i] / d[i], b = m[i + 1] / d[i], q = a * a + b * b;
      if (q > 9) { const k = 3 / Math.sqrt(q); m[i] = k * a * d[i]; m[i + 1] = k * b * d[i]; }
    }
    const out = [];
    for (let i = 0; i < n - 1; i++) {
      const x0 = xs[i], w = xs[i + 1] - x0, steps = Math.max(2, Math.round(w / 10));
      for (let k = 0; k < steps; k++) {

        out.push([x0 + w * t, (2 * t3 - 3 * t2 + 1) * ys[i] + (t3 - 2 * t2 + t) * w * m[i]

    }
    out.push([xs[n - 1], ys[n - 1]]);

  const WORLDS = [
    { id: 'notebook',  name: 'NOTEBOOK',  levels: ['notebook-1', 'notebook-2', 'notebook-3'] },
    { id: 'blueprint', name: 'BLUEPRINT', levels: ['blueprint-1', 'blueprint-2', 'blueprint-3'], needs: 2 },

  ];

  const ALL_OPEN = /[?&]all(\b|=)/.test(location.search);    // ?all opens every page, for testing
  function worldOf(id) { return WORLDS.find(function (w) { return w.levels.indexOf(id) >= 0; }); }

  /* ── progress through the campaign ─────────────────────────────────────
     A page counts as far as you have got on it: your best reach, and 100%
     once Inky is home. A world is its three pages, out of 300; 220 opens the
     next — two pages home and a fifth of the third, or any mix like it. Ink
     never opens anything: it is how well you did, shown beside progress and
     ranked on the leaderboards, never spent or banked. Everything is worked
     out from what Progress already keeps (best reach, wins), so a player
     from an earlier build keeps every number, and since this rule only ever
     gives more than the one before, nothing that was open can close. */
  const UNLOCK = 220;
  const Mastery = (function () {
    const KEY = 'inkline.worlds.v1';
    let m = null;
    try { m = JSON.parse(localStorage.getItem(KEY) || 'null'); } catch (e) { m = null; }
    const fresh = !m || typeof m !== 'object';
    if (fresh) m = {};
    m.opened = m.opened || {}; m.shown = m.shown || {}; m.perfect = m.perfect || {};
    const save = function () { try { localStorage.setItem(KEY, JSON.stringify(m)); } catch (e) {} };

    /* progress as a whole percent, never rounded up into a finish */
    function pct(prog) { return Math.max(0, Math.min(99, Math.floor(100 * (prog || 0) + 1e-9))); }
    function level(id) {
      const r = Progress.get(id);
      return r.wins > 0 ? 100 : pct(r.bestProg);
    }
    const real = function (w) { return WORLDS.find(function (x) { return x.id === (w && w.id); }) || w; };
    function world(w) { return real(w).levels.reduce(function (a, id) { return a + level(id); }, 0); }
    function total() { return WORLDS.reduce(function (a, w) { return a + world(w); }, 0); }
    /* A world, once open, stays open. The previous build opened Blueprint
       after two finished Notebook pages: anyone it had opened for keeps it. */
    if (fresh) {
      WORLDS.forEach(function (w, k) {
        if (!k) return;
        const prev = WORLDS[k - 1];
        const legacy = w.needs && prev.levels.filter(Progress.done).length >= w.needs;
        const played = w.levels.some(function (id) { return Progress.get(id).attempts > 0; });
        if (legacy || played) { m.opened[w.id] = 1; m.shown[w.id] = 1; }
      });
      save();
    }
    function isOpen(w) {
      w = real(w);
      const k = WORLDS.indexOf(w);
      if (k <= 0 || m.opened[w.id]) return true;
      const prev = WORLDS[k - 1];
      if (isOpen(prev) && world(prev) >= UNLOCK) { m.opened[w.id] = 1; save(); return true; }
      return false;
    }
    /* after any change to the numbers: which worlds just opened */
    function check() {
      const out = [];
      WORLDS.forEach(function (w, k) { if (k && !m.opened[w.id] && isOpen(w)) out.push(w); });
      return out;
    }
    return {
      level: level, world: world, total: total, isOpen: isOpen, check: check, pct: pct,
      max: function () { return WORLDS.length * 300; },
      opened: function (w) { return !!m.opened[w.id]; },
      shown: function (w) { return !!m.shown[w.id] || WORLDS.indexOf(real(w)) === 0; },
      markShown: function (w) { if (!m.shown[w.id]) { m.shown[w.id] = 1; save(); } },
      perfectSeen: function (w) { return !!m.perfect[w.id]; },
      markPerfect: function (w) { if (!m.perfect[w.id]) { m.perfect[w.id] = 1; save(); } },
      get finished() { return !!m.finished; },
      set finished(v) { m.finished = v ? 1 : 0; save(); },
      clear: function () { m = { opened: {}, shown: {}, perfect: {} }; save(); },
    };
  })();

  /* Within a world the pages open in order; a world opens at 220. */
  function worldOpen(w) { return ALL_OPEN || Mastery.isOpen(w); }
  function unlocked(id) {
    if (ALL_OPEN) return true;
    const w = worldOf(id), i = w.levels.indexOf(id);
    if (!worldOpen(w)) return false;
    return i === 0 || Progress.done(w.levels[i - 1]);
  }
  function nextLevel(id) {
    const w = worldOf(id), i = w.levels.indexOf(id);
    if (i < w.levels.length - 1) return unlocked(w.levels[i + 1]) ? w.levels[i + 1] : null;
    const nw = WORLDS[WORLDS.indexOf(w) + 1];
    return nw && unlocked(nw.levels[0]) ? nw.levels[0] : null;
  }

  function startLevel(id) {
    const L = LEVELS[id];
    if (!L) return;
    LEVEL = L;

    applyTheme(THEMES[L.world]);
