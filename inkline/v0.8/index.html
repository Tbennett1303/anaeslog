<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="The Inkline">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#F2EEE3">
<meta name="description" content="Draw the ground under a running ink blob.">
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" sizes="180x180" href="/icons/inky-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="/icons/inky-192.png">
<title>The Inkline</title>
<style>
  :root { padding: env(safe-area-inset-top, 0px) 0 env(safe-area-inset-bottom, 0px); color-scheme: light; }
  #disclosure {
    position: fixed; left: 50%; transform: translateX(-50%);
    bottom: calc(54px + env(safe-area-inset-bottom, 0px));
    margin: 0; padding: 0 12px; max-width: 92vw; text-align: center;
    font-family: "Caveat", "Segoe Print", cursive; font-size: 17px; color: #15161B;
    opacity: .34; pointer-events: none; user-select: none; z-index: 2;
    animation: fadeout 1.2s ease-in 9s forwards;
  }
  @keyframes fadeout { to { opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { #disclosure { animation: none; opacity: .22; } }
</style>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rock+Salt&family=Caveat:wght@500;700&display=swap">
<style>
  html, body { height: 100%; margin: 0; overflow: hidden; background: #E9E4D6; }
  :root { color-scheme: light; }
  #game {
    display: block; width: 100%; height: 100%;
    touch-action: none; -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent; cursor: crosshair;
    overscroll-behavior: none;
  }
  #game:focus-visible { outline: 3px solid #C0362B; outline-offset: -3px; }
  #name {
    display: none; position: fixed; z-index: 3; box-sizing: border-box; margin: 0;
    padding: 0 8px; border: 0; border-bottom: 2px solid #F3F7FC; border-radius: 0;
    background: #1C4A82; color: #F3F7FC; outline: none;
    font-family: "Caveat", "Segoe Print", cursive; font-weight: 700;
  }
  #name::placeholder { color: #A8C5EA; }
  #social-name {
    display: none; position: fixed; z-index: 3; box-sizing: border-box; margin: 0;
    padding: 0 8px; border: 0; border-bottom: 2px solid #C0362B; border-radius: 0;
    background: #F2EEE3; color: #15161B; outline: none;
    font-family: "Caveat", "Segoe Print", cursive; font-weight: 700;
  }
  .sr {
    position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
    overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
  }
</style>

</head>
<body>
<canvas id="game" tabindex="0" aria-label="The Ink Line. Draw the ground under a running ink blob."></canvas>
<p id="disclosure">Anonymous playtest analytics are collected to improve the game.</p>
<input id="name" type="text" maxlength="14" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Name shown on the daily board" placeholder="anonymous">
<input id="social-name" type="text" maxlength="14" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Name shown on the campaign leaderboard" placeholder="anonymous">
<p class="sr">
  A small ink character runs left to right. Press and drag anywhere to draw the ground beneath it.
  Drawing uses ink from the inkwell. Press R to restart, and P to watch a replay of your last line.
</p>

<script src="gen.js"></script>
<script>
(function () {
  'use strict';

  /* ── tuning ─────────────────────────────────────────────────────────── */
  const GRAV     = 420;    // world units / s^2
  const CRUISE   = 300;    // ground speed the runner seeks
  const DRIVE    = 640;    // tangential acceleration toward cruise
  const SLAM     = 520;    // impact speed at which a landing scrubs hardest
  const AIRDRIVE = 90;     // gentle forward push in the air
  const MAXV     = 900;
  const REST     = 0.10;   // bounce
  const BALL_R   = 10;
  const STEP     = 9.5;    // a corner lower than this above his feet is climbed, not hit
  const SCROLL   = 110;    // forced camera creep once the run is live
  const ANCHOR   = 0.32;   // runner's resting screen position
  const ENDLESS_REGION_M = 300;   // metres of Endless per world, with a safe line across each change
  let INK_MAX  = 2900;     // units of line the inkwell holds (set per level)
  let INK_DROP = 550;      // refill per blot (set per level)
  const MINSEG   = 3.6;    // minimum sampled line segment
  const MAXSEG   = 26;     // longer than this and the gap gets interpolated
  const DRY_THIN = 0.20;   // nib starts to vary
  const DRY_SCR  = 0.10;   // noticeably scratchy
  const DRY_GAP  = 0.05;   // skipping, but still solid ground

  /* Each world is the same game on a different material. A theme is only a
     palette and a paper; every drawing routine reads these at draw time. */
  const THEMES = {
    notebook: { kind: 'notebook', paper: '#F2EEE3', ink: '#15161B', soft: '#6E6F76', red: '#C0362B',
                glass: '#FFFFFF', glassA: 0.55, hi: '#FFFFFF', hiA: 0.5, note: '#6E6F76' },
    blueprint: { kind: 'blueprint', paper: '#1C4A82', ink: '#F3F7FC', soft: '#A8C5EA', red: '#FFB49E',
                 glass: '#0B2747', glassA: 0.66, hi: '#FFFFFF', hiA: 0.3, note: '#D4E4F7' },
    /* a printed page someone has gone at with highlighters: the ink is still
       ink, the marks are translucent and only ever sit under it */
    highlighter: { kind: 'highlighter', paper: '#FAF8F1', ink: '#16171C', soft: '#6F717B', red: '#D8127A',
                   glass: '#FFFFFF', glassA: 0.55, hi: '#FFFFFF', hiA: 0.5, note: '#7C6F8C',
                   hl: { y: 'rgba(255,236,0,0.46)', p: 'rgba(255,72,170,0.36)', g: 'rgba(80,236,120,0.38)',
                         b: 'rgba(70,196,255,0.36)', o: 'rgba(255,160,40,0.40)' } },
    /* wax on rough paper: heavier marks, a child's colours, a steady hand for
       everything that matters (Inky and your line stay dark and plain) */
    crayon: { kind: 'crayon', paper: '#F5EEDC', ink: '#1E1C28', soft: '#6B5A4B', red: '#CF3A2A',
              glass: '#FFFFFF', glassA: 0.5, hi: '#FFFFFF', hiA: 0.45, note: '#8A6E57',
              wax: { grass: '#4F9A3C', earth: '#9A6A3E', sky: '#5A8FD8', sun: '#F2C230', rose: '#E0503A',
                     plum: '#7A4FA0', sea: '#3E9FB0' } },
  };
  let THEME  = THEMES.notebook;
  let PAPER  = THEME.paper;
  let INK    = THEME.ink;
  let SOFT   = THEME.soft;
  let RED    = THEME.red;
  const FD = '"Rock Salt","Caveat",cursive';
  const FH = '"Caveat","Segoe Print",cursive';

  const REDUCED = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* ── anonymous playtest analytics ──────────────────────────────────────
     Enough to answer whether strangers keep playing, and what they play:
     counts, timings, how far a run got, how much ink was left, which mode.
     No account, no contact details, no pointer or physics streams. A random
     id is kept in this browser so a returning player can be told from a new
     one (and so a daily best can be kept up to date); it identifies a
     browser, not a person.

     Events are sent in batches from menus, result cards and page hide —
     never while a run is being played. Every path is wrapped: if storage is
     blocked, the network is down or the endpoint is dead, the functions become
     silent no-ops. Nothing in here can throw into the game. */
  const Stats = (function () {
    const KEY = 'inkline.play.v1';
    /* Same-origin endpoint on the hosted build; a local file keeps its data. */
    const ENDPOINT = /^https?:$/.test(location.protocol) && !/[?&]noanalytics/.test(location.search) ? '/api/track' : '';
    const MAX_EV = 900;

    let d = null, ok = false, dirty = false, sent = 0;
    let sessionN = 0, sid = '', t0 = 0, attempts = 0, lvl = null, mode = null;

    const now = function () { return Date.now(); };
    const rid = function (n) {
      try {
        const a = new Uint8Array(n);
        (self.crypto || {}).getRandomValues ? self.crypto.getRandomValues(a) : 0;
        let h = '';
        for (let i = 0; i < n; i++) h += (a[i] || Math.floor(Math.random() * 256)).toString(16).padStart(2, '0');
        return h;
      } catch (e) { return String(Math.random()).slice(2, 2 + n * 2); }
    };
    const r1 = function (v) { return Math.round(v * 10) / 10; };

    function load() {
      try {
        const raw = localStorage.getItem(KEY);
        if (raw) d = JSON.parse(raw);
      } catch (e) { d = null; }
      if (!d || d.v !== 1 || !d.pid) {
        d = { v: 1, pid: rid(8), created: now(), lastSeen: now(), sessions: 0,
              attempts: 0, wins: 0, bestProg: 0, firstWinAttempt: null,
              input: null, ev: [] };
      }
      if (!Array.isArray(d.ev)) d.ev = [];
    }

    function save() {
      dirty = false;
      try { localStorage.setItem(KEY, JSON.stringify(d)); } catch (e) {}
    }
    function touch() {
      dirty = true;
      if (save.timer) return;
      save.timer = setTimeout(function () { save.timer = 0; if (dirty) save(); }, 1500);
    }

    function push(o) {
      if (!ok) return;
      o.t = now();
      d.ev.push(o);
      if (d.ev.length > MAX_EV) { const cut = d.ev.length - MAX_EV; d.ev.splice(0, cut); sent = Math.max(0, sent - cut); }
      d.lastSeen = o.t;
      touch();
    }

    function flush(final) {
      if (!ok || !ENDPOINT || sent >= d.ev.length) return;
      const batch = d.ev.slice(sent, sent + 150);
      const body = JSON.stringify({ pid: d.pid, s: sessionN, sid: sid, v: 2, ev: batch });
      let done = false;
      try {
        if (navigator.sendBeacon) done = navigator.sendBeacon(ENDPOINT, new Blob([body], { type: 'application/json' }));
        else if (!final && window.fetch) { fetch(ENDPOINT, { method: 'POST', body: body, keepalive: true, headers: { 'Content-Type': 'application/json' } }).catch(function () {}); done = true; }
      } catch (e) { done = false; }
      if (done) sent += batch.length;       // a failed send simply waits for the next one
    }

    function device() {
      try {
        const coarse = window.matchMedia && window.matchMedia('(pointer: coarse)').matches;
        const m = Math.min(screen.width, screen.height);
        return !coarse ? 'desktop' : m < 600 ? 'phone' : 'tablet';
      } catch (e) { return null; }
    }

    const safe = function (fn) { return function () { try { if (ok) return fn.apply(null, arguments); } catch (e) {} }; };

    return {
      start: function (inputKind) {
        try {
          load(); ok = true;
          sessionN = (d.sessions || 0) + 1;
          d.sessions = sessionN;
          sid = rid(4);
          t0 = now();
          if (inputKind && !d.input) d.input = inputKind;
          push({ e: 's', n: sessionN, in: d.input || null, dev: device(),
                 w: Math.round(window.innerWidth), h: Math.round(window.innerHeight),
                 ret: sessionN > 1 ? 1 : 0 });
          save();
        } catch (e) { ok = false; }
      },
      input: safe(function (kind) { if (kind && d.input !== kind) { d.input = kind; touch(); } }),
      /* the mode a player chose from the front page: c e d z */
      mode: safe(function (m) { mode = m; push({ e: 'm', m: m }); }),
      setLevel: function (id) { lvl = id; },
      setMode: function (m) { mode = m; },
      attempt: safe(function (n, via, extra) {
        attempts++; d.attempts = (d.attempts || 0) + 1;
        const o = { e: 'a', n: n, sa: attempts, l: lvl, m: mode, via: via || 'menu' };
        if (extra) for (const k in extra) o[k] = extra[k];
        push(o);
      }),
      /* progress 0–1 for a campaign page; dist in metres for a course */
      death: safe(function (n, progress, inkLeft, cause, runS, dist, kind) {
        if (progress > (d.bestProg || 0)) d.bestProg = progress;
        const o = { e: 'd', l: lvl, m: mode, n: n, i: r1(inkLeft * 100), c: cause || null, ms: Math.round(runS * 1000) };
        if (dist != null) o.dist = r1(dist); else o.p = r1(progress * 100);
        if (kind) o.k = kind;                    // what kind of section it was (generated courses)
        push(o);
      }),
      win: safe(function (n, inkLeft, runS) {
        d.wins = (d.wins || 0) + 1;
        if (d.firstWinAttempt == null) d.firstWinAttempt = n;
        push({ e: 'w', l: lvl, m: mode, n: n, p: 100, i: r1(inkLeft * 100), ms: Math.round(runS * 1000) });
        save();
      }),
      pb: safe(function (kind, v) { push({ e: 'pb', m: mode, l: lvl, k: kind, v: r1(v) }); }),
      /* leaving a page or a course without finishing it: where it was left */
      quit: safe(function (n, progress, dist, st) {
        const o = { e: 'q', l: lvl, m: mode, n: n, st: st };
        if (dist != null) o.dist = r1(dist); else o.p = r1(progress * 100);
        push(o);
      }),
      dailyOpen: safe(function (day) { push({ e: 'do', day: day }); }),
      /* the opening: start, hint, fail, done, skipped (already done before) */
      tutorial: safe(function (k, extra) {
        const o = { e: 'tu', k: k };
        for (const key in extra) o[key] = extra[key];
        push(o);
      }),
      daily: safe(function (day, dist, rank, n) { push({ e: 'dr', day: day, dist: r1(dist), rank: rank, n: n }); }),
      leaderboard: safe(function (id) { push({ e: 'lb', l: id, m: 'c' }); }),
      nameChanged: safe(function (id) { push({ e: 'nm', l: id, m: 'c' }); }),
      winRank: safe(function (id, rank, improved) { push({ e: 'wr', l: id, m: 'c', rank: rank, improved: improved ? 1 : 0 }); }),
      end: function () {
        try {
          if (!ok) return;
          const last = d.ev[d.ev.length - 1];
          if (!(last && last.e === 'x' && last.att === attempts)) push({ e: 'x', dur: now() - t0, att: attempts });
          save(); flush(true);
        } catch (e) {}
      },
      /* inspection, for the person running the playtest */
      summary: function () {
        try {
          if (!ok) return null;
          const deaths = d.ev.filter(function (x) { return x.e === 'd'; });
          const retried = d.ev.filter(function (x, i) {
            return x.e === 'd' && d.ev.slice(i + 1).some(function (y) { return y.e === 'a'; });
          }).length;
          return {
            player: d.pid, firstPlayed: new Date(d.created).toISOString(),
            lastPlayed: new Date(d.lastSeen).toISOString(),
            sessions: d.sessions, attempts: d.attempts, completions: d.wins,
            attemptsBeforeFirstCompletion: d.firstWinAttempt,
            retryAfterDeathPct: deaths.length ? Math.round(retried / deaths.length * 1000) / 10 : null,
            thisSession: { n: sessionN, attempts: attempts, durationSec: Math.round((now() - t0) / 1000) },
            input: d.input, events: d.ev.length,
          };
        } catch (e) { return null; }
      },
      events: function () { return ok ? d.ev.slice() : []; },
      export: function () { try { return JSON.stringify(d); } catch (e) { return null; } },
      clear: function () { try { localStorage.removeItem(KEY); } catch (e) {} },
      flush: function () { try { flush(false); } catch (e) {} },
      get pid() { return ok ? d.pid : null; },
      get ok() { return ok; },
      get endpoint() { return ENDPOINT; },
    };
  })();

  /* ── sound ─────────────────────────────────────────────────────────────
     No music, no samples, no clips. Every sound is synthesised from noise and
     a couple of oscillators, so nothing can loop audibly and no two impacts
     are identical. The world is the soundtrack: a nib on paper, ink in glass,
     a body landing, and silence in between.

     The graph is built once on the first gesture and then only has numbers
     written to it, once a frame, from the game loop. Nothing here runs in a
     pointer handler, so audio cannot cost input latency. If the Web Audio API
     is missing, blocked or refuses to start, `ok` stays false and every call
     below becomes a no-op. */
  const Sound = (function () {
    const KEY = 'inkline.sound';
    let ctx = null, ok = false, on = true, started = false;
    let master = null, dry = null, wetSend = null, pen = null, roll = null, buf = null;
    let turnKick = 0;

    try { on = localStorage.getItem(KEY) !== '0'; } catch (e) {}

    /* paper: pink noise with a slow density texture, so the loop has grain of
       its own before any filtering */
    function paperBuffer(c, secs) {
      const n = Math.floor(c.sampleRate * secs);
      const b = c.createBuffer(1, n, c.sampleRate);
      const o = b.getChannelData(0);
      let b0 = 0, b1 = 0, b2 = 0, b3 = 0, b4 = 0, b5 = 0, b6 = 0;
      let tex = 0.8, texT = 0;
      for (let i = 0; i < n; i++) {
        const w = Math.random() * 2 - 1;
        b0 = 0.99886 * b0 + w * 0.0555179;
        b1 = 0.99332 * b1 + w * 0.0750759;
        b2 = 0.96900 * b2 + w * 0.1538520;
        b3 = 0.86650 * b3 + w * 0.3104856;
        b4 = 0.55000 * b4 + w * 0.5329522;
        b5 = -0.7616 * b5 - w * 0.0168980;
        const pk = b0 + b1 + b2 + b3 + b4 + b5 + b6 + w * 0.5362;
        b6 = w * 0.115926;
        if (--texT <= 0) { tex = 0.62 + Math.random() * 0.5; texT = 40 + Math.random() * 500; }
        o[i] = pk * 0.11 * tex;
      }
      return b;
    }

    /* a very small, dark room: close-mic intimacy, not reverb */
    function roomBuffer(c) {
      const n = Math.floor(c.sampleRate * 0.13);
      const b = c.createBuffer(2, n, c.sampleRate);
      for (let ch = 0; ch < 2; ch++) {
        const o = b.getChannelData(ch);
        let lp = 0;
        for (let i = 0; i < n; i++) {
          const e = Math.pow(1 - i / n, 3.4);
          lp = lp * 0.72 + (Math.random() * 2 - 1) * 0.28;
          o[i] = lp * e * 0.5;
        }
      }
      return b;
    }

    function src(c, b, rate, loop) {
      const s = c.createBufferSource();
      s.buffer = b; s.loop = !!loop;
      s.playbackRate.value = rate;
      return s;
    }
    function gain(c, v) { const g = c.createGain(); g.gain.value = v; return g; }
    function filt(c, type, f, q, g) {
      const b = c.createBiquadFilter();
      b.type = type; b.frequency.value = f;
      if (q != null) b.Q.value = q;
      if (g != null) b.gain.value = g;
      return b;
    }
    const vary = function (v, amt) { return v * (1 + (Math.random() * 2 - 1) * amt); };

    /* ── the nib ────────────────────────────────────────────────────────
       One noise source through two voices: a wet, low, controlled body and a
       dry, bright scratch. Drawing speed sets the source's playback rate, so
       the *rate of the grain* follows the hand — the reason it reads as a nib
       travelling rather than a sample being retriggered. Ink level crossfades
       wet into dry and opens the filters upward. */
    function buildPen(c, dest, b) {
      const o = {};
      o.src = src(c, b, 1, true);
      o.wetF = filt(c, 'bandpass', 700, 0.7);
      o.wetG = gain(c, 0);
      o.dryF = filt(c, 'highpass', 1500, 0.6);
      o.peak = filt(c, 'peaking', 3200, 1.1, 6);
      o.dryG = gain(c, 0);
      o.bus = gain(c, 0);
      o.src.connect(o.wetF); o.wetF.connect(o.wetG); o.wetG.connect(o.bus);
      o.src.connect(o.dryF); o.dryF.connect(o.peak); o.peak.connect(o.dryG); o.dryG.connect(o.bus);
      o.bus.connect(dest);
      return o;
    }

    function penParams(o, t, active, speed, inkRatio, turn) {
      const sp = Math.min(1, speed / 620);
      const wetness = Math.max(0, Math.min(1, (inkRatio - 0.02) / 0.24));
      const motion = Math.min(1, speed / 90);            // a nib held still makes no sound
      const level = active
        ? ((0.012 + 0.33 * sp) * (0.55 + 0.45 * wetness) + (inkRatio <= 0 ? 0.055 : 0)) * motion
        : 0;
      const k = 0.03;
      o.bus.gain.setTargetAtTime(level, t, active ? k : 0.05);
      o.src.playbackRate.setTargetAtTime(0.48 + 1.35 * sp, t, 0.05);
      o.wetG.gain.setTargetAtTime(0.2 + 0.8 * wetness, t, k);
      o.dryG.gain.setTargetAtTime((0.18 + 0.82 * (1 - wetness)) * (0.7 + 0.5 * sp) + turn * 0.5, t, k);
      o.wetF.frequency.setTargetAtTime(660 + 780 * (1 - wetness) + 220 * sp, t, k);
      o.dryF.frequency.setTargetAtTime(1350 + 1250 * (1 - wetness), t, k);
      o.peak.gain.setTargetAtTime(3 + 9 * (1 - wetness), t, k);
    }

    /* the runner travelling on paper: a whisper, never a footstep */
    function buildRoll(c, dest, b) {
      const o = {};
      o.src = src(c, b, 0.8, true);
      o.f = filt(c, 'lowpass', 380, 0.9);
      o.g = gain(c, 0);
      o.src.connect(o.f); o.f.connect(o.g); o.g.connect(dest);
      return o;
    }

    /* ── one-shots ─────────────────────────────────────────────────────── */
    function landIn(c, dest, b, sev, t) {
      const s = src(c, b, vary(1.1, 0.12), false);
      const f = filt(c, 'lowpass', vary(1150 - 700 * sev, 0.1), 0.9);
      const g = gain(c, 0);
      s.connect(f); f.connect(g); g.connect(dest);
      const peak = vary(0.05 + 0.26 * sev, 0.12), dur = 0.05 + 0.10 * sev;
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(Math.max(0.002, peak), t + 0.005);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      s.start(t); s.stop(t + dur + 0.02);
      if (sev > 0.3) {                                   // the weight of it
        const o = c.createOscillator(), og = gain(c, 0);
        o.type = 'sine';
        o.frequency.setValueAtTime(vary(165 - 55 * sev, 0.08), t);
        o.frequency.exponentialRampToValueAtTime(vary(72, 0.08), t + 0.09);
        o.connect(og); og.connect(dest);
        og.gain.setValueAtTime(0.0001, t);
        og.gain.exponentialRampToValueAtTime(vary(0.10 * sev, 0.15), t + 0.008);
        og.gain.exponentialRampToValueAtTime(0.0001, t + 0.11);
        o.start(t); o.stop(t + 0.13);
      }
    }

    function splatIn(c, dest, b, power, t) {
      const s = src(c, b, vary(0.85, 0.1), false);
      const f = filt(c, 'lowpass', 1700, 1.0);
      const g = gain(c, 0);
      s.connect(f); f.connect(g); g.connect(dest);
      f.frequency.setValueAtTime(vary(1700, 0.08), t);
      f.frequency.exponentialRampToValueAtTime(vary(300, 0.1), t + 0.14);
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(vary(0.34 + 0.16 * power, 0.1), t + 0.004);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.17);
      s.start(t); s.stop(t + 0.2);

      const w = src(c, b, vary(0.6, 0.1), false);          // the wet body of it
      const wf = filt(c, 'bandpass', vary(430, 0.12), 1.3);
      const wg = gain(c, 0);
      w.connect(wf); wf.connect(wg); wg.connect(dest);
      wg.gain.setValueAtTime(0.0001, t);
      wg.gain.exponentialRampToValueAtTime(vary(0.2, 0.12), t + 0.006);
      wg.gain.exponentialRampToValueAtTime(0.0001, t + 0.13);
      w.start(t); w.stop(t + 0.15);

      const n = 3 + Math.floor(Math.random() * 3);         // flecks landing after
      for (let i = 0; i < n; i++) {
        const dt = 0.03 + Math.random() * 0.13;
        const d = src(c, b, vary(1.5, 0.2), false);
        const df = filt(c, 'highpass', vary(1900, 0.2), 0.8);
        const dg = gain(c, 0);
        d.connect(df); df.connect(dg); dg.connect(dest);
        dg.gain.setValueAtTime(0.0001, t + dt);
        dg.gain.exponentialRampToValueAtTime(vary(0.045, 0.3), t + dt + 0.003);
        dg.gain.exponentialRampToValueAtTime(0.0001, t + dt + 0.035);
        d.start(t + dt); d.stop(t + dt + 0.05);
      }
    }

    /* ink arriving in glass: the rising pitch of a drop into liquid, a small
       splash, and the bottle answering. Not a reward chime. */
    function dropIn(c, dest, b, t) {
      const o = c.createOscillator(), og = gain(c, 0);
      o.type = 'sine';
      o.frequency.setValueAtTime(vary(420, 0.06), t);
      o.frequency.exponentialRampToValueAtTime(vary(960, 0.06), t + 0.07);
      o.connect(og); og.connect(dest);
      og.gain.setValueAtTime(0.0001, t);
      og.gain.exponentialRampToValueAtTime(vary(0.12, 0.12), t + 0.006);
      og.gain.exponentialRampToValueAtTime(0.0001, t + 0.1);
      o.start(t); o.stop(t + 0.12);

      const sp = src(c, b, vary(1.3, 0.15), false);
      const sf = filt(c, 'bandpass', vary(1750, 0.15), 1.1);
      const sg = gain(c, 0);
      sp.connect(sf); sf.connect(sg); sg.connect(dest);
      sg.gain.setValueAtTime(0.0001, t + 0.005);
      sg.gain.exponentialRampToValueAtTime(vary(0.06, 0.2), t + 0.012);
      sg.gain.exponentialRampToValueAtTime(0.0001, t + 0.07);
      sp.start(t + 0.005); sp.stop(t + 0.09);

      const gl = c.createOscillator(), gg = gain(c, 0);    // glass, barely there
      gl.type = 'sine'; gl.frequency.value = vary(2150, 0.08);
      gl.connect(gg); gg.connect(dest);
      gg.gain.setValueAtTime(0.0001, t + 0.01);
      gg.gain.exponentialRampToValueAtTime(vary(0.03, 0.2), t + 0.016);
      gg.gain.exponentialRampToValueAtTime(0.0001, t + 0.06);
      gl.start(t + 0.01); gl.stop(t + 0.08);
    }

    function rippleIn(c, dest, t) {
      const o = c.createOscillator(), g = gain(c, 0);
      o.type = 'sine';
      o.frequency.setValueAtTime(vary(190, 0.07), t);
      o.frequency.exponentialRampToValueAtTime(vary(150, 0.07), t + 0.2);
      o.connect(g); g.connect(dest);
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(vary(0.05, 0.15), t + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.22);
      o.start(t); o.stop(t + 0.24);
    }

    /* a fresh page pulled into place */
    function pageIn(c, dest, b, t) {
      const s = src(c, b, vary(1.15, 0.12), false);
      const f = filt(c, 'bandpass', vary(1500, 0.12), 0.75);
      const g = gain(c, 0);
      s.connect(f); f.connect(g); g.connect(dest);
      f.frequency.exponentialRampToValueAtTime(vary(750, 0.12), t + 0.14);
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(vary(0.075, 0.15), t + 0.03);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.15);
      s.start(t); s.stop(t + 0.17);
    }

    /* home: a nib's flourish across the page, then two soft notes in glass,
       a fifth apart. Warm and short; it is a page finished, not a jackpot. */
    function successIn(c, dest, b, t) {
      const s = src(c, b, vary(1.25, 0.08), false);
      const f = filt(c, 'bandpass', 2400, 0.9);
      const g = gain(c, 0);
      s.connect(f); f.connect(g); g.connect(dest);
      f.frequency.setValueAtTime(1700, t); f.frequency.exponentialRampToValueAtTime(3400, t + 0.16);
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.05, t + 0.03);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.2);
      s.start(t); s.stop(t + 0.22);
      [[660, 0.12], [990, 0.24]].forEach(function (nt) {
        const o = c.createOscillator(), og = gain(c, 0), at = t + nt[1];
        o.type = 'sine'; o.frequency.value = vary(nt[0], 0.004);
        o.connect(og); og.connect(dest);
        og.gain.setValueAtTime(0.0001, at);
        og.gain.exponentialRampToValueAtTime(0.07, at + 0.012);
        og.gain.exponentialRampToValueAtTime(0.0001, at + 0.55);
        o.start(at); o.stop(at + 0.6);
      });
    }

    /* choosing something: the smallest tap of a nib on paper */
    function clickIn(c, dest, b, t) {
      const s = src(c, b, vary(1.6, 0.1), false);
      const f = filt(c, 'bandpass', vary(2600, 0.1), 1.2);
      const g = gain(c, 0);
      s.connect(f); f.connect(g); g.connect(dest);
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(vary(0.06, 0.15), t + 0.003);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.035);
      s.start(t); s.stop(t + 0.05);
    }

    function build(c, dest) {
      const comp = c.createDynamicsCompressor();
      comp.threshold.value = -20; comp.knee.value = 24;
      comp.ratio.value = 3.5; comp.attack.value = 0.004; comp.release.value = 0.16;
      const m = gain(c, 0.9);
      comp.connect(m); m.connect(dest);
      const d = gain(c, 1);
      d.connect(comp);
      let w = null;
      try {
        const cv = c.createConvolver();
        cv.buffer = roomBuffer(c);
        const wg = gain(c, 0.14);
        cv.connect(wg); wg.connect(comp);
        w = gain(c, 1); w.connect(cv);
      } catch (e) { w = null; }
      return { comp: comp, master: m, dry: d, wet: w };
    }

    let building = false, wantOn = false;
    function ensure() {
      if (ctx || building) return;
      building = true;
      const go = function () {
        building = false;
        try {
          const AC = window.AudioContext || window.webkitAudioContext;
          if (!AC) return;
          ctx = new AC();
          buf = paperBuffer(ctx, 4);
          const g = build(ctx, ctx.destination);
          master = g.master; dry = g.dry; wetSend = g.wet;
          pen = buildPen(ctx, g.comp, buf);
          roll = buildRoll(ctx, g.comp, buf);
          pen.src.start(0, Math.random() * 3);
          roll.src.start(0, Math.random() * 3);
          started = true; ok = true;
          if (wantOn && ctx.state === 'suspended') ctx.resume();
        } catch (e) { ok = false; ctx = null; }
      };
      try {
        if (window.requestIdleCallback) requestIdleCallback(go, { timeout: 900 });
        else setTimeout(go, 260);
      } catch (e) { setTimeout(go, 260); }
    }

    return {
      /* Building the graph costs around a tenth of a second, nearly all of it
         in the AudioContext constructor. That must never land on a tap, so it
         is built during the opening beat while the runner is still standing on
         the title — a context may be created before any gesture as long as it
         is only *resumed* after one, and activation is sticky, so resuming
         from the deferred callback is still legitimate. */
      prime: function () { if (on) ensure(); },
      wake: function () {
        wantOn = true;
        if (!on) return;
        try {
          if (!ctx) { ensure(); return; }
          if (ctx.state === 'suspended') ctx.resume();     // cheap: the gesture path
        } catch (e) {}
      },
      get ok() { return ok; },
      get on() { return on; },
      toggle: function () {
        on = !on;
        try { localStorage.setItem(KEY, on ? '1' : '0'); } catch (e) {}
        try {
          if (!on && ctx) { master.gain.setTargetAtTime(0, ctx.currentTime, 0.02); setTimeout(function () { try { if (!on) ctx.suspend(); } catch (e) {} }, 120); }
          else if (on) { wantOn = true; if (!ctx) ensure(); else { ctx.resume(); master.gain.setTargetAtTime(0.9, ctx.currentTime, 0.02); } }
        } catch (e) {}
        return on;
      },
      /* one write per frame, from the game loop */
      hold: false,                  // fast-forward (tests): the audio clock is not moving, so say nothing
      frame: function (dt, active, penSpeed, inkRatio, grounded, ballSpeed) {
        if (!ok || !on || !started || this.hold) return;
        try {
          const t = ctx.currentTime;
          turnKick = Math.max(0, turnKick - dt * 4);
          penParams(pen, t, active, penSpeed, inkRatio, turnKick);
          const rs = Math.min(1, ballSpeed / 620);
          roll.g.gain.setTargetAtTime(grounded ? 0.012 + 0.042 * rs : 0, t, 0.05);
          roll.src.playbackRate.setTargetAtTime(0.62 + 0.9 * rs, t, 0.08);
          roll.f.frequency.setTargetAtTime(300 + 420 * rs, t, 0.08);
        } catch (e) {}
      },
      turn: function (amount) { turnKick = Math.min(0.6, turnKick + amount); },
      land: function (impact) {
        if (!ok || !on) return;
        try { landIn(ctx, dry, buf, Math.max(0, Math.min(1, (impact - 70) / 470)), ctx.currentTime); } catch (e) {}
      },
      splat: function (power) {
        if (!ok || !on) return;
        try {
          const t = ctx.currentTime;
          splatIn(ctx, dry, buf, Math.max(0, Math.min(1, power)), t);
          if (wetSend) splatIn(ctx, wetSend, buf, 0, t);
        } catch (e) {}
      },
      drop: function () { if (!ok || !on) return; try { dropIn(ctx, dry, buf, ctx.currentTime); if (wetSend) dropIn(ctx, wetSend, buf, ctx.currentTime); } catch (e) {} },
      ripple: function () { if (!ok || !on) return; try { rippleIn(ctx, dry, ctx.currentTime); } catch (e) {} },
      page: function () { if (!ok || !on) return; try { pageIn(ctx, dry, buf, ctx.currentTime); } catch (e) {} },
      success: function () {
        if (!ok || !on) return;
        try { successIn(ctx, dry, buf, ctx.currentTime); if (wetSend) successIn(ctx, wetSend, buf, ctx.currentTime); } catch (e) {}
      },
      click: function () { if (!ok || !on) return; try { clickIn(ctx, dry, buf, ctx.currentTime); } catch (e) {} },

      /* offline render, for measuring what the synth actually produces */
      probe: function (kind, opts) {
        try {
          const OC = window.OfflineAudioContext || window.webkitOfflineAudioContext;
          if (!OC) return null;
          opts = opts || {};
          const secs = opts.secs || 0.5;
          const c = new OC(1, Math.ceil(44100 * secs), 44100);
          const b = paperBuffer(c, Math.max(1, secs));
          const g = build(c, c.destination);
          if (kind === 'pen') {
            const o = buildPen(c, g.comp, b);
            o.src.start(0);
            penParams(o, 0, true, opts.speed || 200, opts.ink == null ? 1 : opts.ink, 0);
          } else if (kind === 'land') landIn(c, g.dry, b, opts.sev || 0.5, 0.01);
          else if (kind === 'splat') splatIn(c, g.dry, b, 1, 0.01);
          else if (kind === 'drop') dropIn(c, g.dry, b, 0.01);
          else if (kind === 'page') pageIn(c, g.dry, b, 0.01);
          else if (kind === 'success') successIn(c, g.dry, b, 0.01);
          else if (kind === 'click') clickIn(c, g.dry, b, 0.01);
          return c.startRendering().then(function (rendered) {
            const x = rendered.getChannelData(0);
            let sum = 0, peak = 0, zc = 0;
            for (let i = 0; i < x.length; i++) {
              sum += x[i] * x[i];
              if (Math.abs(x[i]) > peak) peak = Math.abs(x[i]);
              if (i && ((x[i] < 0) !== (x[i - 1] < 0))) zc++;
            }
            const rms = Math.sqrt(sum / x.length);
            let tail = x.length - 1;
            while (tail > 0 && Math.abs(x[tail]) < peak * 0.02) tail--;
            return { rms: rms, peak: peak,
                     brightness: zc / 2 / secs,            // zero crossings/sec
                     durationMs: Math.round(tail / 44100 * 1000) };
          });
        } catch (e) { return null; }
      },
    };
  })();

  /* LEVELS, WORLDS: see the campaign section further down. */
  let LEVEL = null;
  /* One engine, four ways to play it. A procedural run's LEVEL is a live view
     onto a COURSE from gen.js; everything else reads LEVEL as it always has. */
  let MODE = 'campaign';           // campaign | endless | daily | zen
  let COURSE = null;
  const Gen = window.InkGen;
  /* the clock the daily course is chosen by; tests move it to cross midnight */
  const Clock = { off: 0, now: function () { return Date.now() + this.off; } };

  /* ── canvas / viewport ──────────────────────────────────────────────── */
  const cv  = document.getElementById('game');
  const ctx = cv.getContext('2d', { alpha: false });
  let DPR = 1, CW = 0, CH = 0, scale = 1, VW = 0, VH = 0, G = 0, paper = null;

  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2.5);
    CW = cv.clientWidth || window.innerWidth;
    CH = cv.clientHeight || window.innerHeight;
    cv.width  = Math.max(1, Math.round(CW * DPR));
    cv.height = Math.max(1, Math.round(CH * DPR));
    scale = Math.min(CH / 560, CW / 680);
    VW = CW / scale;
    VH = CH / scale;
    G  = Math.min(VH - 140, VH * 0.72);
    buildPaper();
    if (scene === 'title') { Title.relayout(); return; }
    if (scene === 'campaign' || scene === 'daily' || scene === 'leaderboard') return;
    buildLevel();
    for (const s of strokes)
      for (let i = 0; i < s.pts.length - 1; i++)
        addSeg({ x0: s.pts[i].x, y0: s.pts[i].y, x1: s.pts[i + 1].x, y1: s.pts[i + 1].y });
  }

  function applyTheme(th) {
    if (THEME === th && paper) return;
    THEME = th;
    PAPER = th.paper; INK = th.ink; SOFT = th.soft; RED = th.red;
    if (cv.width > 1) buildPaper();
  }

  function buildPaper() {
    paper = document.createElement('canvas');
    paper.width = cv.width; paper.height = cv.height;
    const p = paper.getContext('2d');
    if (THEME.kind === 'blueprint') { blueprintPaper(p, paper.width, paper.height); return; }
    if (THEME.kind === 'highlighter') { highlighterPaper(p, paper.width, paper.height); return; }
    if (THEME.kind === 'crayon') { crayonPaper(p, paper.width, paper.height); return; }
    p.fillStyle = PAPER; p.fillRect(0, 0, paper.width, paper.height);
    const step = 44 * scale * DPR;
    p.strokeStyle = 'rgba(112,132,160,0.065)'; p.lineWidth = Math.max(1, DPR * 0.9);
    for (let y = step; y < paper.height; y += step) {
      p.beginPath();
      for (let x = 0; x <= paper.width; x += 26 * DPR) {
        const yy = y + Math.sin(x * 0.006 + y) * 0.9 * DPR;
        x ? p.lineTo(x, yy) : p.moveTo(x, yy);
      }
      p.stroke();
    }
    const fib = Math.round((paper.width * paper.height) / 2200);
    for (let i = 0; i < fib; i++) {
      const x = Math.random() * paper.width, y = Math.random() * paper.height;
      const a = Math.random() * 0.05 + 0.012;
      p.fillStyle = Math.random() < 0.55 ? 'rgba(96,84,60,' + a + ')' : 'rgba(255,255,255,' + (a * 1.7) + ')';
      p.fillRect(x, y, Math.random() * 3.4 * DPR + 0.6, Math.random() * 1.3 * DPR + 0.5);
    }
    const g = p.createRadialGradient(
      paper.width * 0.5, paper.height * 0.45, paper.height * 0.18,
      paper.width * 0.5, paper.height * 0.5,  paper.height * 1.02);
    g.addColorStop(0, 'rgba(0,0,0,0)');
    g.addColorStop(1, 'rgba(74,60,38,0.115)');
    p.fillStyle = g; p.fillRect(0, 0, paper.width, paper.height);
  }

  /* A working blueprint that has been folded, handled and left on a desk:
     uneven exposure, a technical grid, fold creases, a ring from a mug. */
  function blueprintPaper(p, W, H) {
    p.fillStyle = PAPER; p.fillRect(0, 0, W, H);
    const R = function (a) { return Math.random() * a; };
    for (let i = 0; i < 22; i++) {                            // uneven exposure
      const x = R(W), y = R(H), r = (0.15 + R(0.4)) * Math.max(W, H);
      const g = p.createRadialGradient(x, y, 0, x, y, r);
      g.addColorStop(0, Math.random() < 0.5 ? 'rgba(120,170,230,0.055)' : 'rgba(4,18,42,0.08)');
      g.addColorStop(1, 'rgba(0,0,0,0)');
      p.fillStyle = g; p.fillRect(0, 0, W, H);
    }
    const u = 22 * scale * DPR;                              // the grid
    for (let pass = 0; pass < 2; pass++) {
      let k = 0;
      for (let v = 0; v <= (pass ? H : W); v += u, k++) {
        const major = k % 5 === 0;
        p.strokeStyle = major ? 'rgba(206,226,250,0.15)' : 'rgba(206,226,250,0.065)';
        p.lineWidth = Math.max(1, DPR * (major ? 0.95 : 0.6));
        p.beginPath();
        if (pass) { p.moveTo(0, v); p.lineTo(W, v); } else { p.moveTo(v, 0); p.lineTo(v, H); }
        p.stroke();
      }
    }
    const crease = function (vertical, at) {                // folds: a bright edge beside a shadow
      for (const [dx, col] of [[0, 'rgba(225,238,255,0.11)'], [2 * DPR, 'rgba(3,15,36,0.16)']]) {
        p.strokeStyle = col; p.lineWidth = 1.4 * DPR;
        p.beginPath();
        for (let q = 0; q <= (vertical ? H : W); q += 30 * DPR) {
          const off = at + dx + Math.sin(q * 0.004) * 3 * DPR;
          vertical ? (q ? p.lineTo(off, q) : p.moveTo(off, q)) : (q ? p.lineTo(q, off) : p.moveTo(q, off));
        }
        p.stroke();
      }
    };
    crease(true, W * 0.38); crease(false, H * 0.57);
    const cx = W * (0.62 + R(0.25)), cy = H * (0.1 + R(0.25)), rr = 46 * scale * DPR;   // the mug
    p.strokeStyle = 'rgba(4,18,42,0.13)'; p.lineWidth = 3.5 * DPR;
    p.beginPath(); p.arc(cx, cy, rr, 0.3, 5.9); p.stroke();
    p.strokeStyle = 'rgba(4,18,42,0.06)'; p.lineWidth = 7 * DPR;
    p.beginPath(); p.arc(cx + 2 * DPR, cy + 1 * DPR, rr * 0.97, 1.2, 4.4); p.stroke();
    const n = Math.round((W * H) / 2600);                     // handling
    for (let i = 0; i < n; i++) {
      p.fillStyle = Math.random() < 0.6 ? 'rgba(230,242,255,' + (0.015 + R(0.035)) + ')' : 'rgba(2,12,30,' + (0.02 + R(0.05)) + ')';
      p.fillRect(R(W), R(H), R(3 * DPR) + 0.6, R(1.3 * DPR) + 0.5);
    }
    const g = p.createRadialGradient(W * 0.5, H * 0.45, H * 0.2, W * 0.5, H * 0.5, H * 1.05);
    g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(2,10,28,0.34)');
    p.fillStyle = g; p.fillRect(0, 0, W, H);
  }

  /* A printed handout that has been marked up: faint typeset lines, a
     margin rule, and a few old highlighter passes over words nobody needs.
     All of it sits far back — the page's real marks are in the level. */
  function highlighterPaper(p, W, H) {
    p.fillStyle = PAPER; p.fillRect(0, 0, W, H);
    const R = function (a) { return Math.random() * a; };
    const u = scale * DPR, lh = 30 * u;
    p.fillStyle = 'rgba(40,44,60,0.042)';
    const cols = W > H ? 2 : 1, colW = (W - 120 * u) / cols;
    for (let c = 0; c < cols; c++) {
      for (let y = 70 * u; y < H - 40 * u; y += lh) {
        if (Math.random() < 0.12) continue;                       // paragraph breaks
        let x = 60 * u + c * (colW + 40 * u), end = x + colW - 40 * u - (Math.random() < 0.2 ? R(colW * 0.5) : 0);
        while (x < end) {
          const ww = (14 + R(60)) * u;
          p.fillRect(x, y, Math.min(ww, end - x), 4 * u);
          if (Math.random() < 0.035) {                           // an old swipe over a word
            const hc = ['rgba(255,236,0,0.13)', 'rgba(255,72,170,0.10)', 'rgba(80,236,120,0.11)'][(R(3)) | 0];
            p.save(); p.fillStyle = hc; p.translate(x, y - 6 * u); p.rotate(-0.015 + R(0.03));
            p.fillRect(-4 * u, 0, ww + 8 * u, 16 * u); p.restore();
            p.fillStyle = 'rgba(40,44,60,0.042)';
          }
          x += ww + 7 * u;
        }
      }
    }
    p.strokeStyle = 'rgba(214,70,110,0.16)'; p.lineWidth = 1.2 * DPR;       // the margin
    p.beginPath(); p.moveTo(42 * u, 0); p.lineTo(42 * u, H); p.stroke();
    const n = Math.round((W * H) / 2600);
    for (let i = 0; i < n; i++) {
      p.fillStyle = Math.random() < 0.55 ? 'rgba(96,84,60,' + (0.01 + R(0.03)) + ')' : 'rgba(255,255,255,' + (0.04 + R(0.05)) + ')';
      p.fillRect(R(W), R(H), R(3 * DPR) + 0.6, R(1.3 * DPR) + 0.5);
    }
    const g = p.createRadialGradient(W * 0.5, H * 0.45, H * 0.2, W * 0.5, H * 0.5, H * 1.05);
    g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(70,60,50,0.09)');
    p.fillStyle = g; p.fillRect(0, 0, W, H);
  }

  /* Cartridge paper with a strong tooth, and a child's sky drawn on it long
     before any of this: a sun in the corner, a couple of clouds. Faint, and
     only ever outlines, so they never look like something to land on. */
  function crayonPaper(p, W, H) {
    p.fillStyle = PAPER; p.fillRect(0, 0, W, H);
    const R = function (a) { return Math.random() * a; }, u = scale * DPR;
    const n = Math.round((W * H) / 700);                      // the tooth
    for (let i = 0; i < n; i++) {
      p.fillStyle = Math.random() < 0.5 ? 'rgba(120,96,60,' + (0.02 + R(0.05)) + ')' : 'rgba(255,255,250,' + (0.1 + R(0.2)) + ')';
      p.fillRect(R(W), R(H), R(2.2 * DPR) + 0.5, R(1.2 * DPR) + 0.4);
    }
    const wax = THEME.wax;
    const scrib = function (col, a, pts, w) {                  // a waxy mark: a few rough passes
      for (let k = 0; k < 3; k++) {
        p.strokeStyle = col; p.globalAlpha = a * (0.55 + R(0.45)); p.lineWidth = (w + R(1.5)) * DPR;
        p.lineCap = 'round'; p.beginPath();
        pts.forEach(function (q, i) { const x = q[0] + (R(2) - 1) * 2 * DPR, y = q[1] + (R(2) - 1) * 2 * DPR; i ? p.lineTo(x, y) : p.moveTo(x, y); });
        p.stroke();
      }
      p.globalAlpha = 1;
    };
    const sx = W - 90 * u, sy = 80 * u, sr = 34 * u;          // the sun
    const ring = []; for (let a = 0; a <= 6.4; a += 0.3) ring.push([sx + Math.cos(a) * sr, sy + Math.sin(a) * sr]);
    scrib(wax.sun, 0.3, ring, 3);
    for (let a = 0; a < 6.28; a += 0.63) scrib(wax.sun, 0.26, [[sx + Math.cos(a) * sr * 1.35, sy + Math.sin(a) * sr * 1.35], [sx + Math.cos(a) * sr * 1.8, sy + Math.sin(a) * sr * 1.8]], 2.6);
    const cloud = function (cx, cy, k) {
      const pts = [];
      for (let a = Math.PI; a <= Math.PI * 2.02; a += 0.12) {
        const bump = 1 + 0.18 * Math.abs(Math.sin(a * 3));
        pts.push([cx + Math.cos(a) * 60 * k * u * bump, cy + Math.sin(a) * 26 * k * u * bump]);
      }
      pts.push(pts[0]);
      scrib(wax.sky, 0.18, pts, 2.2);
    };
    cloud(W * 0.22, H * 0.16, 1); cloud(W * 0.55, H * 0.1, 0.8);
    const g = p.createRadialGradient(W * 0.5, H * 0.45, H * 0.2, W * 0.5, H * 0.5, H * 1.05);
    g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(90,70,40,0.1)');
    p.fillStyle = g; p.fillRect(0, 0, W, H);
  }

  /* ── deterministic wobble ───────────────────────────────────────────── */
  function n1(i) { const x = Math.sin(i * 127.1 + 0.7) * 43758.5453; return x - Math.floor(x); }
  function nn(i) { return n1(i) * 2 - 1; }
  let boil = 0;

  /* ── collision world ────────────────────────────────────────────────── */
  const CELL = 64;
  const grid = new Map();
  let printedPolys = [], plinthShapes = [], hazards = [], drops = [];

  function addSeg(s) {
    const a = Math.floor(Math.min(s.x0, s.x1) / CELL);
    const b = Math.floor(Math.max(s.x0, s.x1) / CELL);
    for (let i = a; i <= b; i++) {
      let arr = grid.get(i);
      if (!arr) grid.set(i, arr = []);
      arr.push(s);
    }
  }
  function near(x, pad) {
    const a = Math.floor((x - pad) / CELL), b = Math.floor((x + pad) / CELL);
    const out = [];
    for (let i = a; i <= b; i++) { const arr = grid.get(i); if (arr) for (const s of arr) out.push(s); }
    return out;
  }

  function wobbleLine(x0, x1, y, amp, seedBase, yEnd) {
    const pts = [];
    const stepX = 14;
    const y1 = yEnd === undefined ? y : yEnd;
    const at = function (x) { return x1 > x0 ? y + (y1 - y) * (x - x0) / (x1 - x0) : y; };
    for (let x = x0; x < x1; x += stepX) pts.push({ x: x, y: at(x) + nn(x * 0.31 + seedBase) * amp });
    pts.push({ x: x1, y: y1 + nn(x1 * 0.31 + seedBase) * amp });
    return pts;
  }

  /* One level, printed or procedural, goes into the same grid through these.
     A generated course arrives in pieces that join exactly: their wobble is a
     function of x alone, so the seam between two pieces is invisible and flat. */
  function addPrinted(f) {
    const base = f.cont ? 0 : f.pts ? f.pts[0][0] : 0;
    const pts = f.pts
      ? f.pts.map(function (q) { return { x: q[0], y: G - q[1] + nn(q[0] * 0.31 + base) * 1.1 }; })
      : wobbleLine(f.x0, f.x1, G - f.h, 1.1, f.x0, f.h1 === undefined ? undefined : G - f.h1);
    pts.hl = f.hl; pts.wax = f.wax;
    printedPolys.push(pts);
    for (let i = 0; i < pts.length - 1; i++)
      addSeg({ x0: pts[i].x, y0: pts[i].y, x1: pts[i + 1].x, y1: pts[i + 1].y });
  }
  function addHazard(h) {
    hazards.push({ x0: h.x, x1: h.x + h.w, y0: G - h.hTop, y1: G - h.hBot, kind: h.kind, seed: h.x });
  }
  function addDrop(d, i) {
    drops.push({ x: d.x, y: G - d.h, i: i, taken: takenDrops.has(i), bob: d.x * 0.01 });
  }

  let takenDrops = new Set();        // by index, so a resize mid-run cannot refill the page
  let notesLive = [];
  let fed = null, pruneT = 0;

  function buildLevel() {
    grid.clear();
    printedPolys = []; plinthShapes = []; hazards = []; drops = []; notesLive = [];
    if (LEVEL.course) { fed = { p: 0, h: 0, d: 0, n: 0 }; feedCourse(); return; }

    for (const f of LEVEL.printed) addPrinted(f);

    for (const p of LEVEL.plinths) {
      const top = wobbleLine(p.x0, p.x1, G - p.h, 1.2, p.x0 + 9);
      plinthShapes.push({ top: top, x0: p.x0, x1: p.x1, y: G - p.h, wax: p.wax });
      for (let i = 0; i < top.length - 1; i++)
        addSeg({ x0: top[i].x, y0: top[i].y, x1: top[i + 1].x, y1: top[i + 1].y });
      addSeg({ x0: p.x0, y0: G - p.h, x1: p.x0, y1: G + 4 });   // left face
      addSeg({ x0: p.x1, y0: G - p.h, x1: p.x1, y1: G + 4 });   // right face
    }

    for (const h of LEVEL.hazards) addHazard(h);
    LEVEL.drops.forEach(addDrop);
  }

  /* ── a generated course, streamed ─────────────────────────────────────
     Built a screen and a half ahead of the camera, a chunk at a time (a chunk
     costs well under a millisecond), and forgotten a little behind it: the
     grid, the render lists and the hazard checks only ever hold what is near. */
  function feedCourse() {
    const C = COURSE, from = camX - 420, to = camX + VW + 1600;
    for (; fed.p < C.printed.length; fed.p++) {
      const f = C.printed[fed.p];
      if (f.pts[0][0] > to) break;                     // a retry on a course already built far ahead
      if (f.pts[f.pts.length - 1][0] >= from) addPrinted(f);
    }
    for (; fed.h < C.hazards.length; fed.h++) {
      const h = C.hazards[fed.h];
      if (h.x > to) break;
      if (h.x + h.w >= from) addHazard(h);
    }
    // blots can land a little behind the newest chunk, so they are not in x order
    for (; fed.d < C.drops.length; fed.d++) if (C.drops[fed.d].x >= from) addDrop(C.drops[fed.d], fed.d);
    if (THEME.kind === 'blueprint')
      for (; fed.n < C.notes.length; fed.n++) {
        const n = C.notes[fed.n];
        if ((n.x0 !== undefined ? n.x0 : n.x) > to) break;
        notesLive.push(n);
      }
  }
  function streamCourse(dt) {
    COURSE.ensure(camX + VW + 1500);
    feedCourse();
    pruneT += dt;
    if (pruneT < 0.5) return;
    pruneT = 0;
    const x = camX - 420, c = Math.floor(x / CELL);
    for (const k of grid.keys()) if (k < c) grid.delete(k);
    if (printedPolys.length && printedPolys[0][printedPolys[0].length - 1].x < x)
      printedPolys = printedPolys.filter(function (p) { return p[p.length - 1].x >= x; });
    if (hazards.length && hazards[0].x1 < x) hazards = hazards.filter(function (h) { return h.x1 >= x; });
    if (drops.length) drops = drops.filter(function (d) { return d.x >= x; });
    if (notesLive.length > 40) notesLive = notesLive.filter(function (n) { return (n.x1 !== undefined ? n.x1 : n.x) >= x - 200; });
  }

  /* ── run state ──────────────────────────────────────────────────────── */
  let scene = 'title';           // title | campaign | daily | play
  let state = 'play';            // play | dead | win | replay
  let strokes = [], ghost = [], drawing = null, penId = null, scratches = [];
  let penDist = 0, penTurn = 0, penAng = 0, penHas = false, penSpeed = 0;
  const soundBtn = { x: 0, y: 0, w: 0, h: 0 };
  const backBtn = { x: 0, y: 0, w: 0, h: 0 };
  let pendTap = null;
  let ink = INK_MAX, inkSpent = 0, runT = 0, endT = 0, deadReason = '';
  let camX = 0, camY = 0, shake = 0, splats = [], motes = [], flash = 0;
  /* The inkwell is a physical object on the desk: the level lags behind the
     true figure, the surface tilts with the run and settles on a spring. */
  const well = { shown: 1, tilt: 0, tiltV: 0, bob: 0, bobV: 0, pours: [], lastCamV: 0, ripple: 0 };
  let hasDrawn = false, everDrawn = false, attempt = 1, best = null;
  let bestProg = 0, lastProg = 0, progShown = 0, runAttempt = 1;
  let rec = null, replayT = 0;
  /* a procedural run: how far it got, what it came to, and how it started */
  let runMaxX = 0, deadAt = 0, winT = 0, runRes = null, nextVia = 'menu', homeT = 0;
  let safePts = [], zenT = 0, pbAt = 0, pbFlash = 0;
  const ball = { x: 0, y: 0, vx: 0, vy: 0, r: BALL_R, ang: 0, grounded: false,
                 nx: 0, ny: -1, air: 0, seed: 1.7, step: 0, hit: 0, landed: 0 };

  try { everDrawn = localStorage.getItem('inkline.drawn') === '1'; } catch (e) {}

  function reset(keepGhost) {
    if (keepGhost && strokes.length) ghost = strokes;
    strokes = []; drawing = null; penId = null; scratches = [];
    penDist = 0; penTurn = 0; penHas = false; penSpeed = 0; pendTap = null;
    ink = INK_MAX; inkSpent = 0; runT = 0; endT = 0; deadReason = ''; wellPose = null; wellLanded = false; runNote = null;
    splats = []; motes = []; shake = 0; flash = 0;
    hasDrawn = false;
    camX = 0; camY = 0;
    well.shown = 1; well.tilt = 0; well.tiltV = 0; well.bob = 0; well.bobV = 0;
    well.pours.length = 0; well.lastCamV = 0; well.ripple = 0;
    ball.x = 110; ball.y = G - 40; ball.vx = 0; ball.vy = 0;
    ball.ang = 0; ball.grounded = false; ball.nx = 0; ball.ny = -1; ball.air = 0; ball.step = 0;
    ball.hit = 0; ball.landed = 0;
    runMaxX = ball.x; winT = 0; runRes = null; safePts = []; zenT = 0; pbFlash = 0; BEAT = 0.55;
    takenDrops = new Set();
    if (MODE === 'campaign') {
      Progress.attempt(LEVEL.id);                 // attempts are counted per level, for good
      attempt = Progress.get(LEVEL.id).attempts;
      bestProg = Progress.get(LEVEL.id).bestProg;
      Stats.attempt(attempt, nextVia);
      Global.begin(LEVEL.id);
    } else {
      attempt = Records.attempt(MODE, COURSE.day);
      bestProg = 0;
      const pb = MODE === 'zen' ? 0 : currentPb();
      pbAt = pb >= 5 ? Gen.units(pb) : 0;
      Stats.attempt(attempt, nextVia, MODE === 'daily' ? { day: COURSE.day } : { seed: Gen.seedLabel(COURSE.seed) });
    }
    runAttempt = attempt;
    nextVia = 'menu';
    rec = { path: [], strokes: strokes, dur: 0 };
    buildLevel();
    state = 'play';
  }

  /* Again. In Endless that is a new course; in Daily it is today's course
     again (or tomorrow's, if midnight has passed since the last run). */
  function restart() {
    Sound.page();
    nextVia = 'retry';
    if (MODE === 'endless' || MODE === 'zen') { startCourse(MODE, randomSeed()); return; }
    if (MODE === 'daily' && Daily.today() !== COURSE.day) { startDaily(); return; }
    reset(MODE !== 'endless');
  }

  /* leaving a run for a menu: where it was left is worth knowing */
  function leaveRun() {
    if (scene !== 'play') return;
    if (state === 'play') {
      if (LEVEL.course) Stats.quit(runAttempt, 0, Gen.metres(runMaxX), 'play');
      else Stats.quit(runAttempt, Math.min(1, ball.x / LEVEL.finish), null, 'play');
    } else if (state === 'dead') Stats.quit(runAttempt, lastProg, LEVEL.course ? Gen.metres(runMaxX) : null, 'dead');
    Stats.flush();
  }
  function goBack() {
    leaveRun();
    if (MODE === 'campaign') Campaign.enter();
    else if (MODE === 'daily') Daily.enter();
    else { turnPage(); Title.enter({ direct: true }); }
  }

  /* ── physics ────────────────────────────────────────────────────────── */
  function resolveSeg(s) {
    const dx = s.x1 - s.x0, dy = s.y1 - s.y0;
    /* The top of a block's face doesn't stop a rolling ball: it is a step he
       climbs (see the corner rule below). Anything taller than just under his
       radius is still a wall. */
    if (dx === 0 && ball.air < 0.25 && ball.y + ball.r - Math.min(s.y0, s.y1) <= STEP) return false;
    const L2 = dx * dx + dy * dy;
    let t = L2 > 0 ? ((ball.x - s.x0) * dx + (ball.y - s.y0) * dy) / L2 : 0;
    t = t < 0 ? 0 : t > 1 ? 1 : t;
    const px = s.x0 + dx * t, py = s.y0 + dy * t;
    let nx = ball.x - px, ny = ball.y - py;
    let d = Math.hypot(nx, ny);
    if (d >= ball.r) return false;
    if (d < 1e-6) { nx = 0; ny = -1; d = 1e-6; } else { nx /= d; ny /= d; }
    ball.x += nx * (ball.r - d);
    ball.y += ny * (ball.r - d);
    const vn = ball.vx * nx + ball.vy * ny;
    /* A corner in front of him that stands less than his radius above his
       feet — a line that meets a ledge a little short, a block's edge, a join
       between strokes — is a step, not a wall: a rolling ball goes over it.
       He keeps his pace and gets just the lift to clear it. */
    if (vn < 0 && (t === 0 || t === 1) && ball.air < 0.25 && nx * ball.vx < 0) {
      const hs = ball.y + ball.r - py;
      /* (this matters most for tiny ones: the start of a line lying a unit or
         two above the floor would otherwise throw him twenty units into the
         air — straight into a low ceiling) */
      if (hs > 0.3 && hs <= STEP) {
        ball.vy = Math.min(ball.vy, -Math.sqrt(2 * GRAV * (hs + 0.3)));
        ball.vx *= hs > 3 ? 0.97 : 0.995;
        return true;
      }
    }
    if (vn < 0) {
      ball.vx -= (1 + REST) * vn * nx;
      ball.vy -= (1 + REST) * vn * ny;
      /* Land flat along your line and you keep everything. Drop onto it hard
         and the impact scrubs speed — the angle you land at is a skill. */
      const slam = Math.min(1, -vn / SLAM);
      if (slam > 0.12) { const k = 1 - 0.34 * slam * slam; ball.vx *= k; ball.vy *= k; }
    }
    if (ny < -0.35) { ball.grounded = true; ball.nx = nx; ball.ny = ny; }
    return true;
  }

  let BEAT = 0.55;                // the opening tutorial holds him a little longer
  function substep(h) {
    if (runT < BEAT) {            // a beat to read the title before he goes
      ball.vy += GRAV * h;
      ball.y += ball.vy * h;
      ball.grounded = false;
      const l0 = near(ball.x, ball.r + 6);
      for (let it = 0; it < 3; it++) {
        let hit = false;
        for (let i = 0; i < l0.length; i++) if (resolveSeg(l0[i])) hit = true;
        if (!hit) break;
      }
      return;
    }
    if (ball.grounded) {
      let tx = -ball.ny, ty = ball.nx;
      if (tx < 0) { tx = -tx; ty = -ty; }
      const vt = ball.vx * tx + ball.vy * ty;
      if (vt < CRUISE) {
        const climb = Math.max(0, -ty);        // 0 flat · 1 straight up
        const add = Math.min(DRIVE * (1 - 0.30 * climb) * h, CRUISE - vt);
        ball.vx += tx * add; ball.vy += ty * add;
      }
    } else if (ball.vx < CRUISE * 0.92) {
      ball.vx += AIRDRIVE * h;
    }
    ball.vy += GRAV * h;
    ball.vx *= (1 - 0.05 * h);
    ball.vy *= (1 - 0.02 * h);

    const sp = Math.hypot(ball.vx, ball.vy);
    if (sp > MAXV) { ball.vx *= MAXV / sp; ball.vy *= MAXV / sp; }

    ball.x += ball.vx * h;
    ball.y += ball.vy * h;

    const wasGrounded = ball.grounded;
    ball.grounded = false;
    ball.hit = 0;
    const list = near(ball.x, ball.r + 6);
    for (let it = 0; it < 3; it++) {
      let hit = false;
      for (let i = 0; i < list.length; i++) if (resolveSeg(list[i])) hit = true;
      if (!hit) break;
    }
    if (!wasGrounded && ball.grounded && ball.air > 0.06 && ball.hit > ball.landed) ball.landed = ball.hit;
    if (wasGrounded && !ball.grounded) ball.air = 0;
    ball.air = ball.grounded ? 0 : ball.air + h;
    ball.ang += (ball.vx / ball.r) * h * (ball.grounded ? 1 : 0.55);
    ball.step += Math.abs(ball.vx) * h * 0.06;
  }

  /* What a campaign run did to the numbers, for the card: this run's score,
     the page's best, the world before and after, and any world it opened. */
  let runNote = null;
  function noteRun(worldBefore, levelBefore, score) {
    const w = worldOf(LEVEL.id);
    runNote = { score: score, best: Mastery.level(LEVEL.id), was: levelBefore, world: w, before: worldBefore,
                after: Mastery.world(w), opened: Mastery.check(), t: 0 };
    if (runNote.after >= 300 && worldBefore < 300) runNote.perfect = true;
  }

  function die(reason) {
    if (state !== 'play') return;
    state = 'dead'; endT = runT; deadReason = reason; deadAt = performance.now();
    shake = REDUCED ? 0 : 1;
    Sound.splat(Math.hypot(ball.vx, ball.vy) / 700);
    burstSplat(ball.x, ball.y);
    if (rec) rec.dur = runT;
    try { if (navigator.vibrate) navigator.vibrate(16); } catch (e) {}
    if (LEVEL.course) { courseDeath(reason); return; }
    lastProg = Math.max(0, Math.min(1, ball.x / LEVEL.finish));
    progShown = 0;
    if (lastProg > bestProg) bestProg = lastProg;
    const wb = Mastery.world(worldOf(LEVEL.id)), lb = Mastery.level(LEVEL.id);
    const furthest = !Progress.done(LEVEL.id) && lastProg > (Progress.get(LEVEL.id).bestProg || 0) + 0.004 && runT >= 4;
    Progress.death(LEVEL.id, lastProg);
    noteRun(wb, lb, Mastery.pct(lastProg));
    Stats.death(runAttempt, lastProg, ink / INK_MAX, reason, runT);
    Global.death(LEVEL.id, lastProg, ink / INK_MAX, furthest ? dailyRun(0) : null);
    attempt++;                                   // scratched onto the page at once
    Stats.flush();
  }

  /* The end of a procedural run: distance, time and the best, at once. In
     Zen nothing ends; Inky is set back on the last good ground. */
  function courseDeath(reason) {
    const dist = Gen.metres(runMaxX);
    if (MODE === 'zen') { zenT = 0.8; return; }
    runRes = Records.result(MODE, dist, runT, COURSE.day);
    runRes.dist = dist; runRes.time = runT; runRes.net = MODE === 'daily' ? 'sending' : null;
    let kind = null;
    for (let i = COURSE.chunks.length - 1; i >= 0; i--) if (COURSE.chunks[i].a0 <= ball.x + 10) { kind = COURSE.chunks[i].kind; break; }
    Stats.death(runAttempt, 0, ink / INK_MAX, reason, runT, dist, kind);
    if (runRes.newPb) Stats.pb('dist', dist);
    if (runRes.newPbTime) Stats.pb('time', runT);
    if (MODE === 'daily') Daily.submit(runRes, dailyRun(dist));
    Stats.flush();
  }

  function zenRespawn() {
    // the newest good ground at least a second behind the fall
    let p = null;
    for (let i = safePts.length - 1; i >= 0; i--) if (safePts[i].t <= runT - 1.0) { p = safePts[i]; break; }
    if (!p) p = safePts[0] || { x: 110, y: G - 40, t: 0 };
    ball.x = p.x; ball.y = p.y - 6; ball.vx = 160; ball.vy = 0;
    ball.grounded = false; ball.air = 0; ball.hit = 0; ball.landed = 0;
    camX = Math.min(camX, ball.x - VW * 0.32);
    safePts = safePts.filter(function (q) { return q.x <= p.x; });
    state = 'play';
    Sound.page();
  }

  function burstSplat(x, y) {
    const sp = Math.hypot(ball.vx, ball.vy);
    splats.push({ x: x, y: y, r: 26, t: 0, main: true, seed: Math.random() * 99,
                  ang: Math.atan2(ball.vy, ball.vx), hard: Math.min(1, sp / 500) });
    const n = 26;
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2, s = 60 + Math.random() * 300;
      motes.push({
        x: x, y: y,
        vx: Math.cos(a) * s + ball.vx * 0.35,
        vy: Math.sin(a) * s - 90,
        r: 1.6 + Math.random() * 5.2, life: 0, set: false, seed: Math.random() * 99,
      });
    }
  }

  // one pass of numbers to the audio graph per frame, never from an event
  function penFeel(dt, live) {
    penSpeed += (penDist / Math.max(dt, 1e-3) - penSpeed) * Math.min(1, dt * 16);
    if (penTurn > 0.6) Sound.turn(Math.min(0.5, penTurn * 0.22));
    penDist = 0; penTurn = 0;
    Sound.frame(dt, penId !== null && live, penSpeed, ink / INK_MAX,
                ball.grounded && live, Math.hypot(ball.vx, ball.vy));
    if (ball.landed) { Sound.land(ball.landed); ball.landed = 0; }
  }

  function update(dt) {
    boil = REDUCED ? 3 : Math.floor(performance.now() * 0.008);
    if (shake > 0) shake = Math.max(0, shake - dt * 3.4);
    if (flash > 0) flash = Math.max(0, flash - dt * 2.2);

    for (const m of motes) {
      if (m.set) continue;
      m.life += dt;
      m.vy += GRAV * 1.1 * dt;
      m.x += m.vx * dt; m.y += m.vy * dt;
      m.vx *= (1 - 2.2 * dt);
      if (m.life > 0.28 + Math.random() * 0.18) m.set = true;
    }
    for (const s of splats) s.t += dt;
    if (scene === 'title') { Title.update(dt); return; }
    if (scene === 'campaign') { Campaign.update(dt); return; }
    if (scene === 'daily') { Daily.update(dt); return; }
    if (scene === 'leaderboard') { Board.update(dt); return; }

    penFeel(dt, state === 'play');
    updateHudCalm(dt);

    updateWell(dt);
    if (state === 'dead') progShown = Math.min(lastProg, progShown + dt * 3.2);
    if (state === 'dead' && MODE === 'zen' && (zenT -= dt) <= 0) zenRespawn();
    if (state === 'replay') { updateReplay(dt); return; }
    if (state === 'win') {                         // he runs on through the line
      winT += dt;
      if (LEVEL.house && ball.x >= LEVEL.house.x - 2) {   // in through the door
        ball.x = LEVEL.house.x; ball.vx = 0; ball.vy = 0; homeT += dt;
        if (homeT - dt < 0.55 && homeT >= 0.55) Sound.click();
      }
      else if (ball.x < LEVEL.finish + 220) stepPhysics(dt);
      else { ball.vx *= Math.max(0, 1 - dt * 6); }
      return;
    }
    if (state !== 'play') return;

    runT += dt;
    stepPhysics(dt);
    if (ball.x > runMaxX) {
      // going past your best is worth a nib-tap and a word, not a fanfare
      if (pbAt > 0 && runMaxX < pbAt && ball.x >= pbAt) { pbFlash = 1; Sound.click(); }
      runMaxX = ball.x;
    }
    if (pbFlash > 0) pbFlash = Math.max(0, pbFlash - dt * 0.45);

    // hazards
    for (const h of hazards) {
      if (ball.x + ball.r < h.x0 || ball.x - ball.r > h.x1) continue;
      const cx = Math.max(h.x0, Math.min(ball.x, h.x1));
      const cy = Math.max(h.y0, Math.min(ball.y, h.y1));
      const dx = ball.x - cx, dy = ball.y - cy;
      if (dx * dx + dy * dy < ball.r * ball.r * 0.86) { die('crash'); return; }
    }
    // ink blots
    for (const d of drops) {
      if (d.taken) continue;
      if (Math.hypot(ball.x - d.x, ball.y - d.y) < 24) {
        d.taken = true; takenDrops.add(d.i);
        ink = Math.min(INK_MAX, ink + INK_DROP);
        flash = 1;
        well.pours.push({ t: 0, dur: 0.42, sx: d.x - camX, sy: d.y - camY, seed: Math.random() * 99 });
        Sound.drop();
        for (let i = 0; i < 9; i++) {
          const a = Math.random() * Math.PI * 2;
          motes.push({ x: d.x, y: d.y, vx: Math.cos(a) * 130, vy: Math.sin(a) * 130 - 40,
                       r: 1.4 + Math.random() * 2.6, life: 0, set: false, seed: Math.random() * 99 });
        }
      }
    }

    // camera
    const ease = Math.min(1, Math.max(0, (runT - 0.55) / 2.4));
    const target = ball.x - VW * (0.60 - 0.28 * ease);
    if (target > camX) camX = target;
    if (hasDrawn && MODE !== 'zen') camX += SCROLL * dt;      // Zen never hurries you
    const ty = Math.min(0, ball.y - VH * 0.58);
    camY += (Math.max(-320, ty) - camY) * Math.min(1, dt * 3.2);
    if (camY > 0) camY = 0;

    if (rec.path.length === 0 || runT - rec.path[rec.path.length - 1].t > 0.014)
      rec.path.push({ t: runT, x: ball.x, y: ball.y, a: ball.ang, cx: camX, cy: camY, g: ball.grounded });

    if (LEVEL.course) {
      streamCourse(dt);
      updateRegion();
      // good ground to come back to, in Zen: on something, not rising, settled
      if (MODE === 'zen' && ball.grounded && ball.air === 0 && ball.ny < -0.8 &&
          (!safePts.length || ball.x > safePts[safePts.length - 1].x + 60)) {
        safePts.push({ x: ball.x, y: ball.y, t: runT });
        if (safePts.length > 60) safePts.shift();
      }
    }

    // outcomes
    if (ball.x >= LEVEL.finish) { winRun(); return; }
    if (ball.y > camY + VH + 70) { die('fell'); return; }
    if (ball.x - camX < -26) { die(ink <= 0 ? 'dry' : 'behind'); return; }
  }

  function updateWell(dt) {
    const target = Math.max(0, Math.min(1, ink / INK_MAX));
    // the level chases the true figure: draining reads as a fall, a pickup as a rise
    well.shown += (target - well.shown) * Math.min(1, dt * (target > well.shown ? 6 : 11));

    // slosh: the surface leans against changes in the run's pace
    const camV = state === 'play' ? ball.vx : 0;
    const acc = (camV - well.lastCamV) / Math.max(dt, 1e-4);
    well.lastCamV = camV;
    well.tiltV += (-well.tilt * 42 - well.tiltV * 5.2 - acc * 0.00022) * dt;
    well.tilt += well.tiltV * dt;
    well.tilt = Math.max(-0.22, Math.min(0.22, well.tilt));

    well.bobV += (-well.bob * 150 - well.bobV * 9) * dt;
    well.bob += well.bobV * dt;
    if (well.ripple > 0) well.ripple = Math.max(0, well.ripple - dt * 2.4);

    for (let i = well.pours.length - 1; i >= 0; i--) {
      const q = well.pours[i];
      q.t += dt / q.dur;
      if (q.t >= 1) {
        well.pours.splice(i, 1);
        well.bobV -= 26;                    // the well takes the hit and swells
        well.ripple = 1;
        Sound.ripple();
      }
    }
  }

  function stepPhysics(dt) {
    let t = Math.min(dt, 0.1);
    const SUB = 1 / 240;
    while (t > 0) { const h = Math.min(SUB, t); t -= h; substep(h); }
  }

  function winRun() {
    state = 'win'; endT = runT; rec.dur = runT; winT = 0;
    lastProg = 1; bestProg = 1;
    const fresh = !Progress.done(LEVEL.id);
    const wb = Mastery.world(worldOf(LEVEL.id)), lb = Mastery.level(LEVEL.id);
    const prevInk = Progress.get(LEVEL.id).bestInk;
    Progress.win(LEVEL.id, ink / INK_MAX, runT);
    noteRun(wb, lb, 100);
    runNote.left = ink / INK_MAX; runNote.prevInk = prevInk; runNote.firstWin = fresh;
    // home: a little hop of joy, and a few flecks of ink thrown up with it
    if (!LEVEL.house) {
      ball.vy = Math.min(ball.vy, -175);
      for (let i = 0; i < 7; i++) {
        const a = -Math.PI / 2 + (i - 3) * 0.32;
        motes.push({ x: ball.x, y: ball.y - 8, vx: Math.cos(a) * 150 + ball.vx * 0.2, vy: Math.sin(a) * 190,
                     r: 1.2 + Math.random() * 1.8, life: 0, set: false, seed: Math.random() * 99 });
      }
    }
    best = { ink: Progress.get(LEVEL.id).bestInk, first: fresh };
    Stats.win(runAttempt, ink / INK_MAX, runT);
    Global.win(LEVEL.id, ink / INK_MAX, dailyRun(0));
    if (fresh) Campaign.fresh(LEVEL.id);
    if (LEVEL.id === lastLevelId() && !Mastery.finished) { runNote.firstHome = true; Mastery.finished = true; }
    homeT = 0;
    Sound.success();
    keepWinningRun();
    Stats.flush();
  }

  /* ── replay ─────────────────────────────────────────────────────────── */
  function startReplay() {
    if (!rec || rec.path.length < 4) return;
    state = 'replay'; replayT = 0;
  }
  function updateReplay(dt) {
    replayT += dt;
    if (replayT > rec.dur + 0.6) { restart(); }
  }
  function replayPose() {
    const p = rec.path;
    let i = 1;
    while (i < p.length - 1 && p[i].t < replayT) i++;
    const a = p[i - 1], b = p[i];
    const k = b.t > a.t ? Math.max(0, Math.min(1, (replayT - a.t) / (b.t - a.t))) : 0;
    return { x: a.x + (b.x - a.x) * k, y: a.y + (b.y - a.y) * k,
             a: a.a + (b.a - a.a) * k, cx: a.cx + (b.cx - a.cx) * k, cy: a.cy + (b.cy - a.cy) * k };
  }

  /* ── drawing input ──────────────────────────────────────────────────── */
  function toScreen(cx, cy) {
    const r = cv.getBoundingClientRect();
    return { x: (cx - r.left) / scale, y: (cy - r.top) / scale };
  }
  function inBackBtn(p) {
    return p.x >= backBtn.x && p.x <= backBtn.x + backBtn.w
        && p.y >= backBtn.y && p.y <= backBtn.y + backBtn.h;
  }
  function inSoundBtn(p) {
    return p.x >= soundBtn.x && p.x <= soundBtn.x + soundBtn.w
        && p.y >= soundBtn.y && p.y <= soundBtn.y + soundBtn.h;
  }

  function toWorld(cx, cy) {
    const r = cv.getBoundingClientRect();
    return { x: (cx - r.left) / scale + camX, y: (cy - r.top) / scale + camY };
  }

  function beginStroke(p) {
    if (ink <= 0) return;
    hasDrawn = true;
    if (!everDrawn) { everDrawn = true; try { localStorage.setItem('inkline.drawn', '1'); } catch (e) {} }
    const s = { pts: [], minX: p.x, maxX: p.x, seed: Math.random() * 999, blots: [] };
    s.pts.push({ x: p.x, y: p.y, t: runT, w: 5.4, dry: false, L: 0 });
    if (Math.random() < 0.7) s.blots.push({ x: p.x + nn(p.x) * 5, y: p.y + nn(p.y + 3) * 5, r: 1 + Math.random() * 2.2 });
    strokes.push(s);
    drawing = s;
  }

  /* One sampled point of line: the geometry the runner collides with and the
     mark the player sees are the same thing, so what you drew is what you get. */
  function pushPoint(nx, ny, d) {
    const last = drawing.pts[drawing.pts.length - 1];
    const use = MODE === 'zen' ? 0 : Math.min(d, ink);        // Zen: the well never empties
    ink -= use; inkSpent += MODE === 'zen' ? d : use;
    const ratio = ink / INK_MAX;
    const i = drawing.pts.length;

    // width: fast strokes run thinner, and the nib always varies a little
    let w = 5.2 - Math.min(2.6, d * 0.05);
    w *= 0.82 + 0.34 * n1(i * 3.3 + drawing.seed);
    let dry = 0;                                   // 0 wet · 1 thin · 2 scratchy · 3 gapping
    if (ratio < DRY_GAP)       { dry = 3; w *= 0.40 + ratio * 3.0; }
    else if (ratio < DRY_SCR)  { dry = 2; w *= 0.52 + ratio * 2.2; }
    else if (ratio < DRY_THIN) { dry = 1; w *= 0.72 + ratio * 1.0; }

    const ang = Math.atan2(ny - last.y, nx - last.x);
    if (penHas) { let da = Math.abs(ang - penAng); if (da > Math.PI) da = Math.PI * 2 - da; penTurn += da; }
    penAng = ang; penHas = true; penDist += d;

    drawing.pts.push({ x: nx, y: ny, t: runT, w: Math.max(0.9, w), dry: dry, L: (last.L || 0) + d });
    if (nx < drawing.minX) drawing.minX = nx;
    if (nx > drawing.maxX) drawing.maxX = nx;
    addSeg({ x0: last.x, y0: last.y, x1: nx, y1: ny });
  }

  function extendStroke(p) {
    if (!drawing) return;
    if (ink <= 0) { dryScratch(p); endStroke(); return; }
    const last = drawing.pts[drawing.pts.length - 1];
    let dx = p.x - last.x, dy = p.y - last.y;
    let d = Math.hypot(dx, dy);
    if (d < MINSEG) return;

    // a fast flick between two pointer events is one long jump: walk it in
    // steps so the ground stays stable and the mark keeps its wobble
    if (d > MAXSEG) {
      const steps = Math.min(12, Math.ceil(d / MAXSEG));
      for (let i = 1; i <= steps; i++) {
        const prev = drawing.pts[drawing.pts.length - 1];
        const tx = last.x + dx * (i / steps), ty = last.y + dy * (i / steps);
        const sd = Math.hypot(tx - prev.x, ty - prev.y);
        if (ink <= 0) break;
        pushPoint(tx, ty, sd);
      }
    } else {
      pushPoint(last.x + dx, last.y + dy, d);
    }
    if (ink <= 0) { ink = 0; dryScratch(p); endStroke(); }
  }

  /* An empty well still drags a nib across the paper. It leaves a mark and no
     ground — the page tells you you are out, nothing has to announce it. */
  function dryScratch(p) {
    const lastS = scratches[scratches.length - 1];
    if (lastS && Math.hypot(p.x - lastS.x, p.y - lastS.y) < 9) return;
    penDist += lastS ? Math.hypot(p.x - lastS.x, p.y - lastS.y) : 6;
    scratches.push({ x: p.x, y: p.y, a: Math.random() * Math.PI, seed: Math.random() * 99 });
    if (scratches.length > 260) scratches.shift();
  }

  function endStroke() {
    if (drawing && drawing.pts.length > 2 && Math.random() < 0.55) {
      const p = drawing.pts[drawing.pts.length - 1];
      drawing.blots.push({ x: p.x + nn(p.x + 7) * 6, y: p.y + nn(p.y + 11) * 6, r: 1 + Math.random() * 2 });
    }
    drawing = null;
  }

  /* ── the mouse: steadied, not smoothed ──────────────────────────────────
     A mouse reports whole pixels at an uneven rate, so a slow hand drawn line
     comes out stepped and jittery where a finger's does not. A one-euro filter
     takes the jitter out of slow movement and gets out of the way of fast
     movement, so a quick flick stays a flick. Touch and pen are left raw, and
     the lift always lands exactly where the button came up. */
  function OneEuro(minCut, beta) {
    let x = null, dx = 0, tp = 0;
    const alpha = function (cut, dt) { const tau = 1 / (2 * Math.PI * cut); return 1 / (1 + tau / dt); };
    return {
      reset: function (v, t) { x = v; dx = 0; tp = t; },
      f: function (v, t) {
        if (x === null) { x = v; tp = t; return v; }
        const dt = Math.max(0.001, Math.min(0.1, (t - tp) / 1000));
        tp = t;
        const d = (v - x) / dt;
        dx += alpha(1.0, dt) * (d - dx);
        x += alpha(minCut + beta * Math.abs(dx), dt) * (v - x);
        return x;
      },
    };
  }
  const mouseF = { on: false, x: OneEuro(2.2, 0.012), y: OneEuro(2.2, 0.012) };
  function penAt(ev) {
    if (!mouseF.on) return toWorld(ev.clientX, ev.clientY);
    const t = ev.timeStamp || performance.now();
    return toWorld(mouseF.x.f(ev.clientX, t), mouseF.y.f(ev.clientY, t));
  }

  function inRunBtn(p, k) {
    const b = runBtns && runBtns[k];
    return b && p.x >= b.x - 6 && p.x <= b.x + b.w + 6 && p.y >= b.y - 8 && p.y <= b.y + b.h + 8;
  }

  cv.addEventListener('pointerdown', function (e) {
    e.preventDefault();
    Sound.wake();                                // browsers need a real gesture
    if (scene === 'title') { Title.pointer('down', e); return; }
    if (scene === 'campaign') { Campaign.pointer('down', e); return; }
    if (scene === 'daily') { Daily.pointer('down', e); return; }
    if (scene === 'leaderboard') { Board.pointer('down', e); return; }
    const sp = toScreen(e.clientX, e.clientY);
    if (state === 'dead') {
      if (MODE === 'zen') { if (inBackBtn(sp)) goBack(); return; }
      if (LEVEL.course) {
        /* a finger still coming down from the last line is not a retry */
        if (performance.now() - deadAt < 200) return;
        if (inRunBtn(sp, 'home')) { leaveRun(); turnPage(); Title.enter({ direct: true }); return; }
        if (inRunBtn(sp, 'zen')) { leaveRun(); turnPage(); Stats.mode('z'); startCourse('zen', randomSeed()); return; }
        if (inRunBtn(sp, 'board')) { leaveRun(); Daily.enter(); return; }
        Sound.click(); restart(); return;
      }
      if (inBackBtn(sp)) { goBack(); return; }
      restart(); return;
    }
    if (state === 'replay') { restart(); return; }
    if (state === 'win') {
      if (winT < cardAt()) return;               // let the tick land
      const s = winHit(e.clientX, e.clientY);
      Sound.click();
      if (s === 'board') Board.enter(LEVEL.id, 'win');
      else if (s === 'replay') startReplay();
      else if (s === 'next') { const nx = nextLevel(LEVEL.id); nx ? (turnPage(), startLevel(nx)) : Campaign.enter(); }
      else if (s === 'pages') Campaign.enter();
      else restart();
      return;
    }
    if (penId !== null) return;                  // one finger owns the line
    penId = e.pointerId;
    Stats.input(e.pointerType === 'mouse' ? 'mouse' : e.pointerType || 'touch');
    try { cv.setPointerCapture(e.pointerId); } catch (err) {}
    mouseF.on = e.pointerType === 'mouse';
    if (mouseF.on) { const t = e.timeStamp || performance.now(); mouseF.x.reset(e.clientX, t); mouseF.y.reset(e.clientY, t); }
    /* A press that starts on the sound toggle waits to see what it becomes: a
       tap toggles, a drag draws from where it began. Neither is lost. */
    if (inSoundBtn(sp) || inBackBtn(sp)) {
      pendTap = { x: e.clientX, y: e.clientY, what: inBackBtn(sp) ? 'back' : 'sound' };
      return;
    }
    if (ink <= 0) { dryScratch(toWorld(e.clientX, e.clientY)); return; }
    beginStroke(toWorld(e.clientX, e.clientY));
  }, { passive: false });

  cv.addEventListener('pointermove', function (e) {
    if (scene === 'title') { Title.pointer('move', e); return; }
    if (scene === 'campaign') { Campaign.pointer('move', e); return; }
    if (scene === 'daily') { Daily.pointer('move', e); return; }
    if (scene === 'leaderboard') { Board.pointer('move', e); return; }
    if (state === 'dead' && LEVEL.course && e.pointerType === 'mouse') {
      const sp = toScreen(e.clientX, e.clientY);
      cv.style.cursor = inRunBtn(sp, 'home') || inRunBtn(sp, 'zen') || inRunBtn(sp, 'board') ? 'pointer' : '';
    }
    if (state !== 'play' || e.pointerId !== penId) return;
    e.preventDefault();
    let evs = [e];
    if (e.getCoalescedEvents) {                    // every sample the screen took
      const c = e.getCoalescedEvents();
      if (c && c.length) evs = c;
    }
    if (pendTap) {
      if (Math.hypot(e.clientX - pendTap.x, e.clientY - pendTap.y) < 7) return;
      const st = pendTap; pendTap = null;        // a drag: draw from the press
      if (ink > 0) beginStroke(toWorld(st.x, st.y));
    }
    if (!drawing) { for (let i = 0; i < evs.length; i++) dryScratch(toWorld(evs[i].clientX, evs[i].clientY)); return; }
    for (let i = 0; i < evs.length; i++) extendStroke(penAt(evs[i]));
  }, { passive: false });
