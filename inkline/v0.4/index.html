    ctx.globalAlpha = 0.38; ctx.fillStyle = INK; ctx.font = '19px ' + FH;
    ctx.fillText('\u2039 pages', 20, 60);
    backBtn.x = 6; backBtn.y = 40; backBtn.w = 84; backBtn.h = 32;
    ctx.globalAlpha = 1;

    ctx.fillStyle = RED; ctx.globalAlpha = 0.85;
    ctx.font = '24px ' + FH;
    ctx.textAlign = 'right';
    ctx.fillText(shown.toFixed(1) + 's', VW - 18, 34);

    // how far down the page you have got, as a ruled margin mark
    const prog = state === 'play' ? Math.min(1, ball.x / LEVEL.finish)
               : state === 'replay' ? Math.min(1, camX / LEVEL.finish) : lastProg;
    const w = Math.min(190, VW * 0.3);
    const x0 = VW - 18 - w, y0 = 48;
    ctx.globalAlpha = 0.6; ctx.font = '19px ' + FH;
    ctx.fillText(Math.round(prog * 100) + '%', x0 - 10, y0 + 6);
    ctx.strokeStyle = RED; ctx.lineWidth = 1.6; ctx.globalAlpha = 0.32;
    ctx.beginPath();
    for (let i = 0; i <= w; i += 8) ctx.lineTo(x0 + i, y0 + nn(i * 0.5) * 0.9);
    ctx.stroke();
    ctx.globalAlpha = 0.9; ctx.lineWidth = 3.4;
    ctx.beginPath();
    for (let i = 0; i <= w * prog; i += 6) ctx.lineTo(x0 + i, y0 + nn(i * 0.5) * 1.1);
    ctx.stroke();
    if (bestProg > 0.02 && bestProg < 0.999) {          // furthest yet, nicked on the rule
      ctx.globalAlpha = 0.5; ctx.lineWidth = 1.8;
      ctx.beginPath();
      ctx.moveTo(x0 + w * bestProg, y0 - 6); ctx.lineTo(x0 + w * bestProg, y0 + 6);
      ctx.stroke();
    }
    drawSoundToggle(state === 'play');
  }

  // sound, written in the corner like everything else
  function drawSoundToggle(live) {
    ctx.font = '20px ' + FH;
    const label = 'sound';
    const lw = ctx.measureText(label).width;
    soundBtn.w = lw + 26; soundBtn.h = 30;

        ctx.lineTo(VW - 22 - lw + i, VH - 22 + nn(i * 0.8) * 1.2);

  /* cards -------------------------------------------------------------- */
  function cardFrame(x, y, w, h) {
    ctx.save();
    ctx.globalAlpha = 0.93; ctx.fillStyle = PAPER;
    ctx.beginPath(); ctx.rect(x, y, w, h); ctx.fill();
    ctx.globalAlpha = 1;
    ctx.strokeStyle = RED; ctx.lineWidth = 2.6; ctx.lineJoin = 'round';
    for (let pass = 0; pass < 2; pass++) {
      ctx.globalAlpha = pass ? 0.45 : 0.95;
      ctx.beginPath();
      const corners = [[x, y], [x + w, y], [x + w, y + h], [x, y + h], [x, y]];
      for (let c = 0; c < corners.length - 1; c++) {
        const a = corners[c], b = corners[c + 1];
        const steps = 10;
        for (let i = 0; i <= steps; i++) {
          const k = i / steps;
          const px = a[0] + (b[0] - a[0]) * k + nn(c * 7 + i + pass * 31) * 1.9;
          const py = a[1] + (b[1] - a[1]) * k + nn(c * 11 + i + pass * 17) * 1.9;
          (c === 0 && i === 0) ? ctx.moveTo(px, py) : ctx.lineTo(px, py);
        }
      }
      ctx.stroke();
    }
    ctx.globalAlpha = 1;
    ctx.restore();
  }

  function winHit(clientX, clientY) {
    if (!winBtns) return 'again';
    const r = cv.getBoundingClientRect();
    const x = (clientX - r.left) / scale, y = (clientY - r.top) / scale;
    for (const k in winBtns) {
      const b = winBtns[k];
      if (x >= b.x - 4 && x <= b.x + b.w + 4 && y >= b.y - 10 && y <= b.y + b.h + 8) return k;
    }
    return 'again';                              // anywhere else: straight back in
  }

  /* ── the run record ─────────────────────────────────────────────────────
     Every attempt is captured as plain, portable data: the course it was
     played on, what the runner did, and every mark the player made, with
     timings. It drives the replay today. It is also, unchanged, what a daily
     challenge would verify, what a ghost line would be drawn from, and what a
     shared replay would carry — so nothing here depends on this session, this
     device, or this build. */
  const REC_V = 1;

  function runRecord() {
    if (!rec) return null;
    const r2 = function (n) { return Math.round(n * 10) / 10; };
    /* Times keep millisecond precision: the replay interpolates on them, so
       rounding here would make a round-tripped run play back in steps. */
    const r3 = function (n) { return Math.round(n * 1000) / 1000; };
    return {
      v: REC_V,
      level: LEVEL.id,
      outcome: state === 'win' ? 'win' : state === 'dead' ? 'dead' : 'partial',
      reason: deadReason || null,
      time: r3(rec.dur || runT),
      attempt: runAttempt,
      ground: r2(G),                       // the run's ground line, for replay on any screen
      finish: LEVEL.finish,
      progress: r2(Math.min(1, ball.x / LEVEL.finish) * 100),
      ink: { max: INK_MAX, spent: Math.round(inkSpent), left: Math.round(ink) },
      strokes: strokes.map(function (st) {
        const p = [];
        for (const q of st.pts) p.push(r2(q.x), r2(q.y), r3(q.t), r2(q.w), q.dry | 0);
        return { seed: r2(st.seed), p: p };          // x,y,t,w,dry per point
      }),
      path: rec.path.map(function (q) {
        return [r3(q.t), r2(q.x), r2(q.y), r3(q.a), r2(q.cx), r2(q.cy), q.g ? 1 : 0];
      }),
    };
  }

  function serializeRun() { return runRecord(); }

  function keepWinningRun() {
    try {
      const j = JSON.stringify(runRecord());
      if (j.length < 900000) localStorage.setItem('inkline.lastwin', j);
    } catch (e) {}
  }

  /* ── turning the page ─────────────────────────────────────────────────
     Every move between pages freezes the page as it looked and pulls it away
     to the left over whatever comes next. */
  const turn = { t0: -1, snap: null };
  function turnPage() {
    try {
      if (!turn.snap || turn.snap.width !== cv.width || turn.snap.height !== cv.height) {
        turn.snap = document.createElement('canvas');
        turn.snap.width = cv.width; turn.snap.height = cv.height;
      }
      turn.snap.getContext('2d').drawImage(cv, 0, 0);
      turn.t0 = performance.now();
    } catch (e) { turn.t0 = -1; }
    Sound.page();
  }
  function drawTurn() {
    if (turn.t0 < 0 || !turn.snap) return;
    const k = (performance.now() - turn.t0) / 420;
    if (k >= 1) { turn.t0 = -1; return; }
    const W = cv.width, H = cv.height, e = k * k;
    const edge = W * (1 - e);
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.save();
    ctx.beginPath(); ctx.rect(0, 0, edge, H); ctx.clip();
    ctx.drawImage(turn.snap, -(W - edge) * 0.35, 0);
    ctx.restore();
    ctx.strokeStyle = '#15161B'; ctx.globalAlpha = 0.28; ctx.lineWidth = 1.6 * DPR;
    ctx.beginPath();
    for (let y = 0; y <= H; y += 24 * DPR) ctx.lineTo(edge + nn(y * 0.01 + boil) * 1.2 * DPR, y);
    ctx.stroke();
    ctx.globalAlpha = 1;
  }

  /* ── progress: what this player has done, per level ─────────────────────
     Kept on the device. It is also exactly what a 1–3 ink-drop rating would
     be computed from later (best ink left, first-win attempt, best time), so
     that can be added without touching how it is stored. */
  const Progress = (function () {
    const KEY = 'inkline.campaign.v1';
    let d = {};
    try { d = JSON.parse(localStorage.getItem(KEY) || '{}') || {}; } catch (e) { d = {}; }
    const rec = function (id) {
      return d[id] || (d[id] = { attempts: 0, wins: 0, bestInk: null, bestProg: 0, bestTime: null, firstWin: null });
    };
    const save = function () { try { localStorage.setItem(KEY, JSON.stringify(d)); } catch (e) {} };
    return {
      get: rec,
      done: function (id) { return rec(id).wins > 0; },
      attempt: function (id) { rec(id).attempts++; save(); },
      death: function (id, prog) { const r = rec(id); if (prog > r.bestProg) { r.bestProg = prog; save(); } },
      win: function (id, inkLeft, time) {
        const r = rec(id);
        r.wins++; r.bestProg = 1;
        if (r.firstWin == null) r.firstWin = r.attempts;
        if (r.bestInk == null || inkLeft > r.bestInk) r.bestInk = inkLeft;
        if (r.bestTime == null || time < r.bestTime) r.bestTime = time;
        save();
      },
      clear: function () { d = {}; save(); },
    };
  })();

     ink left. There is no global source in this codebase yet, so this answers

  /* ── the campaign: worlds of three levels ─────────────────────────────── */
  /* A printed line through control points [x, h]. Monotone cubic in x: it
     never overshoots a control point, peaks and valleys are flat at their
     points, and bends stay gentle enough for Inky to ride rather than bounce. */
  function path(ctrl) {
    const n = ctrl.length, xs = ctrl.map(function (q) { return q[0]; }), ys = ctrl.map(function (q) { return q[1]; });
    const d = [], m = new Array(n);
    for (let i = 0; i < n - 1; i++) d.push((ys[i + 1] - ys[i]) / (xs[i + 1] - xs[i]));
    m[0] = d[0]; m[n - 1] = d[n - 2];
    for (let i = 1; i < n - 1; i++) m[i] = d[i - 1] * d[i] <= 0 ? 0 : (d[i - 1] + d[i]) / 2;
    for (let i = 0; i < n - 1; i++) {
      if (d[i] === 0) { m[i] = 0; m[i + 1] = 0; continue; }
      const a = m[i] / d[i], b = m[i + 1] / d[i], q = a * a + b * b;
      if (q > 9) { const k = 3 / Math.sqrt(q); m[i] = k * a * d[i]; m[i + 1] = k * b * d[i]; }
    }
    const out = [];
    for (let i = 0; i < n - 1; i++) {
      const x0 = xs[i], w = xs[i + 1] - x0, steps = Math.max(2, Math.round(w / 10));
      for (let k = 0; k < steps; k++) {
        const t = k / steps, t2 = t * t, t3 = t2 * t;
        out.push([x0 + w * t, (2 * t3 - 3 * t2 + 1) * ys[i] + (t3 - 2 * t2 + t) * w * m[i]
                            + (-2 * t3 + 3 * t2) * ys[i + 1] + (t3 - t2) * w * m[i + 1]]);
      }
    }
    out.push([xs[n - 1], ys[n - 1]]);
    return { pts: out };
  }

      ],
      plinths: [
        { x0: 1000, x1: 1055, h: 25 }, { x0: 1055, x1: 1110, h: 50 }, { x0: 1110, x1: 1165, h: 75 },
        { x0: 1165, x1: 1220, h: 100 }, { x0: 1220, x1: 1275, h: 125 }, { x0: 1275, x1: 1500, h: 150 },
      ],
      hazards: [
        { x: 2720, w: 140, hTop: 1100, hBot: 50, kind: 'ceil' },
        { x: 2960, w: 140, hTop: 1100, hBot: 40, kind: 'ceil' },
        { x: 3900, w: 100, hTop: 80, hBot: -22, kind: 'block' },
      ],
      drops: [{ x: 2253, h: 74 }, { x: 4480, h: 120 }],
      notes: [
        { t: 'box', x0: 300, x1: 600, h0: -34, h1: -104, lines: ['INKY RESIDENCE', 'GENERAL ARRANGEMENT', 'SCALE 1:20   SHEET 3/3'] },
        { t: 'arrow', x: 1020, h: 190, dx: 230, label: 'UP' },
        { t: 'arc', x0: 2160, h0: 49, vx: 268, vy: 146, x1: 2440 },     // measured
        { t: 'dim', x0: 2160, x1: 2360, h: 130, label: '2000' },
        { t: 'vdim', x: 2780, h0: -20, h1: 50, label: 'CLR 700' },
        { t: 'vdim', x: 3020, h0: -20, h1: 40, label: 'CLR 600' },
        { t: 'dim', x0: 3900, x1: 4000, h: 106, label: '1000' },
        { t: 'text', x: 4620, h: 90, text: 'TRUSS (INCOMPLETE)' },
        { t: 'cl', x0: 1200, x1: 6700, h: 150 },
      ],
    },
  };

  const WORLDS = [
    { id: 'notebook',  name: 'NOTEBOOK',  levels: ['notebook-1', 'notebook-2', 'notebook-3'] },
    { id: 'blueprint', name: 'BLUEPRINT', levels: ['blueprint-1', 'blueprint-2', 'blueprint-3'], needs: 2 },
  ];
  LEVEL = LEVELS['notebook-1'];

  const ALL_OPEN = /[?&]all(\b|=)/.test(location.search);    // ?all opens every page, for testing
  function worldOf(id) { return WORLDS.find(function (w) { return w.levels.indexOf(id) >= 0; }); }
  /* A world opens once enough pages of the one before it are finished; within
     a world the pages open in order. Nothing to spend, nothing to count up. */
  function worldOpen(w) {
    const k = WORLDS.indexOf(w);
    if (k <= 0 || ALL_OPEN) return true;
    const prev = WORLDS[k - 1];
    return prev.levels.filter(Progress.done).length >= (w.needs || prev.levels.length);
  }
  function unlocked(id) {
    if (ALL_OPEN) return true;
    const w = worldOf(id), i = w.levels.indexOf(id);
    if (!worldOpen(w)) return false;
    return i === 0 || Progress.done(w.levels[i - 1]);
  }
  function nextLevel(id) {
    const w = worldOf(id), i = w.levels.indexOf(id);
    if (i < w.levels.length - 1) return unlocked(w.levels[i + 1]) ? w.levels[i + 1] : null;
    const nw = WORLDS[WORLDS.indexOf(w) + 1];
    return nw && unlocked(nw.levels[0]) ? nw.levels[0] : null;
  }

  function startLevel(id) {
    const L = LEVELS[id];
    if (!L) return;
    LEVEL = L;
    applyTheme(THEMES[L.world]);
    INK_MAX = L.ink; INK_DROP = L.drop;
    Stats.setLevel(L.id);
    scene = 'play';
    cv.style.cursor = '';
    ghost = []; strokes = [];
    reset(false);
  }

  // the line under each page's name: what you have done here, and later everyone
  function levelLine() {
    const r = Progress.get(LEVEL.id), bits = [];
    if (r.wins) {
      bits.push(r.bestInk != null ? 'done — best ' + Math.round(r.bestInk * 100) + '% ink left' : 'done');
    } else if (r.bestProg > 0.02) {
      bits.push('furthest ' + Math.round(r.bestProg * 100) + '%');
    }
    const g = Global.get(LEVEL.id);
    if (g) bits.push(g.completions + ' finished · ' + g.attempts + ' attempts');
    return bits.length ? bits.join('   ·   ') : (LEVEL.tagline || '');
  }

  /* ── the campaign page ──────────────────────────────────────────────────
     Worlds and their three pages, in the notebook's own hand: a circled
     number for each page, a red tick once it is done with the best ink under
     it, the furthest reach in pencil if not. The next world is a blueprint
     sheet taped into the notebook, visible before it opens. */
  const Campaign = (function () {
    let t = 0, hover = null, press = null, pressId = null, focus = -1, pending = null, dryT = 0;
    let marks = [], backBox = null;
    const jolt = {};
    const BP = THEMES.blueprint;
    const order = function () { const a = []; WORLDS.forEach(function (w) { a.push.apply(a, w.levels); }); return a; };

    function enter(fromTurn) {
      if (!fromTurn) turnPage();
      applyTheme(THEMES.notebook);
      scene = 'campaign';
      t = 0; hover = null; press = null; pressId = null; pending = null; dryT = 0;
      penId = null; drawing = null; pendTap = null;
      splats = []; motes = []; shake = 0; camX = 0; camY = 0;
      const nx = order().find(function (id) { return unlocked(id) && !Progress.done(id); });
      focus = order().indexOf(nx || order()[0]);
      cv.style.cursor = 'default';
    }

    function update(dt) {
      t += dt;
      for (const k in jolt) jolt[k] = Math.max(0, jolt[k] - dt * 2.8);
      let penOn = false, sp = 0, inkR = 1;
      if (dryT > 0) { dryT -= dt; penOn = true; sp = 520; inkR = 0; }
      Sound.frame(dt, penOn, sp, inkR, false, 0);
      if (pending && t >= pending.at) {
        const id = pending.id; pending = null;
        turnPage();
        startLevel(id);
      }
    }

    function circle(x, y, r, col, width, seed) {
      ctx.strokeStyle = col; ctx.lineWidth = width; ctx.lineCap = 'round';
      ctx.beginPath();
      const a0 = -1.9 + nn(seed) * 0.3, turns = 1.08;           // a hand circle overshoots its start
      for (let k = 0; k <= 36; k++) {
        const a = a0 + (k / 36) * Math.PI * 2 * turns;
        const rr = r * (1 + 0.05 * Math.sin(a * 3 + seed) + 0.02 * nn(k + seed + boil * 0.3));
        const px = x + Math.cos(a) * rr, py = y + Math.sin(a) * rr;
        k ? ctx.lineTo(px, py) : ctx.moveTo(px, py);
      }
      ctx.stroke();
    }
    function tick(x, y, col) {
      ctx.strokeStyle = col; ctx.lineWidth = 3.2; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
      ctx.beginPath(); ctx.moveTo(x - 8, y - 1); ctx.lineTo(x - 2, y + 7); ctx.lineTo(x + 12, y - 13); ctx.stroke();
    }
    function padlock(x, y, col, a) {
      ctx.globalAlpha = a; ctx.strokeStyle = col; ctx.lineWidth = 1.8; ctx.lineJoin = 'round';
      ctx.beginPath(); ctx.rect(x - 7, y - 3, 14, 11); ctx.stroke();
      ctx.beginPath(); ctx.arc(x, y - 3, 4.6, Math.PI, 0); ctx.stroke();
      ctx.globalAlpha = 1;
    }

    function render() {
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.drawImage(paper, 0, 0);
      screenT();
      const S = Math.min(40, VW * 0.055);
      const top = Math.max(22, (VH - 450) * 0.42);
      const cx = VW / 2;
      const bx0 = cx - 286;
      marks = [];

      ctx.fillStyle = INK; ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
      ctx.font = S + 'px ' + FD;
      ctx.fillText('CAMPAIGN', cx, top + S);
      ctx.textAlign = 'left';

      ctx.globalAlpha = 0.42; ctx.font = '19px ' + FH;
      ctx.fillText('‹ back', 20, 34);
      ctx.globalAlpha = 1;
      backBox = { x0: 4, y0: 10, x1: 100, y1: 48 };

      const rows = [top + S + 118, top + S + 298];
      const firstOpen = order().find(function (id) { return unlocked(id) && !Progress.done(id); });

      WORLDS.forEach(function (w, wi) {
        const y = rows[wi];
        const bp = w.id === 'blueprint';
        const open = worldOpen(w);
        if (bp) {                                                  // a sheet taped into the notebook
          ctx.save();
          ctx.translate(cx, y); ctx.rotate(-0.014);
          ctx.fillStyle = BP.paper;
          ctx.beginPath();
          const hw = 316, hh = 70;
          for (let k = 0; k <= 20; k++) { const xx = -hw + (2 * hw) * k / 20; k ? ctx.lineTo(xx, -hh + nn(k * 3.1) * 1.4) : ctx.moveTo(xx, -hh); }
          for (let k = 0; k <= 8; k++) ctx.lineTo(hw + nn(k * 5.3) * 1.2, -hh + (2 * hh) * k / 8);
          for (let k = 20; k >= 0; k--) ctx.lineTo(-hw + (2 * hw) * k / 20, hh + nn(k * 7.7) * 1.4);
          ctx.closePath(); ctx.fill();
          ctx.clip();
          ctx.strokeStyle = 'rgba(206,226,250,0.09)'; ctx.lineWidth = 1;
          for (let gx = -hw; gx <= hw; gx += 18) { ctx.beginPath(); ctx.moveTo(gx, -hh); ctx.lineTo(gx, hh); ctx.stroke(); }
          for (let gy = -hh; gy <= hh; gy += 18) { ctx.beginPath(); ctx.moveTo(-hw, gy); ctx.lineTo(hw, gy); ctx.stroke(); }
          ctx.restore();
          ctx.save();                                              // tape
          ctx.globalAlpha = 0.5; ctx.fillStyle = '#EFE3B8';
          for (const [tx, ty, ra] of [[cx - 300, y - 70, -0.5], [cx + 300, y - 74, 0.45]]) {
            ctx.save(); ctx.translate(tx, ty); ctx.rotate(ra); ctx.fillRect(-26, -9, 52, 18); ctx.restore();
          }
          ctx.restore();
        }
        const inkC = bp ? BP.ink : INK;
        ctx.fillStyle = inkC; ctx.globalAlpha = open ? 1 : 0.55;
        ctx.font = Math.round(S * 0.78) + 'px ' + FD;
        ctx.fillText(w.name, bx0, y + 10);
        ctx.globalAlpha = 1;

        w.levels.forEach(function (id, i) {
          const x = bx0 + 300 + i * 112;
          const r = Progress.get(id), isOpen = unlocked(id), idx = order().indexOf(id);
          const hot = hover === id || press === id || focus === idx;
          const dx = jolt[id] ? Math.sin(jolt[id] * 38) * 4 * jolt[id] : 0;
          if (i > 0) {                                             // a pencil path between pages
            ctx.strokeStyle = bp ? BP.soft : SOFT; ctx.globalAlpha = 0.45; ctx.lineWidth = 1.4;
            ctx.setLineDash([4, 6]);
            ctx.beginPath(); ctx.moveTo(x - 112 + 32, y); ctx.lineTo(x - 32, y); ctx.stroke();
            ctx.setLineDash([]); ctx.globalAlpha = 1;
          }
          ctx.globalAlpha = isOpen ? 1 : 0.32;
          circle(x + dx, y, hot && isOpen ? 28 : 26, inkC, hot && isOpen ? 3.4 : 2.4, i * 7 + wi * 13);
          ctx.fillStyle = inkC; ctx.textAlign = 'center';
          ctx.font = '26px ' + FD;
          ctx.fillText(String(i + 1), x + dx, y + 10);
          ctx.textAlign = 'left'; ctx.globalAlpha = 1;
          if (!isOpen) padlock(x + dx + 26, y - 22, inkC, 0.7);
          else if (r.wins) {
            tick(x + 26, y - 24, bp ? BP.red : RED);
            ctx.fillStyle = bp ? BP.note : SOFT; ctx.font = '18px ' + FH; ctx.textAlign = 'center';
            ctx.fillText(r.bestInk != null ? Math.round(r.bestInk * 100) + '% ink' : '', x, y + 50);
            ctx.textAlign = 'left';
          } else if (r.bestProg > 0.02) {
            ctx.fillStyle = bp ? BP.note : SOFT; ctx.font = '18px ' + FH; ctx.textAlign = 'center';
            ctx.fillText(Math.round(r.bestProg * 100) + '%', x, y + 50);
            ctx.textAlign = 'left';
          }
          if (id === firstOpen && !press && !pending) {             // Inky waits at the next page
            const bob = Math.abs(Math.sin(t * 2.2)) * 2;
            const was = INK; INK = inkC;
            drawBallAt(x, y - 42 - bob, 0, 1, 0, true);
            INK = was;
          }
          marks.push({ id: id, x: x, y: y, r: 34, open: isOpen });
        });

        if (bp && !open) {
          ctx.fillStyle = SOFT; ctx.globalAlpha = 0.8; ctx.font = '19px ' + FH; ctx.textAlign = 'center';
          ctx.fillText('finish two Notebook pages to open', cx, y + 100);
          ctx.textAlign = 'left'; ctx.globalAlpha = 1;
        }
      });

      drawSoundToggle(true);
      drawTurn();
    }

    function hit(p) {
      for (const m of marks) if (Math.hypot(p.x - m.x, p.y - m.y) <= m.r) return m;
      return null;
    }
    function activate(id) {
      if (pending) return;
      if (!unlocked(id)) { jolt[id] = 1; dryT = 0.16; return; }   // the nib is dry here, for now
      focus = order().indexOf(id);
      pending = { id: id, at: t + 0.14 };
    }
    function goBack() { turnPage(); Title.enter({ direct: true }); }

    function pointer(type, e) {
      const p = toScreen(e.clientX, e.clientY);
      if (type === 'down') {
        if (pending) return;
        if (inSoundBtn(p)) { Sound.toggle(); return; }
        if (backBox && p.x >= backBox.x0 && p.x <= backBox.x1 && p.y >= backBox.y0 && p.y <= backBox.y1) { goBack(); return; }
        const m = hit(p);
        if (m) { press = m.id; pressId = e.pointerId; try { cv.setPointerCapture(e.pointerId); } catch (err) {} }
        return;
      }
      if (type === 'move') {
        const m = hit(p);
        if (e.pointerType === 'mouse' && press === null) {
          hover = m ? m.id : null;
          cv.style.cursor = m || (backBox && p.x <= backBox.x1 && p.y <= backBox.y1) ? 'pointer' : 'default';
        }
        return;
      }
      if (press === null || e.pointerId !== pressId) return;
      const was = press; press = null; pressId = null;
      const m = hit(p);
      if (type === 'up' && m && m.id === was) activate(was);
    }

    function key(e) {
      const k = e.key, list = order();
      if (k === 'Escape') { e.preventDefault(); goBack(); return; }
      if (k === 'ArrowRight' || k === 'ArrowLeft') {
        e.preventDefault();
        focus = (Math.max(0, focus) + (k === 'ArrowRight' ? 1 : list.length - 1)) % list.length;
        return;
      }
      if (k === 'ArrowDown' || k === 'ArrowUp') {
        e.preventDefault();
        focus = (Math.max(0, focus) + (k === 'ArrowDown' ? 3 : list.length - 3)) % list.length;
        return;
      }
      if (k === 'Enter' || k === ' ') { e.preventDefault(); activate(list[Math.max(0, focus)]); }
    }

    return {
      enter: enter, update: update, render: render, pointer: pointer, key: key,
      leave: function () { hover = null; cv.style.cursor = 'default'; },
      marks: function () { return marks; },
    };
  })();

  /* ── the front page ─────────────────────────────────────────────────────
     Not a menu screen: the first page of the notebook. It shows the whole game
     before anyone touches it — a line draws itself, Inky runs it on the real
     physics, the slope speeds him up, and the page shows what a wall does to
     him. Then the choices are written in underneath.

     It runs on the level engine: the same grid, substeps, stroke renderer,
     splat and sound graph. None of it counts as an attempt — analytics begin
     when CAMPAIGN is chosen. First visit plays the whole beat; after that the
     choices are written in at once while the little run plays behind them, and
     any tap that is not on a choice skips straight to the finished page. */
  const Title = (function () {
    const SEEN_KEY = 'inkline.introSeen';
    let seen = false;
    try { seen = localStorage.getItem(SEEN_KEY) === '1'; } catch (e) {}

    // the beat, in seconds from opening the page
    const TL = {
      title: 0.1,  titleDur: 0.55,
      sub: 0.55,   subDur: 0.34, subGap: 0.17,
      line: 1.0,   lineDur: 0.95, wallDur: 0.18,
      runDelay: 0.05,
      pause: 0.5,                     // the silence after the splat
      menuDur: 0.32, menuGap: 0.15,
      menuSeen: 0.35,                 // returning players get the choices at once
    };
    const WALL_H = 62, RUNOUT = 46;
    const ITEMS = [
      { label: 'CAMPAIGN', primary: true },
      { label: 'ENDLESS', locked: true },
      { label: 'LEADERBOARD', locked: true },
    ];

    let entered = false, phase = 'idle', t = 0;
    let lay = null, lineStroke = null, wallStroke = null, wallRect = null;
    let lastVW = 0, lastVH = 0, cornerKicked = false;
    let inky = false, splatT = -1, menuT = null;   // null: the choices are not written yet
    let hover = -1, focus = -1, press = -1, pressId = null;
    const under = [0, 0, 0], jolt = [0, 0, 0];
    let dryT = 0, pending = null;

    const clamp01 = function (v) { return v < 0 ? 0 : v > 1 ? 1 : v; };
    const sm = function (a, b, x) { const k = clamp01((x - a) / (b - a)); return k * k * (3 - 2 * k); };
    // the pen: starts gently, runs through the middle, settles at the end
    const ease = function (x) { x = clamp01(x); return x - Math.sin(2 * Math.PI * x) / (2 * Math.PI); };
    const easeV = function (x) { x = clamp01(x); return 1 - Math.cos(2 * Math.PI * x); };
    const out3 = function (x) { x = clamp01(x); return 1 - Math.pow(1 - x, 3); };

    function markSeen() {
      if (seen) return;
      seen = true;
      try { localStorage.setItem(SEEN_KEY, '1'); } catch (e) {}
    }

    /* ── the page's geometry ───────────────────────────────────────────── */
    function yAt(x) {
      const w = Math.sin(x * 0.021 + 1.3) * 1.1 + Math.sin(x * 0.093 + 0.4) * 0.35;   // a hand, not a ruler
      if (x <= lay.L) return lay.yT + w;
      if (x >= lay.R0) return lay.yR + w * 0.6;
      const u = (x - lay.L) / (lay.R0 - lay.L);
      const bump = sm(0, 0.34, u) * (1 - sm(0.66, 1, u));     // a long, shallow U
      return lay.yT + lay.D * bump + lay.rim * sm(0.55, 1, u) + w;
    }

    function layout() {
      lastVW = VW; lastVH = VH;
      const S = Math.min(64, VW * 0.085);
      const D = Math.min(80, VH * 0.13);
      const blockH = S * 1.05 + 42 + 31 + 64 + D * 1.08 + 80 + 96 + 14;
      const top = Math.max(26, (VH - blockH) * 0.45);
      const titleY = top + S * 1.05;              // Rock Salt rides high above its baseline
      const sub1 = titleY + 42, sub2 = sub1 + 31;
      const yT = sub2 + 64;
      const x0 = VW * 0.05;
      const R = VW * 0.9;                         // the wall
      const R0 = R - RUNOUT;                      // where the U hands over to the run-out
      const uW = Math.min(R0 - x0 - 50, 640);
      lay = { S: S, D: D, cx: VW / 2, titleY: titleY, sub1: sub1, sub2: sub2,
              yT: yT, x0: x0, L: R0 - uW, R0: R0, R: R, rim: D * 0.3, yR: yT + D * 0.3 };
      lay.menuY = yT + D * 1.08 + 80;
      /* On a wide page the flat lead-in is long. The pen always outruns Inky,
         so he can set off a little before the wall is finished and still meet
         the U just as it completes: the beat keeps its length on any screen. */
      const lead = Math.max(0, lay.L - x0 - 60);
      lay.entry = 400 + Math.min(120, lead * 0.35);   // a longer run-up, a quicker entrance
      const wallDone = TL.line + TL.lineDur + TL.wallDur + TL.runDelay;
      lay.spawnAt = Math.max(TL.line + TL.lineDur * 0.6, wallDone - lead / lay.entry);

      // the path, measured along its length so the pen can travel it
      const dense = [];
      for (let x = x0; x < R; x += 2) dense.push({ x: x, y: yAt(x) });
      dense.push({ x: R, y: yAt(R) });
      const cum = [0];
      for (let i = 1; i < dense.length; i++)
        cum.push(cum[i - 1] + Math.hypot(dense[i].x - dense[i - 1].x, dense[i].y - dense[i - 1].y));
      const total = cum[cum.length - 1];
      lay.total = total;

      // the pen draws it: every point stamped with when the nib reached it
      const pts = [];
      let j = 0, last = null;
      for (let tau = 0; tau <= TL.lineDur + 1e-9; tau += 1 / 240) {
        const sArc = total * ease(tau / TL.lineDur);
        while (j < cum.length - 2 && cum[j + 1] < sArc) j++;
        const f = (sArc - cum[j]) / Math.max(1e-6, cum[j + 1] - cum[j]);
        const px = dense[j].x + (dense[j + 1].x - dense[j].x) * f;
        const py = dense[j].y + (dense[j + 1].y - dense[j].y) * f;
        if (!last || Math.hypot(px - last.x, py - last.y) >= 4.5) {
          const v = total * easeV(tau / TL.lineDur) / TL.lineDur;      // faster runs thinner
          const w = (5.4 - Math.min(2.3, v * 0.0021)) * (0.84 + 0.3 * n1(pts.length * 3.3 + 11));
          last = { x: px, y: py, t: tau, w: w, dry: 0 };
          pts.push(last);
        }
      }
      const end = dense[dense.length - 1];
      if (Math.hypot(end.x - last.x, end.y - last.y) > 0.5)
        pts.push({ x: end.x, y: end.y, t: TL.lineDur, w: 5.2, dry: 0 });
      lineStroke = { pts: pts, minX: x0 - 6, maxX: R + 6, blots: [], seed: 3.1 };

      // then turns and stands the wall up
      const foot = pts[pts.length - 1];
      const wp = [{ x: foot.x, y: foot.y, t: TL.lineDur, w: 5.0, dry: 0 }];
      for (let tau = 1 / 240; tau <= TL.wallDur + 1e-9; tau += 1 / 240) {
        const e = ease(tau / TL.wallDur);
        const y = foot.y - WALL_H * e;
        if (Math.abs(y - wp[wp.length - 1].y) >= 3 || tau + 1 / 240 > TL.wallDur)
          wp.push({ x: R + Math.sin(e * 3.1) * 0.8, y: y, t: TL.lineDur + tau, w: 4.6 + 0.8 * n1(wp.length * 1.7), dry: 0 });
      }
      wallStroke = { pts: wp, minX: R - 6, maxX: R + 6, blots: [], seed: 5.3 };
      lay.yR = foot.y;
      lay.top = wp[wp.length - 1];
      wallRect = { x0: R - 2, x1: R + 3, y0: lay.top.y, y1: foot.y + 5 };

      // it is real ground: the same grid a level uses
      grid.clear();
      for (const P of [pts, wp])
        for (let i = 0; i < P.length - 1; i++)
          addSeg({ x0: P[i].x, y0: P[i].y, x1: P[i + 1].x, y1: P[i + 1].y });
    }

    function relayout() {
      if (lay && Math.abs(VW - lastVW) < 2 && Math.abs(VH - lastVH) < 2) return;
      layout();
      if (entered && scene === 'title') {         // a rotated page is simply the finished page
        splats = []; motes = []; splatT = -1; inky = false;
        toEnd();
      }
    }

    /* ── entering, skipping ─────────────────────────────────────────────── */
    function enter(opts) {
      applyTheme(THEMES.notebook);
      scene = 'title'; entered = true;
      penId = null; drawing = null; pendTap = null;
      splats = []; motes = []; shake = 0; flash = 0;
      camX = 0; camY = 0;
      runT = 10;                                   // past a level's opening beat
      ball.vx = 0; ball.vy = 0; ball.hit = 0; ball.landed = 0;
      t = 0; inky = false; splatT = -1; pending = null; cornerKicked = false;
      hover = -1; focus = -1; press = -1; pressId = null; dryT = 0;
      for (let i = 0; i < ITEMS.length; i++) { under[i] = 0; jolt[i] = 0; }
      layout();
      menuT = seen ? TL.menuSeen : null;
      phase = 'intro';
      cv.style.cursor = 'default';
      if ((opts && opts.direct) || REDUCED) toEnd();
    }

    /* The finished page: line and wall drawn, Inky's splat already dry on the
       wall, the choices written. Skipping still tells the story, just still. */
    function toEnd() {
      const done = TL.line + TL.lineDur + TL.wallDur + 0.01;
      if (t < done) t = done;
      if (splatT < 0) {
        inky = false;
        ball.vx = 420; ball.vy = 0; ball.y = lay.yR - ball.r;
        splatWall(true);
        for (let k = 0; k < 40; k++) for (const m of motes) {
          if (m.set) continue;
          m.life += 1 / 60; m.vy += GRAV * 1.1 / 60;
          m.x += m.vx / 60; m.y += m.vy / 60; m.vx *= (1 - 2.2 / 60);
          if (m.life > 0.34) m.set = true;
        }
        for (const sp of splats) sp.t = 1;
      }
      menuT = Math.min(menuT === null ? Infinity : menuT, t - 3);
      phase = 'menu';
      shake = 0;
      markSeen();
    }

    /* ── Inky ──────────────────────────────────────────────────────────── */
    function spawn() {
      inky = true;
      ball.x = -26; ball.y = lay.yT - 16; ball.vx = lay.entry; ball.vy = 0;   // in from the margin, already running
      ball.ang = 0; ball.grounded = false; ball.nx = 0; ball.ny = -1;
      ball.air = 0.2; ball.step = 0; ball.hit = 0; ball.landed = 0;
    }

    function hitsWall() {
      const r = wallRect;
      const cx = Math.max(r.x0, Math.min(ball.x, r.x1));
      const cy = Math.max(r.y0, Math.min(ball.y, r.y1));
      const dx = ball.x - cx, dy = ball.y - cy;
      return dx * dx + dy * dy < ball.r * ball.r * 0.86;
    }

    function splatWall(quiet) {
      inky = false;
      splatT = t;
      const y = Math.min(ball.y, lay.yR - ball.r);
      const x = lay.R - 15;
      const n0 = motes.length;
      burstSplat(x, y);
      splats[splats.length - 1].r = 16;               // flattened against the face, not through it
      for (let i = n0; i < motes.length; i++) {       // the wall throws the flecks back, not far
        const m = motes[i];
        if (m.vx > 0) m.vx = -m.vx * 0.5 - 20;
        m.vx *= 0.6;
        m.vy = m.vy * 0.45 - 20;
        m.r *= 0.8;
      }
      splats.push({ x: lay.R - 7, y: y - 20, r: 6, t: 0, seed: Math.random() * 99 });
      if (!quiet) {
        shake = REDUCED ? 0 : 0.55;
        Sound.splat(Math.min(1, Math.hypot(ball.vx, ball.vy) / 700));
        try {
          if (navigator.vibrate && navigator.userActivation && navigator.userActivation.hasBeenActive) navigator.vibrate(16);
        } catch (e) {}
      }
      markSeen();
      if (menuT === null) menuT = t + (quiet ? 0 : TL.pause);
    }

    /* ── per frame ─────────────────────────────────────────────────────── */
    function penSpeedAt(lt) {
      if (lt < TL.lineDur) return lay.total * easeV(lt / TL.lineDur) / TL.lineDur;
      return WALL_H * easeV((lt - TL.lineDur) / TL.wallDur) / TL.wallDur;
    }

    function update(dt) {
      t += dt;
      let penOn = false, pSpeed = 0, pInk = 1;

      if (t > TL.title && t < TL.sub + TL.subGap + TL.subDur) { penOn = true; pSpeed = 240; }
      const lt = t - TL.line;
      if (lt > 0 && lt < TL.lineDur + TL.wallDur) {
        penOn = true; pSpeed = Math.max(pSpeed, penSpeedAt(lt));
        if (!cornerKicked && lt >= TL.lineDur) { cornerKicked = true; Sound.turn(0.45); }
      }
      if (menuT !== null) for (let i = 0; i < ITEMS.length; i++) {
        const k = (t - menuT - i * TL.menuGap) / TL.menuDur;
        if (k > 0 && k < 1) { penOn = true; pSpeed = Math.max(pSpeed, 360); }
      }
      for (let i = 0; i < ITEMS.length; i++) {
        const target = (hover === i || focus === i || press === i) ? 1 : 0;
        const before = under[i];
        under[i] += (target - under[i]) * Math.min(1, dt * (target ? 10 : 7));
        if (target && under[i] - before > 0.012) {
          penOn = true;
          pSpeed = Math.max(pSpeed, ITEMS[i].locked ? 200 : 260);
          if (ITEMS[i].locked) pInk = Math.min(pInk, 0.06);          // no ink here yet
        }
        if (jolt[i] > 0) jolt[i] = Math.max(0, jolt[i] - dt * 2.8);
      }
      if (dryT > 0) { dryT -= dt; penOn = true; pSpeed = Math.max(pSpeed, 520); pInk = 0; }

      if (!inky && splatT < 0 && t >= lay.spawnAt) spawn();
      if (inky) {
        stepPhysics(dt);
        if (hitsWall()) splatWall(false);
        else if (ball.y > VH + 80 || ball.x > VW + 80) inky = false;
      }
      Sound.frame(dt, penOn, pSpeed, pInk, inky && ball.grounded, inky ? Math.hypot(ball.vx, ball.vy) : 0);
      if (ball.landed) { if (inky) Sound.land(ball.landed); ball.landed = 0; }

      if (pending && t >= pending.at) startCampaign();
      if (phase === 'intro' && splatT >= 0 && menuT !== null && t > menuT + TL.menuGap * 2 + TL.menuDur) phase = 'menu';
    }

    /* ── drawing ───────────────────────────────────────────────────────── */
    // text written in by a nib travelling left to right
    function inkText(txt, cx, base, font, size, color, alpha, k, dx) {
      k = clamp01(k);
      if (k <= 0) return null;
      ctx.font = font;
      const w = ctx.measureText(txt).width;
      const x0 = cx - w / 2 + (dx || 0);
      ctx.save();
      if (k < 1) { ctx.beginPath(); ctx.rect(x0 - 12, base - size * 1.4, (w + 24) * k, size * 2.2); ctx.clip(); }
      ctx.fillStyle = color; ctx.globalAlpha = alpha;
      ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
      ctx.fillText(txt, x0, base);
      ctx.restore();
      if (k < 1) {
        ctx.fillStyle = color; ctx.globalAlpha = alpha;
        ctx.beginPath();
        ctx.arc(x0 - 12 + (w + 24) * k, base - size * 0.32 + Math.sin(k * 23) * size * 0.12,
                Math.max(1.8, size * 0.045), 0, 6.2832);
        ctx.fill();
        ctx.globalAlpha = 1;
      }
      return { x0: x0, x1: x0 + w };
    }

    function tipAt(lt) {
      const P = lt < TL.lineDur ? lineStroke.pts : wallStroke.pts;
      let p = P[0];
      for (let i = 0; i < P.length; i++) { if (P[i].t <= lt) p = P[i]; else break; }
      return p;
    }

    function underline(i) {
      const b = ITEMS[i].box, e = out3(under[i]);
      const locked = !!ITEMS[i].locked;
      const x0 = b.tx0 - 6, x1 = x0 + (b.tx1 - b.tx0 + 12) * e;
      const y = b.base + 9;
      ctx.strokeStyle = locked ? SOFT : INK;
      ctx.globalAlpha = locked ? 0.6 : 1;
      ctx.lineCap = 'round';
      ctx.lineWidth = press === i ? 3.8 : 2.7;
      let px = x0, py = y + nn(x0 * 0.3 + i * 7) * 1.1, seg = 0;
      for (let x = x0 + 6; x <= x1 + 0.01; x += 6) {
        const yy = y + nn(x * 0.3 + i * 7) * 1.1 + (x - x0) * 0.012;   // a hand underline drifts
        if (!locked || seg % 3 !== 1) { ctx.beginPath(); ctx.moveTo(px, py); ctx.lineTo(x, yy); ctx.stroke(); }
        seg++; px = x; py = yy;
      }
      ctx.globalAlpha = 1;
      if (press === i && !locked) { ctx.fillStyle = INK; ctx.beginPath(); ctx.arc(x0, y + 0.5, 2.6, 0, 6.2832); ctx.fill(); }
    }

    function menu() {
      if (menuT === null) return;
      const big = Math.round(Math.min(34, lay.S * 0.52));
      const small = Math.round(Math.min(34, lay.S * 0.5));
      const ys = [lay.menuY, lay.menuY + 52, lay.menuY + 96];
      for (let i = 0; i < ITEMS.length; i++) {
        const it = ITEMS[i];
        const k = (t - menuT - i * TL.menuGap) / TL.menuDur;
        if (k <= 0) { it.box = null; continue; }
        const dx = jolt[i] > 0 ? Math.sin(jolt[i] * 38) * 5 * jolt[i] : 0;
        const size = it.primary ? big : small;
        const font = it.primary ? size + 'px ' + FD : '700 ' + size + 'px ' + FH;
        const m = inkText(it.label, lay.cx, ys[i], font, size, INK, it.locked ? 0.42 : 1, k, dx);
        const cy = ys[i] - size * 0.35, hh = Math.max(46 / scale, size * 1.3) / 2;   // at least a fingertip tall
        it.box = { x0: m.x0 - 18, x1: m.x1 + 18, y0: cy - hh, y1: cy + hh,
                   tx0: m.x0, tx1: m.x1, base: ys[i], k: clamp01(k) };
        if (it.locked && k >= 1) {                     // a pencil note in the margin
          ctx.save();
          ctx.translate(m.x1 + 12, ys[i] - size * 0.5); ctx.rotate(-0.08);
          ctx.fillStyle = SOFT; ctx.globalAlpha = 0.72 + 0.28 * jolt[i];
          ctx.font = Math.round(small * 0.72) + 'px ' + FH;
          ctx.fillText('soon', 0, 0);
          ctx.restore(); ctx.globalAlpha = 1;
        }
        if (under[i] > 0.02 && k >= 1) underline(i);
      }
    }

    function render() {
      viewL = -40; viewR = VW + 40;
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.drawImage(paper, 0, 0);
      worldT();

      const S = lay.S, ss = Math.round(S * 0.46);
      inkText('THE INKL\u200aINE', lay.cx, lay.titleY, S + 'px ' + FD, S, INK, 1, (t - TL.title) / TL.titleDur);
      inkText('Draw the path.', lay.cx, lay.sub1, ss + 'px ' + FH, ss, RED, 1, (t - TL.sub) / TL.subDur);
      inkText('Get Inky home.', lay.cx, lay.sub2, ss + 'px ' + FH, ss, RED, 1, (t - TL.sub - TL.subGap) / TL.subDur);

      const lt = t - TL.line;
      if (lt > 0) {
        drawStroke(lineStroke, lt, 1);
        drawStroke(wallStroke, lt, 1);
        ctx.fillStyle = INK;
        const s0 = lineStroke.pts[0];
        ctx.beginPath(); ctx.arc(s0.x - 1, s0.y + 0.5, 3.1, 0, 6.2832); ctx.fill();    // where the nib touched down
        if (lt >= TL.lineDur + TL.wallDur) {
          ctx.beginPath(); ctx.arc(lay.top.x, lay.top.y, 3.3, 0, 6.2832); ctx.fill();   // pressed at the top
        } else {
          const p = tipAt(lt);
          ctx.beginPath(); ctx.arc(p.x, p.y, 2.7, 0, 6.2832); ctx.fill();               // the wet nib
        }
      }
      drawMotes();
      drawSplats();
      if (inky) drawBallAt(ball.x, ball.y, ball.ang, ball.vx, ball.vy, ball.grounded);
      menu();

      screenT();
      drawSoundToggle(true);
      drawTurn();
    }

    /* ── choosing ──────────────────────────────────────────────────────── */
    function hit(p) {
      for (let i = 0; i < ITEMS.length; i++) {
        const b = ITEMS[i].box;
        if (!b || b.k < 0.6) continue;
        if (p.x >= b.x0 && p.x <= b.x1 && p.y >= b.y0 && p.y <= b.y1) return i;
      }
      return -1;
    }

    function activate(i) {
      if (pending) return;
      focus = i;
      if (ITEMS[i].locked) { jolt[i] = 1; dryT = 0.16; return; }     // the nib is dry here, for now
      under[i] = Math.max(under[i], 0.6);
      pending = { at: t + 0.16 };                                      // let the underline land first
    }

    function startCampaign() {
      pending = null;
      turnPage();
      Campaign.enter(true);
    }

    function pointer(type, e) {
      const p = toScreen(e.clientX, e.clientY);
      if (type === 'down') {
        if (pending) return;
        if (inSoundBtn(p)) { Sound.toggle(); return; }
        const i = hit(p);
        if (i >= 0) {
          press = i; pressId = e.pointerId; hover = i;
          try { cv.setPointerCapture(e.pointerId); } catch (err) {}
          return;
        }
        if (phase === 'intro') toEnd();              // any other tap: straight to the finished page
        return;
      }
      if (type === 'move') {
        const i = hit(p);
        if (press >= 0) { if (e.pointerId === pressId) hover = i === press ? press : -1; return; }
        if (e.pointerType === 'mouse') {
          hover = i;
          cv.style.cursor = i >= 0 ? 'pointer' : 'default';
        }
        return;
      }
      if (press < 0 || e.pointerId !== pressId) return;
      const was = press;
      press = -1; pressId = null;
      if (type === 'up' && hit(p) === was) activate(was);
      if (e.pointerType !== 'mouse') hover = -1;
    }

    function key(e) {
      const k = e.key;
      const shown = menuT !== null && t - menuT > TL.menuGap * 2 + TL.menuDur * 0.6;
      if (k === 'ArrowDown' || k === 'ArrowUp') {
        e.preventDefault();
        if (!shown) toEnd();
        const n = ITEMS.length;
        focus = focus < 0 ? 0 : (focus + (k === 'ArrowUp' ? n - 1 : 1)) % n;
        return;
      }
      if (k === 'Enter' || k === ' ') {
        e.preventDefault();
        if (!shown) { toEnd(); return; }
        activate(focus < 0 ? 0 : focus);
        return;
      }
      if (phase === 'intro' && k !== 'Shift' && k !== 'Control' && k !== 'Alt' && k !== 'Meta') toEnd();
    }

    return {
      enter: enter, relayout: relayout, update: update, render: render,
      pointer: pointer, key: key, skip: toEnd,
      leave: function () { if (press < 0) hover = -1; cv.style.cursor = 'default'; },
      forget: function () { seen = false; try { localStorage.removeItem(SEEN_KEY); } catch (e) {} },
      get phase() { return phase; }, get t() { return t; }, get splatT() { return splatT; },
      get seen() { return seen; }, get inky() { return inky; },
      boxes: function () { return ITEMS.map(function (it) { return it.box; }); },
    };
  })();

  /* ── loop ───────────────────────────────────────────────────────────── */
  let last = performance.now();
  function frame(now) {
    requestAnimationFrame(frame);           // scheduled first: one bad frame
    let dt = (now - last) / 1000;           // must never stop the game
    last = now;
    if (dt > 0.1) dt = 0.1;
    update(dt);
    render();
  }

  function start() {
    Sound.prime();
    Stats.start(window.matchMedia && window.matchMedia('(pointer: coarse)').matches ? 'touch' : 'mouse');
    resize();
    Title.enter();
    requestAnimationFrame(frame);
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(function () {});
  }

  /* A small, stable surface for automation: scripted test runs now, and the
     hook a daily-challenge verifier or a ghost-replay importer would use
     later. It reads and drives the same code the player's finger does. */
  window.INKLINE = {
    version: '0.4-test',
    levelId: LEVEL.id,
    state: function () {
      return { state: state, t: runT, ink: ink / INK_MAX, inkSpent: inkSpent,
               x: ball.x, y: ball.y, vx: ball.vx, vy: ball.vy,
               ground: G, grounded: ball.grounded, attempt: attempt,
               progress: Math.min(1, ball.x / LEVEL.finish), reason: deadReason };
    },
    paint: function (pts) {                    // pts: [{x,y}, ...] in world units
      if (!pts || pts.length < 2 || ink <= 0) return;
      beginStroke(pts[0]);
      for (let i = 1; i < pts.length; i++) extendStroke(pts[i]);
      endStroke();
    },
    place: function (x, y, vx, vy) {
      ball.x = x; ball.y = y; ball.vx = vx || 0; ball.vy = vy || 0;
      camX = Math.max(0, x - VW * 0.32);
    },
    restart: function () { restart(); },
    record: function () { return serializeRun(); },
    scene: function () { return scene; },
    level: function (id) { startLevel(id); },
    levels: function () { return Object.keys(LEVELS); },
    levelInfo: function () { return { id: LEVEL.id, ink: INK_MAX, finish: LEVEL.finish, ground: G }; },
    progress: Progress,
    campaign: Campaign,
    unlocked: function (id) { return unlocked(id); },
    title: Title,
    analytics: Stats,
    sound: Sound,
  };

  window.addEventListener('resize', resize);
  window.addEventListener('orientationchange', function () { setTimeout(resize, 120); });
  document.addEventListener('visibilitychange', function () {
    last = performance.now();
    if (document.visibilityState === 'hidden') Stats.end();
  });
  window.addEventListener('pagehide', function () { Stats.end(); });

  try {
    if (window.claude && window.claude.hot && window.claude.hot.ready) window.claude.hot.ready(start);
    else start();
    if (window.claude && window.claude.hot && window.claude.hot.snapshot)
      window.claude.hot.snapshot(function () { return {}; });
  } catch (e) { start(); }
})();
</script>

</body>
</html>
