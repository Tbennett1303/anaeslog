  const WORLDS = [
    { id: 'notebook',  name: 'NOTEBOOK',  levels: ['notebook-1', 'notebook-2', 'notebook-3'] },
    { id: 'blueprint', name: 'BLUEPRINT', levels: ['blueprint-1', 'blueprint-2', 'blueprint-3'], needs: 2 },
  ];
  LEVEL = LEVELS['notebook-1'];

  const ALL_OPEN = /[?&]all(\b|=)/.test(location.search);    // ?all opens every page, for testing
  function worldOf(id) { return WORLDS.find(function (w) { return w.levels.indexOf(id) >= 0; }); }
  /* A world opens once enough pages of the one before it are finished; within
     a world the pages open in order. Nothing to spend, nothing to count up. */
  function worldOpen(w) {
    const k = WORLDS.indexOf(w);
    if (k <= 0 || ALL_OPEN) return true;
    const prev = WORLDS[k - 1];
    return prev.levels.filter(Progress.done).length >= (w.needs || prev.levels.length);
  }
  function unlocked(id) {
    if (ALL_OPEN) return true;
    const w = worldOf(id), i = w.levels.indexOf(id);
    if (!worldOpen(w)) return false;
    return i === 0 || Progress.done(w.levels[i - 1]);
  }
  function nextLevel(id) {
    const w = worldOf(id), i = w.levels.indexOf(id);
    if (i < w.levels.length - 1) return unlocked(w.levels[i + 1]) ? w.levels[i + 1] : null;
    const nw = WORLDS[WORLDS.indexOf(w) + 1];
    return nw && unlocked(nw.levels[0]) ? nw.levels[0] : null;
  }

  function startLevel(id) {
    const L = LEVELS[id];
    if (!L) return;
    LEVEL = L;
    MODE = 'campaign'; COURSE = null;
    applyTheme(THEMES[L.world]);
    INK_MAX = L.ink; INK_DROP = L.drop;
    Stats.setLevel(L.id);
    scene = 'play';
    cv.style.cursor = '';
    ghost = []; strokes = [];
    reset(false);
  }

  function randomSeed() {
    try { const a = new Uint32Array(1); crypto.getRandomValues(a); return a[0] >>> 0; }
    catch (e) { return (Math.random() * 4294967296) >>> 0; }
  }

  /* A procedural run: the same engine, with its LEVEL a live view onto a
     course that the generator keeps extending ahead of the camera. */
  function startCourse(mode, seed, day) {
    MODE = mode;
    if (!COURSE || COURSE.seed !== (seed >>> 0) || COURSE.mode !== mode) {
      if (mode !== 'daily') ghost = [];
      COURSE = Gen.create({ mode: mode, seed: seed });
    }
    COURSE.day = day || null;
    COURSE.ensure(3200);
    const names = { endless: 'Endless', daily: 'Daily', zen: 'Zen' };
    LEVEL = { id: mode, world: mode === 'daily' ? 'blueprint' : 'notebook', course: true,
              name: mode === 'daily' ? 'Daily · ' + dayLabel(day, true) : names[mode],
              ink: COURSE.cfg.ink, drop: COURSE.cfg.drop, finish: Infinity, hintX: 620,
              printed: COURSE.printed, plinths: [], hazards: COURSE.hazards, drops: COURSE.drops, notes: notesLive };
    applyTheme(THEMES[LEVEL.world]);
    INK_MAX = COURSE.cfg.ink; INK_DROP = COURSE.cfg.drop;
    Stats.setMode(mode === 'endless' ? 'e' : mode === 'daily' ? 'd' : 'z');
    Stats.setLevel(mode === 'daily' ? 'daily:' + day : mode);
    scene = 'play';
    cv.style.cursor = '';
    strokes = [];
    reset(false);
    LEVEL.notes = notesLive;
  }
  function startDaily() {
    const day = Daily.today();
    startCourse('daily', Gen.dailySeed(day), day);
  }
  function dayLabel(day, short) {
    if (!day) return '';
    const dt = new Date(day + 'T12:00:00Z');
    const M = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
    const D = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
    return short ? dt.getUTCDate() + ' ' + M[dt.getUTCMonth()].slice(0, 3)
                 : D[dt.getUTCDay()] + ' ' + dt.getUTCDate() + ' ' + M[dt.getUTCMonth()];
  }

  /* What a daily run sends: the day, the numbers, and enough of the run for
     the server to check it against the course it rebuilds from the day —
     where Inky was five times a second, and the lines drawn, simplified. */
  function simplify(pts, tol) {
    if (pts.length < 3) return pts.slice();
    const keep = new Uint8Array(pts.length); keep[0] = keep[pts.length - 1] = 1;
    const stack = [[0, pts.length - 1]];
    while (stack.length) {
      const [a, b] = stack.pop();
      const ax = pts[a][0], ay = pts[a][1], dx = pts[b][0] - ax, dy = pts[b][1] - ay, L = Math.hypot(dx, dy) || 1;
      let far = -1, fd = tol;
      for (let i = a + 1; i < b; i++) {
        const d = Math.abs((pts[i][0] - ax) * dy - (pts[i][1] - ay) * dx) / L;
        if (d > fd) { fd = d; far = i; }
      }
      if (far > 0) { keep[far] = 1; stack.push([a, far], [far, b]); }
    }
    return pts.filter(function (q, i) { return keep[i]; });
  }
  function dailyRun(dist) {
    const tr = [];
    let lt = -1;
    const P = rec.path;
    for (let i = 0; i < P.length; i++) {
      const q = P[i];
      if (q.t - lt >= 0.2 || i === P.length - 1) {
        tr.push(Math.round(q.t * 100), Math.round(q.x * 10), Math.round((G - q.y) * 10), q.g ? 1 : 0);
        lt = q.t;
      }
    }
    tr.push(Math.round(runT * 100), Math.round(ball.x * 10), Math.round((G - ball.y) * 10), ball.grounded ? 1 : 0);
    const st = strokes.map(function (sk) {
      const pts = simplify(sk.pts.map(function (q) { return [q.x, G - q.y]; }), 1.2);
      const flat = [Math.round(sk.pts[0].t * 100)];
      for (const q of pts) flat.push(Math.round(q[0] * 10), Math.round(q[1] * 10));
      return flat;
    });
    return { v: Gen.VERSION, dist: Math.round(dist * 10) / 10, time: Math.round(runT * 100) / 100,
             spent: Math.round(inkSpent), blots: takenDrops.size, trace: tr, strokes: st };
  }

  // the line under each page's name: what you have done here, and later everyone
  function levelLine() {
    const r = Progress.get(LEVEL.id), bits = [];
    if (r.wins) {
      bits.push(r.bestInk != null ? 'done — best ' + Math.round(r.bestInk * 100) + '% ink left' : 'done');
    } else if (r.bestProg > 0.02) {
      bits.push('furthest ' + Math.round(r.bestProg * 100) + '%');
    }
    const g = Global.get(LEVEL.id);
    if (g) bits.push(g.completions + ' finished · ' + g.attempts + ' attempts');
    return bits.length ? bits.join('   ·   ') : (LEVEL.tagline || '');
  }

  /* ── the campaign page ──────────────────────────────────────────────────
     Worlds and their three pages, in the notebook's own hand: a circled
     number for each page, a red tick once it is done with the best ink under
     it, the furthest reach in pencil if not. The next world is a blueprint
     sheet taped into the notebook, visible before it opens. */
  const Campaign = (function () {
    let t = 0, hover = null, press = null, pressId = null, focus = -1, pending = null, dryT = 0;
    let marks = [], backBox = null, freshId = null;
    const jolt = {};
    const BP = THEMES.blueprint;
    const order = function () { const a = []; WORLDS.forEach(function (w) { a.push.apply(a, w.levels); }); return a; };

    function enter(fromTurn) {
      if (!fromTurn) turnPage();
      applyTheme(THEMES.notebook);
      scene = 'campaign';
      t = 0; hover = null; press = null; pressId = null; pending = null; dryT = 0;
      penId = null; drawing = null; pendTap = null;
      splats = []; motes = []; shake = 0; camX = 0; camY = 0;
      const nx = order().find(function (id) { return unlocked(id) && !Progress.done(id); });
      focus = order().indexOf(nx || order()[0]);
      MODE = 'campaign'; COURSE = null;
      Stats.setMode('c');
      Stats.flush();
      cv.style.cursor = 'default';
    }

    function update(dt) {
      t += dt;
      if (freshId && t > 0.3 && !update.ticked) { update.ticked = true; Sound.click(); }
      if (freshId && t > 1.2) { freshId = null; update.ticked = false; }
      for (const k in jolt) jolt[k] = Math.max(0, jolt[k] - dt * 2.8);
      let penOn = false, sp = 0, inkR = 1;
      if (dryT > 0) { dryT -= dt; penOn = true; sp = 520; inkR = 0; }
      Sound.frame(dt, penOn, sp, inkR, false, 0);
      if (pending && t >= pending.at) {
        const id = pending.id; pending = null;
        turnPage();
        startLevel(id);
      }
    }

    function circle(x, y, r, col, width, seed) {
      ctx.strokeStyle = col; ctx.lineWidth = width; ctx.lineCap = 'round';
      ctx.beginPath();
      const a0 = -1.9 + nn(seed) * 0.3, turns = 1.08;           // a hand circle overshoots its start
      for (let k = 0; k <= 36; k++) {
        const a = a0 + (k / 36) * Math.PI * 2 * turns;
        const rr = r * (1 + 0.05 * Math.sin(a * 3 + seed) + 0.02 * nn(k + seed + boil * 0.3));
        const px = x + Math.cos(a) * rr, py = y + Math.sin(a) * rr;
        k ? ctx.lineTo(px, py) : ctx.moveTo(px, py);
      }
      ctx.stroke();
    }
    function tick(x, y, col, k) {
      k = k == null ? 1 : Math.max(0, Math.min(1, k));
      if (k <= 0) return;
      ctx.strokeStyle = col; ctx.lineWidth = 3.2; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
      const L1 = 10, L2 = 24.4, at = k * (L1 + L2);           // written, a stroke at a time
      ctx.beginPath(); ctx.moveTo(x - 8, y - 1);
      if (at <= L1) ctx.lineTo(x - 8 + 6 * at / L1, y - 1 + 8 * at / L1);
      else { ctx.lineTo(x - 2, y + 7); const q = (at - L1) / L2; ctx.lineTo(x - 2 + 14 * q, y + 7 - 20 * q); }
      ctx.stroke();
    }
    function padlock(x, y, col, a) {
      ctx.globalAlpha = a; ctx.strokeStyle = col; ctx.lineWidth = 1.8; ctx.lineJoin = 'round';
      ctx.beginPath(); ctx.rect(x - 7, y - 3, 14, 11); ctx.stroke();
      ctx.beginPath(); ctx.arc(x, y - 3, 4.6, Math.PI, 0); ctx.stroke();
      ctx.globalAlpha = 1;
    }

    function render() {
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.drawImage(paper, 0, 0);
      screenT();
      const S = Math.min(40, VW * 0.055);
      const top = Math.max(22, (VH - 450) * 0.42);
      const cx = VW / 2;
      const bx0 = cx - 286;
      marks = [];

      ctx.fillStyle = INK; ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
      ctx.font = S + 'px ' + FD;
      ctx.fillText('CAMPAIGN', cx, top + S);
      ctx.textAlign = 'left';

      ctx.globalAlpha = 0.42; ctx.font = '19px ' + FH;
      ctx.fillText('‹ back', 20, 34);
      ctx.globalAlpha = 1;
      backBox = { x0: 4, y0: 10, x1: 100, y1: 48 };

      const rows = [top + S + 118, top + S + 298];
      const firstOpen = order().find(function (id) { return unlocked(id) && !Progress.done(id); });

      WORLDS.forEach(function (w, wi) {
        const y = rows[wi];
        const bp = w.id === 'blueprint';
        const open = worldOpen(w);
        if (bp) {                                                  // a sheet taped into the notebook
          ctx.save();
          ctx.translate(cx, y); ctx.rotate(-0.014);
          ctx.fillStyle = BP.paper;
          ctx.beginPath();
          const hw = 316, hh = 70;
          for (let k = 0; k <= 20; k++) { const xx = -hw + (2 * hw) * k / 20; k ? ctx.lineTo(xx, -hh + nn(k * 3.1) * 1.4) : ctx.moveTo(xx, -hh); }
          for (let k = 0; k <= 8; k++) ctx.lineTo(hw + nn(k * 5.3) * 1.2, -hh + (2 * hh) * k / 8);
          for (let k = 20; k >= 0; k--) ctx.lineTo(-hw + (2 * hw) * k / 20, hh + nn(k * 7.7) * 1.4);
          ctx.closePath(); ctx.fill();
          ctx.clip();
          ctx.strokeStyle = 'rgba(206,226,250,0.09)'; ctx.lineWidth = 1;
          for (let gx = -hw; gx <= hw; gx += 18) { ctx.beginPath(); ctx.moveTo(gx, -hh); ctx.lineTo(gx, hh); ctx.stroke(); }
          for (let gy = -hh; gy <= hh; gy += 18) { ctx.beginPath(); ctx.moveTo(-hw, gy); ctx.lineTo(hw, gy); ctx.stroke(); }
          ctx.restore();
          ctx.save();                                              // tape
          ctx.globalAlpha = 0.5; ctx.fillStyle = '#EFE3B8';
          for (const [tx, ty, ra] of [[cx - 300, y - 70, -0.5], [cx + 300, y - 74, 0.45]]) {
            ctx.save(); ctx.translate(tx, ty); ctx.rotate(ra); ctx.fillRect(-26, -9, 52, 18); ctx.restore();
          }
          ctx.restore();
        }
        const inkC = bp ? BP.ink : INK;
        ctx.fillStyle = inkC; ctx.globalAlpha = open ? 1 : 0.55;
        ctx.font = Math.round(S * 0.78) + 'px ' + FD;
        ctx.fillText(w.name, bx0, y + 10);
        ctx.globalAlpha = 1;
        if (w.levels.every(Progress.done)) {                       // the whole world, done
          ctx.save(); ctx.translate(bx0 + 4, y + 38); ctx.rotate(-0.05);
          ctx.fillStyle = bp ? BP.red : RED; ctx.globalAlpha = 0.85; ctx.font = '20px ' + FH;
          ctx.fillText('all three done', 0, 0);
          ctx.restore(); ctx.globalAlpha = 1;
        }

        w.levels.forEach(function (id, i) {
          const x = bx0 + 300 + i * 112;
          const r = Progress.get(id), isOpen = unlocked(id), idx = order().indexOf(id);
          const hot = hover === id || press === id || focus === idx;
          const dx = jolt[id] ? Math.sin(jolt[id] * 38) * 4 * jolt[id] : 0;
          if (i > 0) {                                             // a pencil path between pages
            ctx.strokeStyle = bp ? BP.soft : SOFT; ctx.globalAlpha = 0.45; ctx.lineWidth = 1.4;
            ctx.setLineDash([4, 6]);
            ctx.beginPath(); ctx.moveTo(x - 112 + 32, y); ctx.lineTo(x - 32, y); ctx.stroke();
            ctx.setLineDash([]); ctx.globalAlpha = 1;
          }
          ctx.globalAlpha = isOpen ? 1 : 0.32;
          circle(x + dx, y, hot && isOpen ? 28 : 26, inkC, hot && isOpen ? 3.4 : 2.4, i * 7 + wi * 13);
          ctx.fillStyle = inkC; ctx.textAlign = 'center';
          ctx.font = '26px ' + FD;
          ctx.fillText(String(i + 1), x + dx, y + 10);
          ctx.textAlign = 'left'; ctx.globalAlpha = 1;
          if (!isOpen) padlock(x + dx + 26, y - 22, inkC, 0.7);
          else if (r.wins) {
            tick(x + 26, y - 24, bp ? BP.red : RED, id === freshId ? (t - 0.3) / 0.3 : 1);
            ctx.fillStyle = bp ? BP.note : SOFT; ctx.font = '18px ' + FH; ctx.textAlign = 'center';
            ctx.fillText(r.bestInk != null ? Math.round(r.bestInk * 100) + '% ink' : '', x, y + 50);
            ctx.textAlign = 'left';
          } else if (r.bestProg > 0.02) {
            ctx.fillStyle = bp ? BP.note : SOFT; ctx.font = '18px ' + FH; ctx.textAlign = 'center';
            ctx.fillText(Math.round(r.bestProg * 100) + '%', x, y + 50);
            ctx.textAlign = 'left';
          }
          if (id === firstOpen && !press && !pending) {             // Inky waits at the next page
            const bob = Math.abs(Math.sin(t * 2.2)) * 2;
            const was = INK; INK = inkC;
            drawBallAt(x, y - 42 - bob, 0, 1, 0, true);
            INK = was;
          }
          marks.push({ id: id, x: x, y: y, r: 34, open: isOpen });
        });

        if (bp && !open) {
          ctx.fillStyle = SOFT; ctx.globalAlpha = 0.8; ctx.font = '19px ' + FH; ctx.textAlign = 'center';
          ctx.fillText('finish two Notebook pages to open', cx, y + 100);
          ctx.textAlign = 'left'; ctx.globalAlpha = 1;
        }
      });

      drawSoundToggle(true);
      drawTurn();
    }

    function hit(p) {
      for (const m of marks) if (Math.hypot(p.x - m.x, p.y - m.y) <= m.r) return m;
      return null;
    }
    function activate(id) {
      if (pending) return;
      if (!unlocked(id)) { jolt[id] = 1; dryT = 0.16; return; }   // the nib is dry here, for now
      focus = order().indexOf(id);
      pending = { id: id, at: t + 0.14 };
    }
    function goBack() { turnPage(); Title.enter({ direct: true }); }

    function pointer(type, e) {
      const p = toScreen(e.clientX, e.clientY);
      if (type === 'down') {
        if (pending) return;
        if (inSoundBtn(p)) { Sound.toggle(); return; }
        if (backBox && p.x >= backBox.x0 && p.x <= backBox.x1 && p.y >= backBox.y0 && p.y <= backBox.y1) { goBack(); return; }
        const m = hit(p);
        if (m) { press = m.id; pressId = e.pointerId; try { cv.setPointerCapture(e.pointerId); } catch (err) {} }
        return;
      }
      if (type === 'move') {
        const m = hit(p);
        if (e.pointerType === 'mouse' && press === null) {
          hover = m ? m.id : null;
          cv.style.cursor = m || (backBox && p.x <= backBox.x1 && p.y <= backBox.y1) ? 'pointer' : 'default';
        }
        return;
      }
      if (press === null || e.pointerId !== pressId) return;
      const was = press; press = null; pressId = null;
      const m = hit(p);
      if (type === 'up' && m && m.id === was) activate(was);
    }

    function key(e) {
      const k = e.key, list = order();
      if (k === 'Escape') { e.preventDefault(); goBack(); return; }
      if (k === 'ArrowRight' || k === 'ArrowLeft') {
        e.preventDefault();
        focus = (Math.max(0, focus) + (k === 'ArrowRight' ? 1 : list.length - 1)) % list.length;
        return;
      }
      if (k === 'ArrowDown' || k === 'ArrowUp') {
        e.preventDefault();
        focus = (Math.max(0, focus) + (k === 'ArrowDown' ? 3 : list.length - 3)) % list.length;
        return;
      }
      if (k === 'Enter' || k === ' ') { e.preventDefault(); activate(list[Math.max(0, focus)]); }
    }

    return {
      enter: enter, update: update, render: render, pointer: pointer, key: key,
      leave: function () { hover = null; cv.style.cursor = 'default'; },
      marks: function () { return marks; },
      fresh: function (id) { freshId = id; },
    };
  })();

  /* ── the daily challenge ───────────────────────────────────────────────
     One course a day, the same for everyone, from the UTC date. Play it as
     often as you like; your best run goes on a real board. No account: the
     browser's anonymous id, and a name only if you want one. The board is
     fetched when this page opens and a run is sent when it ends — never
     while one is being played. */
  const Net = {
    post: function (path, body, ms) {
      if (!/^https?:$/.test(location.protocol)) return Promise.reject(new Error('offline'));
      let ctl = null, timer = 0;
      try { ctl = new AbortController(); timer = setTimeout(function () { ctl.abort(); }, ms || 7000); } catch (e) {}
      return fetch(path, { method: 'POST', headers: { 'Content-Type': 'application/json' },
                           body: JSON.stringify(body), signal: ctl ? ctl.signal : undefined, cache: 'no-store' })
        .then(function (r) {
          clearTimeout(timer);
          return r.json().catch(function () { return {}; }).then(function (j) {
            if (!r.ok) { const e = new Error(j && j.error || ('http ' + r.status)); e.status = r.status; e.body = j; throw e; }
            return j;
          });
        });
    },
  };

  function cleanName(v) {
    return String(v || '').replace(/[^A-Za-z0-9 _.\-]/g, '').replace(/\s+/g, ' ').trim().slice(0, 14);
  }

  const Daily = (function () {
    let t = 0, day = null, board = null, status = 'idle', pending = null;
    let boxes = {}, hover = null, press = null, pressId = null, editing = false;
    const input = document.getElementById('name');

    function today() { return Gen.utcDay(Clock.now()); }

    function enter(fromTurn) {
      if (!fromTurn) turnPage();
      applyTheme(THEMES.blueprint);
      scene = 'daily';
      t = 0; pending = null; hover = null; press = null; pressId = null;
      penId = null; drawing = null; pendTap = null;
      splats = []; motes = []; shake = 0; camX = 0; camY = 0;
      cv.style.cursor = 'default';
      const d = today();
      if (d !== day) { board = null; day = d; }
      Records.daily(day);
      Stats.setMode('d');
      Stats.dailyOpen(day);
      Stats.flush();
      fetchBoard();
    }

    function fetchBoard() {
      status = board ? 'refresh' : 'loading';
      const want = day;
      Net.post('/api/daily', { op: 'board', day: want, pid: Stats.pid }).then(function (j) {
        if (want !== day) return;
        board = j; status = 'ok';
        if (j.me && j.me.rank) Records.setRank(day, j.me.rank, j.players);
      }).catch(function () { if (want === day) status = 'offline'; });
    }

    /* after a run: report it (the trace only goes with a new best) */
    function submit(res, run) {
      const r = Records.daily(COURSE.day);
      const body = { op: 'submit', day: COURSE.day, pid: Stats.pid, name: Records.name, att: r.attempts,
                     dist: run.dist, time: run.time };
      if (res.newPb) { body.run = run; }
      Net.post('/api/daily', body, 9000).then(function (j) {
        res.net = j.counted === false && res.newPb ? 'rejected' : 'ok';
        res.rank = j.rank; res.players = j.players;
        if (j.rank) Records.setRank(COURSE.day, j.rank, j.players);
        Stats.daily(COURSE.day, run.dist, j.rank || null, r.attempts);
      }).catch(function (e) {
        res.net = e && e.status === 422 ? 'rejected' : 'offline';
      });
    }

    function update(dt) {
      t += dt;
      let penOn = false;
      if (press === 'play' || hover === 'play') penOn = t < 0.2;
      Sound.frame(dt, penOn, 260, 1, false, 0);
      if (pending && t >= pending.at) {
        pending = null;
        if (today() !== day) { day = today(); board = null; }
        turnPage();
        Stats.mode('d');
        startDaily();
      }
      if (today() !== day && !pending) enter(true);          // midnight passed on this page
    }

    function until() {
      const now = Clock.now(), next = Date.UTC(new Date(now).getUTCFullYear(), new Date(now).getUTCMonth(), new Date(now).getUTCDate() + 1);
      const m = Math.max(0, Math.round((next - now) / 60000));
      return Math.floor(m / 60) + 'h ' + (m % 60) + 'm';
    }

    function text(str, x, y, font, color, alpha, align) {
      ctx.font = font; ctx.fillStyle = color; ctx.globalAlpha = alpha == null ? 1 : alpha;
      ctx.textAlign = align || 'left'; ctx.fillText(str, x, y);
      const w = ctx.measureText(str).width;
      ctx.globalAlpha = 1; ctx.textAlign = 'left';
      return align === 'center' ? { x0: x - w / 2, x1: x + w / 2 } : align === 'right' ? { x0: x - w, x1: x } : { x0: x, x1: x + w };
    }
    function under(x0, x1, y, width, alpha) {
      ctx.strokeStyle = INK; ctx.lineWidth = width; ctx.globalAlpha = alpha; ctx.lineCap = 'round';
      ctx.beginPath();
      for (let x = x0; x <= x1; x += 7) ctx.lineTo(x, y + nn(x * 0.4) * 1.1 + (x - x0) * 0.01);
      ctx.stroke(); ctx.globalAlpha = 1;
    }

    function render() {
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.drawImage(paper, 0, 0);
      screenT();
      ctx.textBaseline = 'alphabetic';
      boxes = {};
      const wide = VW >= VH * 0.95;
      const cx = VW / 2;
      const S = Math.min(38, VW * 0.052);
      const top = wide ? Math.max(20, (VH - 520) * 0.4) : Math.max(30, (VH - 900) * 0.35);

      text('‹ home', 20, 34, '19px ' + FH, INK, 0.5);
      boxes.back = { x0: 4, x1: 100, y0: 10, y1: 48 };

      text('DAILY CHALLENGE', cx, top + S + 20, S + 'px ' + FD, INK, 1, 'center');
      text(dayLabel(day) + '   ·   course ' + Gen.seedLabel(Gen.dailySeed(day)), cx, top + S + 64, '22px ' + FH, THEME.note, 0.9, 'center');

      const r = Records.daily(day);
      const colL = wide ? Math.max(40, cx - 330) : cx - 150;
      let y = top + S + 118;
      const me = board && board.me;

      // you, today
      text('your best today', colL, y, '20px ' + FH, THEME.note, 0.85);
      text(r.best ? Math.floor(r.best.dist) + ' m' : '—', colL, y + 46, '38px ' + FD, RED);
      text(r.best ? r.best.time.toFixed(1) + ' s   ·   ' + r.attempts + (r.attempts === 1 ? ' attempt' : ' attempts')
                  : r.attempts ? r.attempts + (r.attempts === 1 ? ' attempt' : ' attempts') + ', nothing counted yet' : 'no runs yet', colL, y + 76, '20px ' + FH, INK, 0.75);
      const rank = me && me.rank ? me.rank : r.rank;
      const players = board ? board.players : r.players;
      const rankLine = status === 'offline' && !board ? 'board offline · your runs still count here'
        : rank ? 'rank #' + rank + ' of ' + players
        : status === 'loading' ? 'reading the board…' : 'not on the board yet';
      text(rankLine, colL, y + 104, '20px ' + FH, INK, 0.75);
      if (board) text(board.players + (board.players === 1 ? ' player' : ' players') + '   ·   ' + board.runs + ' runs today',
                      colL, y + 130, '18px ' + FH, THEME.note, 0.75);

      // PLAY
      const py = y + 204;
      const pm = text('PLAY', colL + 4, py, Math.round(S * 0.95) + 'px ' + FD, INK, 1);
      const hot = hover === 'play' || press === 'play';
      under(pm.x0 - 6, pm.x1 + 8, py + 12, hot ? 3.8 : 2.8, 1);
      boxes.play = { x0: pm.x0 - 20, x1: pm.x1 + 24, y0: py - S * 1.3, y1: py + 24 };

      // name
      const nm = Records.name;
      const nt = text('name on the board: ' + (nm || 'anonymous') + '  ✎', colL, py + 58, '19px ' + FH, INK, 0.62);
      boxes.name = { x0: nt.x0 - 8, x1: nt.x1 + 8, y0: py + 36, y1: py + 68 };
      positionInput(nt.x0, py + 36, Math.max(180, nt.x1 - nt.x0), 32);

      text('a new course every day at 00:00 UTC  ·  next in ' + until(), wide ? cx : colL,
           wide ? Math.min(VH - 22, py + 110) : py + 100, '17px ' + FH, THEME.note, 0.6, wide ? 'center' : 'left');

      // the board
      const bx = wide ? Math.min(VW - 330, cx + 60) : colL;
      let by = wide ? top + S + 118 : py + 160;
      text('TODAY’S BOARD', bx, by, '700 21px ' + FH, INK, 0.9);
      by += 12;
      under(bx, bx + 150, by, 1.4, 0.5);
      by += 30;
      if (!board) {
        text(status === 'offline' ? 'can’t reach the board right now' : 'reading…', bx, by, '19px ' + FH, INK, 0.55);
      } else if (!board.top || !board.top.length) {
        text('nobody yet — be the first line on it', bx, by, '19px ' + FH, INK, 0.55);
      } else {
        const rows = board.top.slice(0, 10);
        rows.forEach(function (row, i) {
          const c = row.me ? RED : INK, a = row.me ? 1 : 0.8;
          text(row.rank + '.', bx + 22, by, '19px ' + FH, c, a, 'right');
          text(row.name || 'anonymous', bx + 32, by, '19px ' + FH, c, a);
          text(Math.floor(row.dist) + ' m', bx + 250, by, '19px ' + FH, c, a, 'right');
          text(row.time.toFixed(1) + 's', bx + 305, by, '16px ' + FH, c, a * 0.75, 'right');
          by += 25;
        });
        if (me && me.rank > rows.length) {
          text('…', bx + 22, by - 6, '19px ' + FH, INK, 0.5, 'right');
          by += 18;
          text(me.rank + '.', bx + 22, by, '19px ' + FH, RED, 1, 'right');
          text(nm || 'you', bx + 32, by, '19px ' + FH, RED, 1);
          text(Math.floor(me.dist) + ' m', bx + 250, by, '19px ' + FH, RED, 1, 'right');
        }
      }
      drawSoundToggle(true);
      drawTurn();
    }

    /* the one piece of DOM: a name field laid over the page when asked for */
    let inputBox = null;
    function positionInput(x, y, w, h) { inputBox = { x: x, y: y, w: w, h: h }; }
    function editName() {
      if (!input || !inputBox) return;
      editing = true;
      const r = cv.getBoundingClientRect();
      input.value = Records.name;
      input.style.left = (r.left + inputBox.x * scale) + 'px';
      input.style.top = (r.top + inputBox.y * scale) + 'px';
      input.style.width = Math.max(200, inputBox.w * scale) + 'px';
      input.style.height = (inputBox.h * scale) + 'px';
      input.style.fontSize = Math.round(19 * scale) + 'px';
      input.style.display = 'block';
      setTimeout(function () { try { input.focus(); input.select(); } catch (e) {} }, 0);
    }
    function doneName(keep) {
      if (!editing) return;
      editing = false;
      if (keep) {
        const v = cleanName(input.value);
        if (v !== Records.name) {
          Records.name = v;
          if (Records.daily(day).best) Net.post('/api/daily', { op: 'name', day: day, pid: Stats.pid, name: v })
            .then(function () { fetchBoard(); }).catch(function () {});
        }
      }
      input.style.display = 'none';
      try { cv.focus(); } catch (e) {}
    }
    if (input) {
      input.addEventListener('keydown', function (e) {
        if (e.key === 'Enter') { e.preventDefault(); doneName(true); }
        else if (e.key === 'Escape') { e.preventDefault(); doneName(false); }
        e.stopPropagation();
      });
      input.addEventListener('blur', function () { doneName(true); });
    }

    function hit(p) {
      for (const k in boxes) { const b = boxes[k]; if (p.x >= b.x0 && p.x <= b.x1 && p.y >= b.y0 && p.y <= b.y1) return k; }
      return null;
    }
    function activate(k) {
      if (pending) return;
      Sound.click();
      if (k === 'play') { pending = { at: t + 0.14 }; return; }
      if (k === 'back') { turnPage(); Title.enter({ direct: true }); return; }
      if (k === 'name') editName();
    }
    function pointer(type, e) {
      const p = toScreen(e.clientX, e.clientY);
      if (type === 'down') {
        if (editing) { doneName(true); return; }
        if (pending) return;
        if (inSoundBtn(p)) { Sound.toggle(); return; }
        const k = hit(p);
        if (k) { press = k; pressId = e.pointerId; try { cv.setPointerCapture(e.pointerId); } catch (err) {} }
        return;
      }
      if (type === 'move') {
        if (e.pointerType === 'mouse' && press === null) { hover = hit(p); cv.style.cursor = hover ? 'pointer' : 'default'; }
        return;
      }
      if (press === null || e.pointerId !== pressId) return;
      const was = press; press = null; pressId = null;
      if (type === 'up' && hit(p) === was) activate(was);
    }
    function key(e) {
      if (e.key === 'Escape') { e.preventDefault(); activate('back'); return; }
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); activate('play'); return; }
      if (e.key === 'n' || e.key === 'N') { e.preventDefault(); editName(); }
    }

    return {
      enter: enter, update: update, render: render, pointer: pointer, key: key, submit: submit,
      today: today, refresh: fetchBoard,
      leave: function () { hover = null; cv.style.cursor = 'default'; },
      editing: function () { return editing; },
      get board() { return board; }, get status() { return status; }, get day() { return day; },
      boxes: function () { return boxes; },
    };
  })();

  /* ── the front page ─────────────────────────────────────────────────────
     Not a menu screen: the first page of the notebook. It shows the whole game
     before anyone touches it — a line draws itself, Inky runs it on the real
     physics, the slope speeds him up, and the page shows what a wall does to
     him. Then the choices are written in underneath.

     It runs on the level engine: the same grid, substeps, stroke renderer,
     splat and sound graph. None of it counts as an attempt — analytics begin
     when CAMPAIGN is chosen. First visit plays the whole beat; after that the
     choices are written in at once while the little run plays behind them, and
     any tap that is not on a choice skips straight to the finished page. */
  const Title = (function () {
    const SEEN_KEY = 'inkline.introSeen';
    let seen = false;
    try { seen = localStorage.getItem(SEEN_KEY) === '1'; } catch (e) {}

    // the beat, in seconds from opening the page
    const TL = {
      title: 0.1,  titleDur: 0.55,
      sub: 0.55,   subDur: 0.34, subGap: 0.17,
      line: 1.0,   lineDur: 0.95, wallDur: 0.18,
      runDelay: 0.05,
      pause: 0.5,                     // the silence after the splat
      menuDur: 0.32, menuGap: 0.15,
      menuSeen: 0.35,                 // returning players get the choices at once
    };
    const WALL_H = 62, RUNOUT = 46;
    const ITEMS = [
      { label: 'CAMPAIGN', primary: true, go: 'campaign' },
      { label: 'ENDLESS', go: 'endless' },
      { label: 'DAILY CHALLENGE', go: 'daily' },
    ];
    let zenBox = null, zenHot = 0;

    /* ── the opening, played ────────────────────────────────────────────────
       A first-time player is not shown a menu. Inky drops onto a page with a
       small gap and a slightly higher platform beyond it, and starts to run.
       Nothing says what to do. Most people draw a ramp; if nothing is drawn
       and he falls (or three tries go wrong) the next try carries a pencilled
       "Draw a line for Inky" and a loose dotted ramp. A fall is a splat and an
       instant restart. Once he is up, nothing stops: the page slides on, the
       pen draws the U ahead of him, he rides it into the wall — splat — and
       only then is THE INKLINE written and the choices appear. */
    const TUT_KEY = 'inkline.tutorialDone';
    let tutDone = false;
    try { tutDone = localStorage.getItem(TUT_KEY) === '1'; } catch (e) {}
    if (/[?&]fresh(\b|=|&|$)/.test(location.search)) {             // testing: behave like a first visit
      try { localStorage.removeItem(TUT_KEY); localStorage.removeItem(SEEN_KEY); } catch (e) {}
      tutDone = false; seen = false;
    }
    const FORCE_TUT = /[?&]tutorial(\b|=|&|$)/.test(location.search);
    let tut = null;              // the interactive opening, while it is played
    let flow = false;            // the opening has become the title: the words wait for the splat
    let textAt = TL.title;       // when THE INKLINE starts being written
    let panT = 1, panFrom = 0;
    let helpBox = null, helpHot = 0, tutFade = 1;

    let entered = false, phase = 'idle', t = 0;
    let lay = null, lineStroke = null, wallStroke = null, wallRect = null;
    let lastVW = 0, lastVH = 0, cornerKicked = false;
    let inky = false, splatT = -1, menuT = null;   // null: the choices are not written yet
    let hover = -1, focus = -1, press = -1, pressId = null;
    const under = [0, 0, 0], jolt = [0, 0, 0];
    let dryT = 0, pending = null;

    const clamp01 = function (v) { return v < 0 ? 0 : v > 1 ? 1 : v; };
    const sm = function (a, b, x) { const k = clamp01((x - a) / (b - a)); return k * k * (3 - 2 * k); };
    // the pen: starts gently, runs through the middle, settles at the end
    const ease = function (x) { x = clamp01(x); return x - Math.sin(2 * Math.PI * x) / (2 * Math.PI); };
    const easeV = function (x) { x = clamp01(x); return 1 - Math.cos(2 * Math.PI * x); };
    const out3 = function (x) { x = clamp01(x); return 1 - Math.pow(1 - x, 3); };

    function markSeen() {
      if (seen) return;
      seen = true;
      try { localStorage.setItem(SEEN_KEY, '1'); } catch (e) {}
    }

    /* ── the page's geometry ───────────────────────────────────────────── */
    function yAt(x) {
      const w = Math.sin(x * 0.021 + 1.3) * 1.1 + Math.sin(x * 0.093 + 0.4) * 0.35;   // a hand, not a ruler
      if (x <= lay.L) return lay.yT + w;
      if (x >= lay.R0) return lay.yR + w * 0.6;
      const u = (x - lay.L) / (lay.R0 - lay.L);
      const bump = sm(0, 0.34, u) * (1 - sm(0.66, 1, u));     // a long, shallow U
      return lay.yT + lay.D * bump + lay.rim * sm(0.55, 1, u) + w;
    }

    function layout() {
      lastVW = VW; lastVH = VH;
      const S = Math.min(64, VW * 0.085);
      const D = Math.min(80, VH * 0.13);
      const blockH = S * 1.05 + 42 + 31 + 64 + D * 1.08 + 80 + 96 + 40;
      const top = Math.max(26, (VH - blockH) * 0.45);
      const titleY = top + S * 1.05;              // Rock Salt rides high above its baseline
      const sub1 = titleY + 42, sub2 = sub1 + 31;
      const yT = sub2 + 64;
      const x0 = VW * 0.05;
      const R = VW * 0.9;                         // the wall
      const R0 = R - RUNOUT;                      // where the U hands over to the run-out
      const uW = Math.min(R0 - x0 - 50, 640);
      lay = { S: S, D: D, cx: VW / 2, titleY: titleY, sub1: sub1, sub2: sub2,
              yT: yT, x0: x0, L: R0 - uW, R0: R0, R: R, rim: D * 0.3, yR: yT + D * 0.3 };
      lay.menuY = yT + D * 1.08 + 80;
      /* On a wide page the flat lead-in is long. The pen always outruns Inky,
         so he can set off a little before the wall is finished and still meet
         the U just as it completes: the beat keeps its length on any screen. */
      const lead = Math.max(0, lay.L - x0 - 60);
      lay.entry = 400 + Math.min(120, lead * 0.35);   // a longer run-up, a quicker entrance
      const wallDone = TL.line + TL.lineDur + TL.wallDur + TL.runDelay;
      lay.spawnAt = Math.max(TL.line + TL.lineDur * 0.6, wallDone - lead / lay.entry);

      // the path, measured along its length so the pen can travel it
      const dense = [];
      for (let x = x0; x < R; x += 2) dense.push({ x: x, y: yAt(x) });
      dense.push({ x: R, y: yAt(R) });
      const cum = [0];
      for (let i = 1; i < dense.length; i++)
        cum.push(cum[i - 1] + Math.hypot(dense[i].x - dense[i - 1].x, dense[i].y - dense[i - 1].y));
      const total = cum[cum.length - 1];
      lay.total = total;

      // the pen draws it: every point stamped with when the nib reached it
      const pts = [];
      let j = 0, last = null;
      for (let tau = 0; tau <= TL.lineDur + 1e-9; tau += 1 / 240) {
        const sArc = total * ease(tau / TL.lineDur);
        while (j < cum.length - 2 && cum[j + 1] < sArc) j++;
        const f = (sArc - cum[j]) / Math.max(1e-6, cum[j + 1] - cum[j]);
        const px = dense[j].x + (dense[j + 1].x - dense[j].x) * f;
        const py = dense[j].y + (dense[j + 1].y - dense[j].y) * f;
        if (!last || Math.hypot(px - last.x, py - last.y) >= 4.5) {
          const v = total * easeV(tau / TL.lineDur) / TL.lineDur;      // faster runs thinner
          const w = (5.4 - Math.min(2.3, v * 0.0021)) * (0.84 + 0.3 * n1(pts.length * 3.3 + 11));
          last = { x: px, y: py, t: tau, w: w, dry: 0 };
          pts.push(last);
        }
      }
      const end = dense[dense.length - 1];
      if (Math.hypot(end.x - last.x, end.y - last.y) > 0.5)
        pts.push({ x: end.x, y: end.y, t: TL.lineDur, w: 5.2, dry: 0 });
      lineStroke = { pts: pts, minX: x0 - 6, maxX: R + 6, blots: [], seed: 3.1 };

      // then turns and stands the wall up
      const foot = pts[pts.length - 1];
      const wp = [{ x: foot.x, y: foot.y, t: TL.lineDur, w: 5.0, dry: 0 }];
      for (let tau = 1 / 240; tau <= TL.wallDur + 1e-9; tau += 1 / 240) {
        const e = ease(tau / TL.wallDur);
        const y = foot.y - WALL_H * e;
        if (Math.abs(y - wp[wp.length - 1].y) >= 3 || tau + 1 / 240 > TL.wallDur)
          wp.push({ x: R + Math.sin(e * 3.1) * 0.8, y: y, t: TL.lineDur + tau, w: 4.6 + 0.8 * n1(wp.length * 1.7), dry: 0 });
      }
      wallStroke = { pts: wp, minX: R - 6, maxX: R + 6, blots: [], seed: 5.3 };
      lay.yR = foot.y;
      lay.top = wp[wp.length - 1];
      wallRect = { x0: R - 2, x1: R + 3, y0: lay.top.y, y1: foot.y + 5 };

      // the opening's page, a screen to the left: a ledge, a gap, and a
      // slightly higher platform whose top is where the U line begins
      const pY = pts[0].y;
      lay.tut = { pX1: x0, pX0: x0 - 170, gX0: x0 - 290, sX0: x0 - 620, pY: pY, sY: pY + 38 };
      lay.tut.cam = (lay.tut.sX0 + lay.tut.pX1) / 2 - VW / 2 - 10;

      // it is real ground: the same grid a level uses
      grid.clear();
      for (const P of [pts, wp])
        for (let i = 0; i < P.length - 1; i++)
          addSeg({ x0: P[i].x, y0: P[i].y, x1: P[i + 1].x, y1: P[i + 1].y });
      if (tut || flow) addTutGround();
    }

    function addTutGround() {
      const T = lay.tut, bottom = VH + 60;
      addSeg({ x0: T.cam - 80, y0: T.sY, x1: T.gX0, y1: T.sY });        // the ledge Inky lands on
      addSeg({ x0: T.gX0, y0: T.sY, x1: T.gX0, y1: bottom });           // its edge
      // the platform: its face, a worn corner (a ramp that arrives a little
      // low rides up it rather than into it), and its top, into the U
      addSeg({ x0: T.pX0, y0: T.pY + 12, x1: T.pX0, y1: bottom });
      addSeg({ x0: T.pX0, y0: T.pY + 12, x1: T.pX0 + 22, y1: T.pY });
      addSeg({ x0: T.pX0 + 22, y0: T.pY, x1: T.pX1, y1: T.pY });
    }

    function relayout() {
      if (lay && Math.abs(VW - lastVW) < 2 && Math.abs(VH - lastVH) < 2) return;
      layout();
      if (entered && scene === 'title' && phase === 'tutorial') { tutAttempt(true); return; }
      if (entered && scene === 'title') {         // a rotated page is simply the finished page
        splats = []; motes = []; splatT = -1; inky = false;
        toEnd();
      }
    }

    /* ── entering, skipping ─────────────────────────────────────────────── */
    function enter(opts) {
      applyTheme(THEMES.notebook);
      scene = 'title'; entered = true;
      penId = null; drawing = null; pendTap = null;
      splats = []; motes = []; shake = 0; flash = 0;
      camX = 0; camY = 0;
      runT = 10;                                   // past a level's opening beat
      ball.vx = 0; ball.vy = 0; ball.hit = 0; ball.landed = 0;
      t = 0; inky = false; splatT = -1; pending = null; cornerKicked = false;
      hover = -1; focus = -1; press = -1; pressId = null; dryT = 0;
      for (let i = 0; i < ITEMS.length; i++) { under[i] = 0; jolt[i] = 0; }
      zenBox = null; zenHot = 0;
      tut = null; flow = false; textAt = TL.title; panT = 1; helpBox = null; BEAT = 0.55;
      const boot = !!(opts && opts.boot);
      const wantTut = !!(opts && opts.tutorial) || (boot && (FORCE_TUT || (!tutDone && !seen)));
      if (boot && !wantTut && tutDone) Stats.tutorial('skipped', {});
      layout();
      if (wantTut) { startTutorial(!!(opts && opts.tutorial)); return; }
      menuT = seen ? TL.menuSeen : null;
      phase = 'intro';
      cv.style.cursor = 'default';
      if ((opts && opts.direct) || REDUCED) toEnd();
    }

    /* ── the opening: attempts, failing, getting up ─────────────────────── */
    function startTutorial(replay) {
      tut = { n: 0, fails: 0, hint: false, drewBeforeHint: false, t0: performance.now(), replay: replay };
      phase = 'tutorial';
      textAt = Infinity; menuT = null; inky = false; splatT = -1;
      cv.style.cursor = 'crosshair';
      INK_MAX = 1400;
      Stats.setMode('t'); Stats.setLevel('tutorial');
      Stats.tutorial('start', { rp: replay ? 1 : 0 });
      tutAttempt(false);
    }
    function tutAttempt(same) {
      const T = lay.tut;
      if (!same) tut.n++;
      tut.state = 'play'; tut.deadT = 0; tut.still = 0;
      strokes = []; drawing = null; penId = null; pendTap = null; scratches = [];
      ink = INK_MAX; inkSpent = 0; splats = []; motes = []; shake = 0; hasDrawn = false;
      layout();                                    // fresh ground, no old lines
      camX = T.cam; camY = 0;
      ball.x = T.sX0 + 80; ball.y = T.sY - 150; ball.vx = 0; ball.vy = 0; ball.ang = 0;
      ball.grounded = false; ball.nx = 0; ball.ny = -1; ball.air = 0.3; ball.step = 0; ball.hit = 0; ball.landed = 0;
      runT = 0;
      BEAT = tut.hint ? 2.0 : 1.2;                 // he lands, looks, and goes
      t = 0;
    }
    function tutFail(why, sx, sy) {
      tut.state = 'dead'; tut.fails++;
      if (drawing) endStroke();
      penId = null;
      burstSplat(sx, sy);
      shake = REDUCED ? 0 : 0.7;
      Sound.splat(Math.min(1, Math.hypot(ball.vx, ball.vy) / 700));
      try { if (navigator.vibrate) navigator.vibrate(16); } catch (e) {}
      const drew = inkSpent >= 40;
      Stats.tutorial('fail', { n: tut.n, why: why, drew: drew ? 1 : 0 });
      /* help only someone who has not found the pen: nothing drawn at all, or
         three goes that have not worked */
      if (!tut.hint && (!drew || tut.fails >= 3)) { tut.hint = true; Stats.tutorial('hint', { n: tut.n + 1 }); }
    }
    function tutWon() {
      Stats.tutorial('done', { n: tut.n, fails: tut.fails, hinted: tut.hint ? 1 : 0, drew: tut.drewBeforeHint ? 1 : 0,
                               ms: Math.round(performance.now() - tut.t0), rp: tut.replay ? 1 : 0 });
      Stats.flush();
      tutDone = true;
      try { localStorage.setItem(TUT_KEY, '1'); } catch (e) {}
      if (drawing) endStroke();
      penId = null;
      /* no stop, no fade: he keeps running, the page slides on to the U, and
         the pen draws it ahead of him */
      tut = null; flow = true; phase = 'intro';
      t = TL.line - 0.02; inky = true; splatT = -1; menuT = null; textAt = Infinity;
      panFrom = camX; panT = 0; tutFade = 1;
      BEAT = 0.55; runT = 10;
      cv.style.cursor = 'default';
    }
    function tutUpdate(dt) {
      t += dt; runT += dt;
      penFeel(dt, tut.state === 'play');
      if (tut.state === 'dead') { tut.deadT += dt; if (tut.deadT > 0.5) tutAttempt(false); return; }
      stepPhysics(dt);
      const T = lay.tut;
      if (inkSpent >= 40 && !tut.hint) tut.drewBeforeHint = true;
      // past the platform's edge and above its top: he is up (landing is certain from there)
      if (ball.x > T.pX0 + 24 && ball.y < T.pY - 2) { tutWon(); return; }
      if (ball.y > VH + 30) { tutFail('fell', ball.x, VH - 12); return; }
      if (ball.x < T.cam - 20) { tutFail('back', T.cam + 12, ball.y); return; }
      if (runT > BEAT + 0.4 && Math.hypot(ball.vx, ball.vy) < 18) {          // stuck against something
        tut.still += dt;
        if (tut.still > 1.0) { tutFail('stuck', ball.x, ball.y); return; }
      } else tut.still = 0;
    }
    function tutPointer(type, e) {
      if (type === 'down') {
        const p = toScreen(e.clientX, e.clientY);
        if (inSoundBtn(p)) { Sound.toggle(); return; }
        if (penId !== null || tut.state !== 'play') return;
        penId = e.pointerId;
        Stats.input(e.pointerType === 'mouse' ? 'mouse' : e.pointerType || 'touch');
        try { cv.setPointerCapture(e.pointerId); } catch (err) {}
        mouseF.on = e.pointerType === 'mouse';
        if (mouseF.on) { const tt = e.timeStamp || performance.now(); mouseF.x.reset(e.clientX, tt); mouseF.y.reset(e.clientY, tt); }
        beginStroke(toWorld(e.clientX, e.clientY));
        return;
      }
      if (type === 'move') {
        if (e.pointerId !== penId || !drawing) return;
        let evs = [e];
        if (e.getCoalescedEvents) { const c = e.getCoalescedEvents(); if (c && c.length) evs = c; }
        for (let i = 0; i < evs.length && drawing; i++) extendStroke(penAt(evs[i]));
        return;
      }
      if (e.pointerId !== penId) return;
      penId = null;
      if (drawing) {
        if (mouseF.on && type === 'up') extendStroke(toWorld(e.clientX, e.clientY));
        if (drawing) endStroke();
      }
    }

    // the ground of the opening: printed blocks, like a campaign plinth
    function drawTutGround(alpha) {
      const T = lay.tut, bottom = VH + 20;
      ctx.save(); ctx.globalAlpha = alpha;
      const block = function (x0, x1, y, seed) {
        ctx.save();
        ctx.beginPath(); ctx.rect(x0, y, x1 - x0, bottom - y); ctx.clip();
        ctx.strokeStyle = SOFT; ctx.lineWidth = 1.5; ctx.globalAlpha = 0.42 * alpha;
        for (let x = x0 - 400; x < x1 + 20; x += 11) { ctx.beginPath(); ctx.moveTo(x, bottom + 10); ctx.lineTo(x + 420, y - 12); ctx.stroke(); }
        ctx.restore();
        ctx.strokeStyle = SOFT; ctx.lineWidth = 2.8; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.globalAlpha = alpha;
        ctx.beginPath();
        ctx.moveTo(x0 + nn(seed) * 1.2, bottom);
        for (let x = x0; x <= x1; x += 14) ctx.lineTo(x, y + nn(x * 0.31 + seed) * 1.0);
        ctx.lineTo(x1, y);
        ctx.stroke();
      };
      // the ledge runs in from the margin, its edge drops away; the platform stands beyond the gap
      block(T.cam - 80, T.gX0, T.sY, 3);
      ctx.strokeStyle = SOFT; ctx.lineWidth = 2.8;
      ctx.beginPath(); ctx.moveTo(T.gX0, T.sY); ctx.lineTo(T.gX0 + nn(7) * 1.2, bottom); ctx.stroke();
      block(T.pX0, T.pX1, T.pY, 9);
      ctx.save();                                   // the worn corner: paper over the square one
      ctx.fillStyle = PAPER; ctx.globalAlpha = alpha;
      ctx.beginPath(); ctx.moveTo(T.pX0 - 3, T.pY - 3); ctx.lineTo(T.pX0 + 24, T.pY - 3); ctx.lineTo(T.pX0 + 22, T.pY + 1.5);
      ctx.lineTo(T.pX0 + 1.5, T.pY + 12); ctx.lineTo(T.pX0 - 3, T.pY + 12); ctx.closePath(); ctx.fill();
      ctx.restore();
      ctx.beginPath(); ctx.moveTo(T.pX0 + 22, T.pY); ctx.lineTo(T.pX0, T.pY + 12); ctx.lineTo(T.pX0 + nn(11) * 1.2, bottom); ctx.stroke();
      ctx.restore();
    }

    // only for someone who has not found the pen yet
    function drawTutHint() {
      const T = lay.tut;
      const k = Math.min(1, runT / 0.35);
      const pulse = 0.72 + 0.28 * Math.sin(performance.now() * 0.004);
      ctx.save();
      ctx.globalAlpha = k * 0.55 * pulse;
      ctx.strokeStyle = RED; ctx.lineWidth = 2.6; ctx.lineCap = 'round';
      ctx.setLineDash([3, 10]);
      ctx.beginPath();
      // loose, not a template: from before the edge to the far top, bowed a little
      const ax = T.gX0 - 70, ay = T.sY + 1, bx = T.pX0 + 40, by = T.pY - 3;
      for (let i = 0; i <= 16; i++) {
        const u = i / 16, x = ax + (bx - ax) * u;
        const y = ay + (by - ay) * u * u * (3 - 2 * u) - Math.sin(u * Math.PI) * 6 + nn(i * 3.7) * 2.2;
        i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
      }
      ctx.stroke(); ctx.setLineDash([]);
      ctx.globalAlpha = k;
      ctx.fillStyle = RED; ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
      ctx.font = Math.round(Math.min(34, VW * 0.05)) + 'px ' + FH;
      ctx.translate((T.gX0 + T.pX0) / 2, T.pY - 92); ctx.rotate(-0.03);
      ctx.fillText('Draw a line for Inky', 0, 0);
      ctx.restore();
      ctx.textAlign = 'left';
    }

    /* The finished page: line and wall drawn, Inky's splat already dry on the
       wall, the choices written. Skipping still tells the story, just still. */
    function toEnd() {
      if (phase === 'tutorial') { tut = null; flow = false; textAt = TL.title; layout(); }   // tests may skip it
      camX = 0; panT = 1;
      if (flow) textAt = Math.min(textAt, t - 3);
      const done = TL.line + TL.lineDur + TL.wallDur + 0.01;
      if (t < done) t = done;
      if (splatT < 0) {
        inky = false;
        ball.vx = 420; ball.vy = 0; ball.y = lay.yR - ball.r;
        splatWall(true);
        for (let k = 0; k < 40; k++) for (const m of motes) {
          if (m.set) continue;
          m.life += 1 / 60; m.vy += GRAV * 1.1 / 60;
          m.x += m.vx / 60; m.y += m.vy / 60; m.vx *= (1 - 2.2 / 60);
          if (m.life > 0.34) m.set = true;
        }
        for (const sp of splats) sp.t = 1;
      }
      menuT = Math.min(menuT === null ? Infinity : menuT, t - 3);
      phase = 'menu';
      shake = 0;
      markSeen();
    }

    /* ── Inky ──────────────────────────────────────────────────────────── */
    function spawn() {
      inky = true;
      ball.x = -26; ball.y = lay.yT - 16; ball.vx = lay.entry; ball.vy = 0;   // in from the margin, already running
      ball.ang = 0; ball.grounded = false; ball.nx = 0; ball.ny = -1;
      ball.air = 0.2; ball.step = 0; ball.hit = 0; ball.landed = 0;
    }

    function hitsWall() {
      const r = wallRect;
      const cx = Math.max(r.x0, Math.min(ball.x, r.x1));
      const cy = Math.max(r.y0, Math.min(ball.y, r.y1));
      const dx = ball.x - cx, dy = ball.y - cy;
      return dx * dx + dy * dy < ball.r * ball.r * 0.86;
    }

    function splatWall(quiet) {
      inky = false;
      splatT = t;
      const y = Math.min(ball.y, lay.yR - ball.r);
      const x = lay.R - 15;
      const n0 = motes.length;
      burstSplat(x, y);
      splats[splats.length - 1].r = 16;               // flattened against the face, not through it
      for (let i = n0; i < motes.length; i++) {       // the wall throws the flecks back, not far
        const m = motes[i];
        if (m.vx > 0) m.vx = -m.vx * 0.5 - 20;
        m.vx *= 0.6;
        m.vy = m.vy * 0.45 - 20;
        m.r *= 0.8;
      }
      splats.push({ x: lay.R - 7, y: y - 20, r: 6, t: 0, seed: Math.random() * 99 });
      if (!quiet) {
        shake = REDUCED ? 0 : 0.55;
        Sound.splat(Math.min(1, Math.hypot(ball.vx, ball.vy) / 700));
        try {
          if (navigator.vibrate && navigator.userActivation && navigator.userActivation.hasBeenActive) navigator.vibrate(16);
        } catch (e) {}
      }
      markSeen();
      if (flow && textAt === Infinity) { textAt = t + (quiet ? -3 : 0.35); menuT = textAt + 1.05; }
      else if (menuT === null) menuT = t + (quiet ? 0 : TL.pause);
    }

    /* ── per frame ─────────────────────────────────────────────────────── */
    function penSpeedAt(lt) {
      if (lt < TL.lineDur) return lay.total * easeV(lt / TL.lineDur) / TL.lineDur;
      return WALL_H * easeV((lt - TL.lineDur) / TL.wallDur) / TL.wallDur;
    }

    function update(dt) {
      if (phase === 'tutorial') { tutUpdate(dt); return; }
      t += dt;
      let penOn = false, pSpeed = 0, pInk = 1;

      if (panT < 1) {                               // the page slides on from the opening to the U
        panT = Math.min(1, panT + dt / 1.15);
        camX = panFrom * (1 - sm(0, 1, panT));
      } else if (flow && tutFade > 0) tutFade = Math.max(0, tutFade - dt / 0.9);   // the opening's page goes quiet
      if (t > textAt && t < textAt + (TL.sub - TL.title) + TL.subGap + TL.subDur) { penOn = true; pSpeed = 240; }
      const lt = t - TL.line;
      if (lt > 0 && lt < TL.lineDur + TL.wallDur) {
        penOn = true; pSpeed = Math.max(pSpeed, penSpeedAt(lt));
        if (!cornerKicked && lt >= TL.lineDur) { cornerKicked = true; Sound.turn(0.45); }
      }
      if (menuT !== null) for (let i = 0; i < ITEMS.length; i++) {
        const k = (t - menuT - i * TL.menuGap) / TL.menuDur;
        if (k > 0 && k < 1) { penOn = true; pSpeed = Math.max(pSpeed, 360); }
      }
      for (let i = 0; i < ITEMS.length; i++) {
        const target = (hover === i || focus === i || press === i) ? 1 : 0;
        const before = under[i];
        under[i] += (target - under[i]) * Math.min(1, dt * (target ? 10 : 7));
        if (target && under[i] - before > 0.012) {
          penOn = true;
          pSpeed = Math.max(pSpeed, ITEMS[i].locked ? 200 : 260);
          if (ITEMS[i].locked) pInk = Math.min(pInk, 0.06);          // no ink here yet
        }
        if (jolt[i] > 0) jolt[i] = Math.max(0, jolt[i] - dt * 2.8);
      }
      if (dryT > 0) { dryT -= dt; penOn = true; pSpeed = Math.max(pSpeed, 520); pInk = 0; }

      if (!inky && splatT < 0 && t >= lay.spawnAt) spawn();
      if (inky) {
        stepPhysics(dt);
        if (hitsWall()) splatWall(false);
        else if (ball.y > VH + 80 || ball.x > VW + 80) { inky = false; if (flow && splatT < 0) toEnd(); }
      }
      Sound.frame(dt, penOn, pSpeed, pInk, inky && ball.grounded, inky ? Math.hypot(ball.vx, ball.vy) : 0);
      if (ball.landed) { if (inky) Sound.land(ball.landed); ball.landed = 0; }

      zenHot += ((hover === 'zen' ? 1 : 0) - zenHot) * Math.min(1, dt * 10);
      helpHot += ((hover === 'help' ? 1 : 0) - helpHot) * Math.min(1, dt * 10);
      if (pending && t >= pending.at) choose(pending.i);
      if (phase === 'intro' && splatT >= 0 && menuT !== null && t > menuT + TL.menuGap * 2 + TL.menuDur) phase = 'menu';
    }

    /* ── drawing ───────────────────────────────────────────────────────── */
    // text written in by a nib travelling left to right
    function inkText(txt, cx, base, font, size, color, alpha, k, dx) {
      k = clamp01(k);
      if (k <= 0) return null;
      ctx.font = font;
      const w = ctx.measureText(txt).width;
      const x0 = cx - w / 2 + (dx || 0);
      ctx.save();
      if (k < 1) { ctx.beginPath(); ctx.rect(x0 - 12, base - size * 1.4, (w + 24) * k, size * 2.2); ctx.clip(); }
      ctx.fillStyle = color; ctx.globalAlpha = alpha;
      ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
      ctx.fillText(txt, x0, base);
      ctx.restore();
      if (k < 1) {
        ctx.fillStyle = color; ctx.globalAlpha = alpha;
        ctx.beginPath();
        ctx.arc(x0 - 12 + (w + 24) * k, base - size * 0.32 + Math.sin(k * 23) * size * 0.12,
                Math.max(1.8, size * 0.045), 0, 6.2832);
        ctx.fill();
        ctx.globalAlpha = 1;
      }
      return { x0: x0, x1: x0 + w };
    }

    function tipAt(lt) {
      const P = lt < TL.lineDur ? lineStroke.pts : wallStroke.pts;
      let p = P[0];
      for (let i = 0; i < P.length; i++) { if (P[i].t <= lt) p = P[i]; else break; }
      return p;
    }

    function underline(i) {
      const b = ITEMS[i].box, e = out3(under[i]);
      const locked = !!ITEMS[i].locked;
      const x0 = b.tx0 - 6, x1 = x0 + (b.tx1 - b.tx0 + 12) * e;
      const y = b.base + 9;
      ctx.strokeStyle = locked ? SOFT : INK;
      ctx.globalAlpha = locked ? 0.6 : 1;
      ctx.lineCap = 'round';
      ctx.lineWidth = press === i ? 3.8 : 2.7;
      let px = x0, py = y + nn(x0 * 0.3 + i * 7) * 1.1, seg = 0;
      for (let x = x0 + 6; x <= x1 + 0.01; x += 6) {
        const yy = y + nn(x * 0.3 + i * 7) * 1.1 + (x - x0) * 0.012;   // a hand underline drifts
        if (!locked || seg % 3 !== 1) { ctx.beginPath(); ctx.moveTo(px, py); ctx.lineTo(x, yy); ctx.stroke(); }
        seg++; px = x; py = yy;
      }
      ctx.globalAlpha = 1;
      if (press === i && !locked) { ctx.fillStyle = INK; ctx.beginPath(); ctx.arc(x0, y + 0.5, 2.6, 0, 6.2832); ctx.fill(); }
    }

    function menu() {
      if (menuT === null) return;
      const big = Math.round(Math.min(34, lay.S * 0.52));
      const small = Math.round(Math.min(34, lay.S * 0.5));
      const ys = [lay.menuY, lay.menuY + 52, lay.menuY + 96];
      for (let i = 0; i < ITEMS.length; i++) {
        const it = ITEMS[i];
        const k = (t - menuT - i * TL.menuGap) / TL.menuDur;
        if (k <= 0) { it.box = null; continue; }
        const dx = jolt[i] > 0 ? Math.sin(jolt[i] * 38) * 5 * jolt[i] : 0;
        const size = it.primary ? big : small;
        const font = it.primary ? size + 'px ' + FD : '700 ' + size + 'px ' + FH;
        const m = inkText(it.label, lay.cx, ys[i], font, size, INK, it.locked ? 0.42 : 1, k, dx);
        const cy = ys[i] - size * 0.35, hh = Math.max(46 / scale, size * 1.3) / 2;   // at least a fingertip tall
        it.box = { x0: m.x0 - 18, x1: m.x1 + 18, y0: cy - hh, y1: cy + hh,
                   tx0: m.x0, tx1: m.x1, base: ys[i], k: clamp01(k) };
        if (it.go === 'endless' && k >= 1) {           // zen: a pencil note in the margin
          const zs = Math.round(small * 0.72);
          ctx.save();
          ctx.translate(m.x1 + 14, ys[i] - size * 0.42); ctx.rotate(-0.08);
          ctx.fillStyle = SOFT; ctx.globalAlpha = 0.62 + 0.38 * zenHot;
          ctx.font = zs + 'px ' + FH;
          ctx.fillText('or zen', 0, 0);
          const zw = ctx.measureText('or zen').width;
          if (zenHot > 0.05) {
            ctx.strokeStyle = SOFT; ctx.lineWidth = 1.6; ctx.beginPath();
            ctx.moveTo(0, 5); ctx.lineTo(zw * zenHot, 5 + nn(zw) * 0.8); ctx.stroke();
          }
          ctx.restore(); ctx.globalAlpha = 1;
          const hz = Math.max(40 / scale, zs * 1.6) / 2;
          zenBox = { x0: m.x1 + 4, x1: m.x1 + 24 + zw, y0: ys[i] - size * 0.42 - zs * 0.35 - hz, y1: ys[i] - size * 0.42 - zs * 0.35 + hz };
        }
        if (it.go === 'daily' && k >= 1) {             // today's course, under it
          ctx.fillStyle = RED; ctx.globalAlpha = 0.8;
          ctx.font = Math.round(small * 0.62) + 'px ' + FH;
          ctx.textAlign = 'center';
          ctx.fillText(todayNote(), lay.cx, ys[i] + Math.round(small * 0.78));
          ctx.textAlign = 'left'; ctx.globalAlpha = 1;
        }
        if (under[i] > 0.02 && k >= 1) underline(i);
      }
    }

    function render() {
      viewL = camX - 40; viewR = camX + VW + 40;
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.drawImage(paper, 0, 0);
      worldT();

      const S = lay.S, ss = Math.round(S * 0.46), w0 = t - textAt;
      inkText('THE INKL\u200aINE', lay.cx, lay.titleY, S + 'px ' + FD, S, INK, 1, w0 / TL.titleDur);
      inkText('Draw the path.', lay.cx, lay.sub1, ss + 'px ' + FH, ss, RED, 1, (w0 - (TL.sub - TL.title)) / TL.subDur);
      inkText('Get Inky home.', lay.cx, lay.sub2, ss + 'px ' + FH, ss, RED, 1, (w0 - (TL.sub - TL.title) - TL.subGap) / TL.subDur);

      if (tut || flow) {
        const a = tut ? 1 : tutFade;
        if (a > 0.01) drawTutGround(a);
        drawScratches();
        for (const sk of strokes) drawStroke(sk, Infinity, 1);
      }
      if (tut && tut.hint && tut.state === 'play') drawTutHint();
      if (tut && tut.state === 'play') drawBallAt(ball.x, ball.y, ball.ang, ball.vx, ball.vy, ball.grounded);

      const lt = t - TL.line;
      if (lt > 0 && !tut) {
        drawStroke(lineStroke, lt, 1);
        drawStroke(wallStroke, lt, 1);
        ctx.fillStyle = INK;
        const s0 = lineStroke.pts[0];
        ctx.beginPath(); ctx.arc(s0.x - 1, s0.y + 0.5, 3.1, 0, 6.2832); ctx.fill();    // where the nib touched down
        if (lt >= TL.lineDur + TL.wallDur) {
          ctx.beginPath(); ctx.arc(lay.top.x, lay.top.y, 3.3, 0, 6.2832); ctx.fill();   // pressed at the top
        } else {
          const p = tipAt(lt);
          ctx.beginPath(); ctx.arc(p.x, p.y, 2.7, 0, 6.2832); ctx.fill();               // the wet nib
        }
      }
      drawMotes();
      drawSplats();
      if (inky) drawBallAt(ball.x, ball.y, ball.ang, ball.vx, ball.vy, ball.grounded);
      menu();

      screenT();
      helpBox = null;
      if (phase === 'menu') {                       // replaying the opening: a pencil note, not a mode
        ctx.font = '19px ' + FH; ctx.fillStyle = INK; ctx.globalAlpha = 0.3 + 0.3 * helpHot;
        ctx.fillText('how to play', 20, VH - 16);
        const hw = ctx.measureText('how to play').width;
        if (helpHot > 0.05) {
          ctx.strokeStyle = INK; ctx.lineWidth = 1.4; ctx.beginPath();
          ctx.moveTo(20, VH - 11); ctx.lineTo(20 + hw * helpHot, VH - 11 + nn(hw) * 0.8); ctx.stroke();
        }
        ctx.globalAlpha = 1;
        helpBox = { x0: 6, x1: 34 + hw, y0: VH - 44, y1: VH };
      }
      drawSoundToggle(true);
      drawTurn();
    }

    /* ── choosing ──────────────────────────────────────────────────────── */
    function hit(p) {
      for (let i = 0; i < ITEMS.length; i++) {
        const b = ITEMS[i].box;
        if (!b || b.k < 0.6) continue;
        if (p.x >= b.x0 && p.x <= b.x1 && p.y >= b.y0 && p.y <= b.y1) return i;
      }
      return -1;
    }

    function activate(i) {
      if (pending) return;
      if (i === 'zen') { pending = { at: t + 0.12, i: 'zen' }; Sound.click(); return; }
      focus = i;
      under[i] = Math.max(under[i], 0.6);
      Sound.click();
      pending = { at: t + 0.16, i: i };                                // let the underline land first
    }

    function todayNote() {
      const r = Records.daily(Daily.today());
      return r.best ? 'today\u2019s course  \u00b7  your best ' + Math.floor(r.best.dist) + ' m'
                    : 'today\u2019s course  \u00b7  ' + dayLabel(Daily.today(), true);
    }

    function choose(i) {
      pending = null;
      turnPage();
      const go = i === 'zen' ? 'zen' : ITEMS[i].go;
      Stats.mode(go === 'campaign' ? 'c' : go === 'endless' ? 'e' : go === 'daily' ? 'd' : 'z');
      if (go === 'campaign') Campaign.enter(true);
      else if (go === 'daily') Daily.enter(true);
      else startCourse(go, randomSeed());
    }

    const inHelp = function (p) { return helpBox && p.x >= helpBox.x0 && p.x <= helpBox.x1 && p.y >= helpBox.y0 && p.y <= helpBox.y1; };
    function pointer(type, e) {
      if (phase === 'tutorial') { tutPointer(type, e); return; }
      const p = toScreen(e.clientX, e.clientY);
      if (type === 'down') {
        if (pending) return;
        if (inSoundBtn(p)) { Sound.toggle(); return; }
        if (inHelp(p)) { Sound.click(); turnPage(); enter({ tutorial: true }); return; }
        if (zenBox && phase === 'menu' && p.x >= zenBox.x0 && p.x <= zenBox.x1 && p.y >= zenBox.y0 && p.y <= zenBox.y1) {
          activate('zen'); return;
        }
        const i = hit(p);
        if (i >= 0) {
          press = i; pressId = e.pointerId; hover = i;
          try { cv.setPointerCapture(e.pointerId); } catch (err) {}
          return;
        }
        if (phase === 'intro' && !(flow && splatT < 0)) toEnd();   // any other tap: straight to the finished page
                                                     // (but not while the opening is still rolling into the U)
        return;
      }
      if (type === 'move') {
        const i = hit(p);
        if (press >= 0) { if (e.pointerId === pressId) hover = i === press ? press : -1; return; }
        if (e.pointerType === 'mouse') {
          const z = zenBox && p.x >= zenBox.x0 && p.x <= zenBox.x1 && p.y >= zenBox.y0 && p.y <= zenBox.y1;
          const hp = inHelp(p);
          hover = z ? 'zen' : hp ? 'help' : i;
          cv.style.cursor = i >= 0 || z || hp ? 'pointer' : 'default';
        }
        return;
      }
      if (press < 0 || e.pointerId !== pressId) return;
      const was = press;
      press = -1; pressId = null;
      if (type === 'up' && hit(p) === was) activate(was);
      if (e.pointerType !== 'mouse') hover = -1;
    }

    function key(e) {
      if (phase === 'tutorial' || (flow && splatT < 0)) return;     // the opening is played, not skipped
      const k = e.key;
      const shown = menuT !== null && t - menuT > TL.menuGap * 2 + TL.menuDur * 0.6;
      if (k === 'ArrowDown' || k === 'ArrowUp') {
        e.preventDefault();
        if (!shown) toEnd();
        const n = ITEMS.length;
        focus = focus < 0 ? 0 : (focus + (k === 'ArrowUp' ? n - 1 : 1)) % n;
        return;
      }
      if (k === 'Enter' || k === ' ') {
        e.preventDefault();
        if (!shown) { toEnd(); return; }
        activate(focus < 0 ? 0 : focus);
        return;
      }
      if ((k === 'z' || k === 'Z') && shown) { e.preventDefault(); activate('zen'); return; }
      if (phase === 'intro' && k !== 'Shift' && k !== 'Control' && k !== 'Alt' && k !== 'Meta') toEnd();
    }

    return {
      enter: enter, relayout: relayout, update: update, render: render,
      pointer: pointer, key: key, skip: toEnd,
      leave: function () { if (press < 0) hover = -1; cv.style.cursor = 'default'; },
      forget: function () {
        seen = false; tutDone = false;
        try { localStorage.removeItem(SEEN_KEY); localStorage.removeItem(TUT_KEY); } catch (e) {}
      },
      get tut() { return tut ? { n: tut.n, fails: tut.fails, hint: tut.hint, state: tut.state, drew: tut.drewBeforeHint } : null; },
      get flow() { return flow; }, get tutDone() { return tutDone; }, get fade() { return [tutFade, panT, camX]; },
      tutLayout: function () { return lay && lay.tut; },
      help: function () { return helpBox; },
      get phase() { return phase; }, get t() { return t; }, get splatT() { return splatT; },
      get seen() { return seen; }, get inky() { return inky; },
      boxes: function () { return ITEMS.map(function (it) { return it.box; }); },
    };
  })();

  /* ── loop ───────────────────────────────────────────────────────────── */
  let last = performance.now(), frozen = false;
  function frame(now) {
    requestAnimationFrame(frame);           // scheduled first: one bad frame
    let dt = (now - last) / 1000;           // must never stop the game
    last = now;
    if (dt > 0.1) dt = 0.1;
    if (!frozen) update(dt);
    render();
  }

  function start() {
    Sound.prime();
    Stats.start(window.matchMedia && window.matchMedia('(pointer: coarse)').matches ? 'touch' : 'mouse');
    resize();
    Title.enter({ boot: true });
    requestAnimationFrame(frame);
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(function () {});
  }

  /* A small, stable surface for automation: scripted test runs now, and the
     hook a daily-challenge verifier or a ghost-replay importer would use
     later. It reads and drives the same code the player's finger does. */
  window.INKLINE = {
    version: '0.6-test',
    levelId: LEVEL.id,
    state: function () {
      return { state: state, t: runT, ink: ink / INK_MAX, inkSpent: inkSpent,
               x: ball.x, y: ball.y, vx: ball.vx, vy: ball.vy,
               ground: G, grounded: ball.grounded, attempt: attempt,
               progress: Math.min(1, ball.x / LEVEL.finish), reason: deadReason,
               mode: MODE, dist: LEVEL.course ? Gen.metres(runMaxX) : null, camX: camX, camY: camY, scene: scene,
               result: runRes, strokes: strokes.length };
    },
    paint: function (pts) {                    // pts: [{x,y}, ...] in world units
      if (!pts || pts.length < 2 || ink <= 0) return;
      beginStroke(pts[0]);
      for (let i = 1; i < pts.length; i++) extendStroke(pts[i]);
      endStroke();
    },
    place: function (x, y, vx, vy) {
      ball.x = x; ball.y = y; ball.vx = vx || 0; ball.vy = vy || 0;
      camX = Math.max(0, x - VW * 0.32);
    },
    restart: function () { restart(); },
    record: function () { return serializeRun(); },
    scene: function () { return scene; },
    level: function (id) { startLevel(id); },
    levels: function () { return Object.keys(LEVELS); },
    segsNear: function (x, pad) {                // for tests: the ground near x, in h units
      return near(x, pad || 20).map(function (sg) { return [Math.round(sg.x0), Math.round((G - sg.y0) * 10) / 10, Math.round(sg.x1), Math.round((G - sg.y1) * 10) / 10]; });
    },
    tune: function (id, patch) { Object.assign(LEVELS[id], patch); },   // difficulty tuning runs only
    levelInfo: function () { return { id: LEVEL.id, ink: INK_MAX, finish: LEVEL.finish, ground: G }; },
    progress: Progress,
    campaign: Campaign,
    unlocked: function (id) { return unlocked(id); },
    title: Title,
    analytics: Stats,
    sound: Sound,
    /* procedural modes, and a fast-forward for the course-checking bot */
    mode: function (m, seed) {
      if (m === 'daily') { if (seed != null) startCourse('daily', seed, Daily.today()); else startDaily(); }
      else startCourse(m, seed == null ? randomSeed() : seed);
    },
    course: function () { return COURSE; },
    /* a pen in world units, for the simulated players that measure difficulty */
    pen: {
      down: function (p) { if (drawing || ink <= 0 || state !== 'play') return false; beginStroke(p); return true; },
      move: function (p) { if (drawing) extendStroke(p); return !!drawing; },
      up: function () { if (drawing) endStroke(); },
    },
    freeze: function (on) { frozen = !!on; },
    tick: function (dt, n) {
      Sound.hold = true;
      try { for (let i = 0; i < (n || 1); i++) update(dt); } finally { Sound.hold = false; }
    },
    setNow: function (ms) { Clock.off = ms == null ? 0 : ms - Date.now(); },
    daily: Daily,
    records: Records,
    home: function () { Title.enter({ direct: true }); },
    goBack: function () { goBack(); },
    dailyRun: function () { return dailyRun(Gen.metres(runMaxX)); },
    view: function () { return { VW: VW, VH: VH, scale: scale, G: G }; },
  };

  window.addEventListener('resize', resize);
  window.addEventListener('orientationchange', function () { setTimeout(resize, 120); });
  document.addEventListener('visibilitychange', function () {
    last = performance.now();
    if (document.visibilityState === 'hidden') { if (scene === 'play' && state === 'play') Stats.quit(runAttempt, LEVEL.course ? 0 : Math.min(1, ball.x / LEVEL.finish), LEVEL.course ? Gen.metres(runMaxX) : null, 'hidden'); Stats.end(); }
  });
  window.addEventListener('pagehide', function () { Stats.end(); });

  try {
    if (window.claude && window.claude.hot && window.claude.hot.ready) window.claude.hot.ready(start);
    else start();
    if (window.claude && window.claude.hot && window.claude.hot.snapshot)
      window.claude.hot.snapshot(function () { return {}; });
  } catch (e) { start(); }
})();
</script>

</body>
